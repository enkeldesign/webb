<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TURN Supercar GARAGE visual regression</title>
  <link rel="stylesheet" href="/turn/design-tokens.css">
  <link rel="stylesheet" href="/turn/styles.css">
  <link rel="stylesheet" href="/turn/pre-race.css">
  <script>
    globalThis.__TURN_BUILD__ = Object.freeze({
      version: '1.17.8',
      id: '2026.09.08-r208',
      cacheKey: '20260908-r208'
    });
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
        "/turn/vehicle/catalog.js": "/turn/vehicle/catalog.js?revision=r253-supercar-release",
        "/turn/vehicle/catalog.js?revision=r250-supercar-finish": "/turn/vehicle/catalog.js?revision=r253-supercar-release",
        "/turn/vehicle/car-models.js": "/turn/vehicle/car-models.js?revision=r257-authored-wheel-spin",
        "/turn/vehicle/car-models.js?revision=r252-supercar-outward-rims": "/turn/vehicle/car-models.js?revision=r257-authored-wheel-spin",
        "/turn/vehicle/car-models.js?revision=r253-supercar-release": "/turn/vehicle/car-models.js?revision=r257-authored-wheel-spin"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import { unlockRewardsForTesting } from '/turn/testing/admin-unlock-sequence.js';
    import { prepareGarage, showGarage } from '/turn/garage/garage.js';

    globalThis.__supercarLotVisualReady = false;
    globalThis.__supercarLotVisualFailure = null;
    // The Supercar and Paintjob are Trophy Road rewards: unlock them for this page.
    unlockRewardsForTesting();
    await prepareGarage();
    void showGarage({
      initialSelection: {
        carId: 'supercar',
        color: '#000000',
        secondaryColor: '#ffbb00'
      },
      trackId: 'countryside',
      trackName: 'Countryside'
    });
    document.querySelector('.garage-paint-toggle')?.click();

    const startedAt = performance.now();
    const timer = globalThis.setInterval(() => {
      const garage = document.querySelector('.garage');
      const canvas = document.querySelector('.garage-view canvas');
      if (garage && !garage.classList.contains('is-loading') && canvas?.width > 0 && canvas?.height > 0) {
        globalThis.clearInterval(timer);
        globalThis.__supercarLotVisualMetrics = Object.freeze({
          selected: document.querySelector('.garage-name')?.textContent?.trim(),
          canvasWidth: canvas.width,
          canvasHeight: canvas.height,
          bodyColor: document.querySelector('#garagePaintBody')?.value || '',
          rimColor: document.querySelector('#garagePaintSecondary')?.value || ''
        });
        globalThis.__supercarLotVisualReady = true;
      } else if (performance.now() - startedAt > 60000) {
        globalThis.clearInterval(timer);
        globalThis.__supercarLotVisualFailure = 'Timed out waiting for the Supercar GARAGE preview.';
      }
    }, 50);
  </script>
</body>
</html>

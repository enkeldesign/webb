<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>TURN LAB r216 · World V2 macro landmarks</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #9fc7d4; }
    canvas { width: 100%; height: 100%; display: block; }
    #label { position: fixed; left: 18px; top: 16px; z-index: 2; padding: 7px 10px; border: 2px solid #08090a; border-radius: 9px; background: rgba(255,248,232,.92); color: #08090a; font: 800 13px/1 system-ui,sans-serif; letter-spacing: .04em; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="label">TURN LAB r216 · WORLD V2 MACRO LANDMARKS</div>
  <script type="module">
    import * as THREE from 'three';
    import { buildWorldPlaygroundV2Environment } from '/turn/training/world-playground-v2-environment.js?revision=r2-macro-landmarks-lab-r216';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9fc7d4);
    scene.fog = new THREE.Fog(0xb8d4d8, 1180, 3900);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.04;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xd8eff4, 0x62705a, 1.7));
    const sun = new THREE.DirectionalLight(0xffefd0, 3.05);
    sun.position.set(-720, 1150, 680);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -1350;
    sun.shadow.camera.right = 1350;
    sun.shadow.camera.top = 1350;
    sun.shadow.camera.bottom = -1350;
    sun.shadow.camera.near = 50;
    sun.shadow.camera.far = 3000;
    sun.shadow.bias = -0.00012;
    scene.add(sun);

    const course = buildWorldPlaygroundV2Environment();
    scene.add(course.world);
    await Promise.race([
      course.landmarksReady || Promise.resolve(),
      new Promise((resolve) => setTimeout(resolve, 8000))
    ]);

    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.5, 7000);
    const views = Object.freeze({
      overview: { p: [180, 1620, 1740], t: [-40, 35, -100], fov: 49 },
      harbor: { p: [-970, 150, 760], t: [-640, 20, 490], fov: 50 },
      cliffside: { p: [-1300, 245, 70], t: [-820, 78, -270], fov: 51 },
      mountain: { p: [-790, 445, -420], t: [-270, 145, -815], fov: 49 },
      countryside: { p: [980, 185, 760], t: [580, 25, 315], fov: 50 },
      airport: { p: [1370, 245, 250], t: [900, 30, -40], fov: 50 },
      city: { p: [-470, 285, 1000], t: [-105, 70, 510], fov: 48 },
      crossworld: { p: [760, 360, 875], t: [-190, 70, 390], fov: 47 }
    });

    function setView(name) {
      const view = views[name] || views.overview;
      camera.position.set(...view.p);
      camera.fov = view.fov;
      camera.updateProjectionMatrix();
      camera.lookAt(...view.t);
      renderer.render(scene, camera);
      document.querySelector('#label').textContent = `TURN LAB r216 · ${String(name).toUpperCase()}`;
      return true;
    }

    globalThis.__turnWorldV2LandmarkVisual = Object.freeze({
      ready: true,
      revision: 'r216-macro-landmarks',
      approximateLength: course.approximateLength,
      classicAssetsReady: course.landmarks?.userData?.classicAssetsReady === true,
      setView
    });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.render(scene, camera);
    });
    setView('overview');
  </script>
</body>
</html>

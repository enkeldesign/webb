name: Finalize TURN r221 release contract

on:
  push:
    branches:
      - feature/turn-low-graphics-r221

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/turn-low-graphics-r221
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Update release contract and future build routing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          release_script = Path('turn/scripts/release.mjs')
          source = release_script.read_text()
          anchor = '''function renderSharedResourceImports(source, release) {
            return source.replace(/<script type="importmap">\\s*([\\s\\S]*?)\\s*<\\/script>/, (_, jsonText) => {
              const importMap = JSON.parse(jsonText);
              synchronizeScoreStoreTargets(importMap, release);
              synchronizeVisualResourceTargets(importMap, release);
              return `<script type="importmap">\\n${indentJson(importMap, 4)}\\n  </script>`;
            });
          }
          '''
          replacement = '''function synchronizeGraphicsRuntimeTarget(importMap, release) {
            const imports = importMap.imports ||= {};
            const nativeTarget = imports['three-native']
              || (typeof imports.three === 'string' && /^https:\\/\\/cdn\\.jsdelivr\\.net\\/npm\\/three@/.test(imports.three)
                ? imports.three : null);
            if (!nativeTarget) return;
            imports['three-native'] = nativeTarget;
            imports.three = `/turn/three-runtime.js?build=${release.cacheKey}`;
          }

          function renderSharedResourceImports(source, release) {
            return source.replace(/<script type="importmap">\\s*([\\s\\S]*?)\\s*<\\/script>/, (_, jsonText) => {
              const importMap = JSON.parse(jsonText);
              synchronizeScoreStoreTargets(importMap, release);
              synchronizeVisualResourceTargets(importMap, release);
              synchronizeGraphicsRuntimeTarget(importMap, release);
              return `<script type="importmap">\\n${indentJson(importMap, 4)}\\n  </script>`;
            });
          }
          '''
          if anchor not in source:
              raise SystemExit('release.mjs shared-resource anchor not found')
          source = source.replace(anchor, replacement, 1)
          anchor2 = '''  synchronizeScoreStoreTargets(importMap, release);
            synchronizeVisualResourceTargets(importMap, release);
            synchronizeReleaseBoundImportTarget(importMap, release, SESSION_ORCHESTRATOR_SPECIFIER);'''
          replacement2 = '''  synchronizeScoreStoreTargets(importMap, release);
            synchronizeVisualResourceTargets(importMap, release);
            synchronizeGraphicsRuntimeTarget(importMap, release);
            synchronizeReleaseBoundImportTarget(importMap, release, SESSION_ORCHESTRATOR_SPECIFIER);'''
          if anchor2 not in source:
              raise SystemExit('release.mjs runtime synchronization anchor not found')
          release_script.write_text(source.replace(anchor2, replacement2, 1))

          test = Path('turn-tests/release-production.mjs')
          source = test.read_text()
          old = "assert.match(importMap.imports.three, /^https:\\/\\/cdn\\.jsdelivr\\.net\\/npm\\/three@/);"
          new = """assert.match(importMap.imports['three-native'], /^https:\\/\\/cdn\\.jsdelivr\\.net\\/npm\\/three@/);\nassert.equal(importMap.imports.three, `/turn/three-runtime.js?build=${release.cacheKey}`,\n  'Production Three.js imports must pass through the current-build graphics runtime');"""
          if old not in source:
              raise SystemExit('release-production Three.js assertion anchor not found')
          source = source.replace(old, new, 1)
          anchor3 = "const futureImports = JSON.parse(futureImportMapText).imports;"
          replacement3 = """const futureImports = JSON.parse(futureImportMapText).imports;\nassert.match(futureImports['three-native'], /^https:\\/\\/cdn\\.jsdelivr\\.net\\/npm\\/three@/);\nassert.equal(futureImports.three, `/turn/three-runtime.js?build=${futureRelease.cacheKey}`,\n  'Future releases must advance the shared graphics runtime identity');"""
          if anchor3 not in source:
              raise SystemExit('future release import-map anchor not found')
          test.write_text(source.replace(anchor3, replacement3, 1))
          PY
          node turn/scripts/release.mjs --write
          node turn/scripts/release.mjs --check
          node turn-tests/release-production.mjs
      - name: Commit final release contract
        run: |
          if git diff --quiet; then
            echo "Release contract already finalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turn/scripts/release.mjs turn-tests/release-production.mjs turn-lab/index.html turn-next/index.html turn-next/app.js yourturn/index.html turn/ui/about-history-bootstrap-r165.js turn/content/about-history-current.js turn/design.html turn/design-dialogs.html
          git commit -m "Finalize LOW GRAPHICS release routing"
          git push origin HEAD:feature/turn-low-graphics-r221

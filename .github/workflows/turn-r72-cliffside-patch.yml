name: TURN r72 Cliffside patch

on:
  push:
    branches:
      - agent/turn-r72-forgiving-cliffside-shoulders
    paths:
      - 'turn/scripts/patch-r72-cliffside.mjs'
      - '.github/workflows/turn-r72-cliffside-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/turn-r72-forgiving-cliffside-shoulders
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node turn/scripts/patch-r72-cliffside.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turn/vehicle/physics.js turn/tracks/cliffside-world.js turn-lab/tests/multi-track-production.mjs
          git diff --cached --quiet && exit 0
          git commit -m "TURN r72: add forgiving Cliffside shoulders"
          git push origin HEAD:agent/turn-r72-forgiving-cliffside-shoulders

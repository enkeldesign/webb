name: Apply TURN brighter emergency lights

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/turn-brighter-emergency-lights.yml'
  push:
    branches:
      - agent/turn-brighter-emergency-lights
    paths:
      - '.github/workflows/turn-brighter-emergency-lights.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/turn-brighter-emergency-lights
          fetch-depth: 0

      - name: Apply high-visibility emergency light pass
        run: |
          python .github/scripts/brighten-turn-emergency-lights.py
          python - <<'PY'
          from pathlib import Path
          path = Path('turn-tests/design-system-production.mjs')
          text = path.read_text(encoding='utf-8')
          text = text.replace(r'2026\.08\.03-R125', r'2026\.08\.03-R126')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Synchronize release and TURN NEXT parity
        run: |
          node turn/scripts/release.mjs --write
          node turn-next/scripts/build-parity-app.mjs
          node turn-next/scripts/build-parity-main.mjs
          node turn-next/scripts/build-parity-entry.mjs

      - name: Verify focused regressions
        run: |
          node --check turn/vehicle/car-models.js
          node turn-lab/tests/emergency-vehicles-production.mjs
          node turn-tests/design-system-production.mjs
          node turn/scripts/release.mjs --check
          node turn-next/scripts/build-parity-app.mjs --check
          node turn-next/scripts/build-parity-main.mjs --check
          node turn-next/scripts/build-parity-entry.mjs --check

      - name: Commit brighter emergency lights
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add turn turn-next turn-tests turn-lab/tests
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Brighten emergency vehicle boost lights'
          git fetch origin agent/turn-brighter-emergency-lights
          git rebase origin/agent/turn-brighter-emergency-lights
          git push origin HEAD:agent/turn-brighter-emergency-lights

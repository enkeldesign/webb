name: TURN r239 perk feedback prep v3

on:
  push:
    branches:
      - feat/perk-feedback-overdrive-r239

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/perk-feedback-overdrive-r239
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply corrected r239 source changes
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/tmp-r239-perk-feedback.yml').read_text()
          marker = "          node <<'NODE'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          NODE", start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'

          old_assert = "assert.match(flowShiftSource, /showCompactRacePill\\(nextGreatFlow \\? 'FLOW SHIFT ACTIVE' : 'FLOW SHIFT LOST'/,"
          new_assert = "assert.ok(flowShiftSource.includes(\"showCompactRacePill(nextGreatFlow ? 'FLOW SHIFT ACTIVE' : 'FLOW SHIFT LOST'\"),"
          if old_assert not in script:
              raise SystemExit('Expected FLOW SHIFT assertion source was not found')
          script = script.replace(old_assert, new_assert, 1)

          old_import = "import { showCompactRacePill } from '/turn/achievements/support-challenge-feedback.js';"
          new_import = "import { showCompactRacePill } from '../achievements/support-challenge-feedback.js';"
          if old_import not in script:
              raise SystemExit('Expected FLOW SHIFT feedback import source was not found')
          script = script.replace(old_import, new_import, 1)

          Path('/tmp/apply-r239.cjs').write_text(script)
          PY
          node /tmp/apply-r239.cjs
      - name: Synchronize release surfaces
        run: node turn/scripts/release.mjs --write
      - name: Run focused regressions
        run: |
          node turn/scripts/release.mjs
          node turn-tests/support-challenges-production.mjs
          node turn-tests/flow-shift-tuning-production.mjs
          node turn-tests/post-soak-production.mjs
          node turn-lab/tests/vehicle-drift-production.mjs
          node turn-tests/release-composition-production.mjs --base-ref=origin/main
      - name: Remove temporary workflows and commit
        run: |
          rm .github/workflows/tmp-r239-perk-feedback.yml
          rm .github/workflows/tmp-r239-perk-feedback-v2.yml
          rm .github/workflows/tmp-r239-perk-feedback-v3.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Refine perk feedback and uncap OVERDRIVE"
          git push origin HEAD:feat/perk-feedback-overdrive-r239

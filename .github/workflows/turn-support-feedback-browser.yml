name: TURN browser regressions

on:
  pull_request:
    paths:
      - 'turn/achievements/support-challenge-feedback.js'
      - 'turn/achievements/support-challenges.js'
      - 'turn/achievements/home-reward-replay-r225.js'
      - 'turn/achievements/runtime.js'
      - 'turn/achievements/view.js'
      - 'turn/m8-home.js'
      - 'turn/scripts/release.mjs'
      - 'turn-tests/support-feedback-browser-smoke.mjs'
      - 'turn-tests/responsive-browser-smoke.mjs'
      - 'turn-tests/race-menu-browser-smoke.mjs'
      - 'turn/ui/race-menu.js'
      - 'turn-tests/roadbook-browser-smoke.mjs'
      - 'turn/roadbook/**'
      - 'turn-tests/garage-browser-smoke.mjs'
      - 'turn/garage/**'
      - 'turn/pre-race.css'
      - 'turn/ui/home-app-bar.js'
      - 'turn/home-app-bar.css'
      - 'turn/responsive.css'
      - 'turn/main.js'
      - 'turn/index.html'
      - 'turn/ui/race-orientation.js'
      - 'turn/ui/track-intro.js'
      - 'turn/orientation-compat.js'
      - 'turn/ui/app-navigation.js'
      - 'turn/app-navigation.css'
      - 'turn/surfaces.css'
      - 'turn/app.js'
      - 'turn-tests/app-navigation-browser-smoke.mjs'
      - 'turn/sw.js'
      - 'turn-next/sw.js'
      - 'turn/ui/offline.js'
      - 'turn/offline.css'
      - 'turn/offline-precache.json'
      - 'turn/vendor/**'
      - 'turn-tests/offline-browser-smoke.mjs'
      - 'turn/race/race-clock.js'
      - 'turn/race/race-pause.js'
      - 'turn/ui/race-pause-menu.js'
      - 'turn/race-pause.css'
      - 'turn/main.js'
      - 'turn/ui/gameplay-controls.js'
      - 'turn/scoring/flow-runtime.js'
      - 'turn/scoring/drift-attack-runtime.js'
      - 'turn-tests/race-pause-browser-smoke.mjs'
      - '.github/workflows/turn-support-feedback-browser.yml'
  push:
    branches:
      - main
    paths:
      - 'turn/achievements/support-challenge-feedback.js'
      - 'turn/achievements/support-challenges.js'
      - 'turn/achievements/home-reward-replay-r225.js'
      - 'turn/achievements/runtime.js'
      - 'turn/achievements/view.js'
      - 'turn/m8-home.js'
      - 'turn/scripts/release.mjs'
      - 'turn-tests/support-feedback-browser-smoke.mjs'
      - 'turn-tests/responsive-browser-smoke.mjs'
      - 'turn-tests/race-menu-browser-smoke.mjs'
      - 'turn/ui/race-menu.js'
      - 'turn-tests/roadbook-browser-smoke.mjs'
      - 'turn/roadbook/**'
      - 'turn-tests/garage-browser-smoke.mjs'
      - 'turn/garage/**'
      - 'turn/pre-race.css'
      - 'turn/ui/home-app-bar.js'
      - 'turn/home-app-bar.css'
      - 'turn/responsive.css'
      - 'turn/main.js'
      - 'turn/index.html'
      - 'turn/ui/race-orientation.js'
      - 'turn/ui/track-intro.js'
      - 'turn/orientation-compat.js'
      - 'turn/ui/app-navigation.js'
      - 'turn/app-navigation.css'
      - 'turn/surfaces.css'
      - 'turn/app.js'
      - 'turn-tests/app-navigation-browser-smoke.mjs'
      - 'turn/sw.js'
      - 'turn-next/sw.js'
      - 'turn/ui/offline.js'
      - 'turn/offline.css'
      - 'turn/offline-precache.json'
      - 'turn/vendor/**'
      - 'turn-tests/offline-browser-smoke.mjs'
      - 'turn/race/race-clock.js'
      - 'turn/race/race-pause.js'
      - 'turn/ui/race-pause-menu.js'
      - 'turn/race-pause.css'
      - 'turn/main.js'
      - 'turn/ui/gameplay-controls.js'
      - 'turn/scoring/flow-runtime.js'
      - 'turn/scoring/drift-attack-runtime.js'
      - 'turn-tests/race-pause-browser-smoke.mjs'
      - '.github/workflows/turn-support-feedback-browser.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  support-feedback-browser:
    # Four parallel shards of about three minutes each (measured 2026-10-02: the eight
    # smokes took about eleven minutes in one job). Each smoke and the browser install
    # have their own time limit, so a hung run fails in minutes, not at the job limit.
    name: browser (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: roadbook
            tests: >-
              turn-tests/roadbook-browser-smoke.mjs
              turn-tests/race-menu-browser-smoke.mjs
              turn-tests/support-feedback-browser-smoke.mjs
          - shard: garage
            tests: >-
              turn-tests/garage-browser-smoke.mjs
              turn-tests/offline-browser-smoke.mjs
          - shard: responsive
            tests: >-
              turn-tests/responsive-browser-smoke.mjs
              turn-tests/race-pause-browser-smoke.mjs
          - shard: navigation
            tests: >-
              turn-tests/app-navigation-browser-smoke.mjs
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright browsers
        timeout-minutes: 12
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 three@0.184.0
          # System packages install once (apt holds a lock, so it is never cut off and retried);
          # only the browser download, which can stall, is retried.
          npx playwright install-deps chromium webkit
          timeout 180 npx playwright install chromium webkit \
            || timeout 180 npx playwright install chromium webkit

      - name: Start static TURN server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/turn-support-feedback-http.log 2>&1 &
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8000/ >/dev/null && exit 0
            sleep 0.5
          done
          cat /tmp/turn-support-feedback-http.log
          exit 1

      - name: Run browser smokes
        run: |
          for test in ${{ matrix.tests }}; do
            echo "::group::$test"
            timeout 420 node "$test" || { status=$?; echo "::endgroup::"; echo "::error::$test failed (exit $status; 124 means it ran over 7 minutes)"; exit $status; }
            echo "::endgroup::"
          done

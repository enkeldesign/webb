name: TURN support feedback browser regression

on:
  pull_request:
    paths:
      - 'turn/achievements/support-challenge-feedback.js'
      - 'turn/achievements/support-challenges.js'
      - 'turn/achievements/home-reward-replay-r225.js'
      - 'turn/achievements/runtime.js'
      - 'turn/achievements/view.js'
      - 'turn/m8-home.js'
      - 'turn/scripts/release.mjs'
      - 'turn-tests/support-feedback-browser-smoke.mjs'
      - '.github/workflows/turn-support-feedback-browser.yml'
  push:
    branches:
      - main
    paths:
      - 'turn/achievements/support-challenge-feedback.js'
      - 'turn/achievements/support-challenges.js'
      - 'turn/achievements/home-reward-replay-r225.js'
      - 'turn/achievements/runtime.js'
      - 'turn/achievements/view.js'
      - 'turn/m8-home.js'
      - 'turn/scripts/release.mjs'
      - 'turn-tests/support-feedback-browser-smoke.mjs'
      - '.github/workflows/turn-support-feedback-browser.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  support-feedback-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright browsers
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium webkit

      - name: Start static TURN server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/turn-support-feedback-http.log 2>&1 &
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8000/ >/dev/null && exit 0
            sleep 0.5
          done
          cat /tmp/turn-support-feedback-http.log
          exit 1

      - name: Verify support feedback lifecycle in Chromium and WebKit
        run: node turn-tests/support-feedback-browser-smoke.mjs

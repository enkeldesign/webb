name: POSTAL game tests

on:
  pull_request:
    paths:
      - "postal/**"
      - ".github/workflows/postal-game-tests.yml"
  push:
    branches: [main]
    paths:
      - "postal/**"
      - ".github/workflows/postal-game-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check postal/main.mjs
          node --check postal/sw.js
          for file in postal/runtime/*.js; do node --check "$file"; done
      - name: Test the logistics simulation
        run: node --test postal/tests/*.test.mjs

name: TURN r229 MOUNTAIN regression updater

on:
  push:
    branches:
      - fix/head-start-flying-lap-r229

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/head-start-flying-lap-r229
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fix stale MOUNTAIN release assertions
        run: python3 .github/turn-r229-mountain-test.py
      - name: Validate MOUNTAIN and inspect stale r228 test literals
        run: |
          node turn-tests/mountain-track-production.mjs
          node turn-lab/tests/multi-track-production.mjs
          node turn/scripts/release.mjs --check
          echo 'Remaining r228 literals in test trees:'
          grep -R -n '20260914-r228' turn-tests turn-lab/tests || true
          git diff --check
      - name: Commit regression fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turn-tests/mountain-track-production.mjs
          git commit -m "Bind MOUNTAIN regression to current release"
          git push origin HEAD:fix/head-start-flying-lap-r229

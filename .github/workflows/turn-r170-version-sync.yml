name: Regenerate TURN v1.8.5 r170 release entries

on:
  push:
    branches:
      - polish/airport-harbor-ground-detail
    paths:
      - '.github/workflows/turn-r170-version-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: polish/airport-harbor-ground-detail

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Regenerate release identities
        run: |
          node turn/scripts/release.mjs --write
          python3 - <<'PY'
          from pathlib import Path

          replacements = [
              ('turn-next/index.html', "Source TURN v1.8.0 · Build 2026.08.16-r169", "Source TURN v1.8.5 · Build 2026.08.16-r170"),
              ('turn-next/index.html', "version: '1.8.0'", "version: '1.8.5'"),
              ('turn-next/index.html', '2026.08.16-r169', '2026.08.16-r170'),
              ('turn-next/index.html', '20260816-r169', '20260816-r170'),
              ('turn/content/about-history.js', "version: '1.8.0'", "version: '1.8.5'"),
              ('turn/content/about-history.js', "build: '2026.08.16-r169'", "build: '2026.08.16-r170'"),
              ('turn/content/about-history.js', "note: 'Refines TURN’s road-edge colour, start-area identity and visual consistency while preserving racing behaviour.'", "note: 'TURN 1.8.5 adds the latest visual-consistency pass, including lightweight Airport and Harbor ground detail, while preserving racing behaviour.'"),
              ('turn/ui/about-history-bootstrap-r165.js', '20260816-r169', '20260816-r170'),
          ]
          for filename, old, new in replacements:
              path = Path(filename)
              text = path.read_text()
              if old in text:
                  path.write_text(text.replace(old, new))
          PY
          node turn-next/scripts/build-parity-app.mjs --write
          node turn-next/scripts/build-parity-main.mjs --write

      - name: Verify generated release contracts
        run: |
          node turn/scripts/release.mjs --check
          node turn-next/scripts/build-parity-app.mjs --check
          node turn-next/scripts/build-parity-main.mjs --check
          node turn-next/scripts/build-parity-entry.mjs --check
          node turn-tests/release-production.mjs
          node turn-tests/about-history-production.mjs
          node turn-lab/tests/multi-track-production.mjs
          node --check turn/tracks/ground-detail-polish-r521.js

      - name: Commit generated files and remove temporary workflow
        run: |
          git rm .github/workflows/turn-r170-version-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Regenerate TURN v1.8.5 r170 release entries'
          git push origin HEAD:polish/airport-harbor-ground-detail

name: TURN admin unlock regression

on:
  pull_request:
    branches:
      - main
    paths:
      - 'turn/index.html'
      - 'turn/testing/admin-unlock-sequence.js'
      - 'turn/achievements/**'
      - 'turn/progression/**'
      - 'turn-lab/tests/admin-unlock-production.mjs'
      - '.github/workflows/turn-admin-unlock-test.yml'
  push:
    branches:
      - main
    paths:
      - 'turn/index.html'
      - 'turn/testing/admin-unlock-sequence.js'
      - 'turn/achievements/**'
      - 'turn/progression/**'
      - 'turn-lab/tests/admin-unlock-production.mjs'
      - '.github/workflows/turn-admin-unlock-test.yml'

permissions:
  contents: write

jobs:
  rival-persistence-sync:
    if: github.event_name == 'pull_request' && github.head_ref == 'turn-performance-loading-review'
    runs-on: ubuntu-latest
    steps:
      - name: Check out performance branch
        uses: actions/checkout@v4
        with:
          ref: turn-performance-loading-review

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Defer replay persistence off lap-completion frame
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function read(path) { return fs.readFileSync(path, 'utf8'); }
          function write(path, source) { fs.writeFileSync(path, source); }
          function replace(path, from, to, label) {
            const source = read(path);
            if (!source.includes(from)) throw new Error(`${path}: missing ${label}`);
            write(path, source.replace(from, to));
          }
          function replaceRegex(path, pattern, to, label) {
            const source = read(path);
            if (!pattern.test(source)) throw new Error(`${path}: missing ${label}`);
            pattern.lastIndex = 0;
            write(path, source.replace(pattern, to));
          }

          replace(
            'turn/race/rival-storage.js',
            "const LEGACY_RIVAL_COLORS = ['#38d9ff', '#ff4fa3', '#9775fa', '#ff922b'];",
            `const LEGACY_RIVAL_COLORS = ['#38d9ff', '#ff4fa3', '#9775fa', '#ff922b'];\nconst pendingRivalSaves = new Map();\nlet pendingRivalFlush = null;\nlet persistenceLifecycleInstalled = false;`,
            'rival storage constants'
          );

          replaceRegex(
            'turn/race/rival-storage.js',
            /export function saveRivalsState\(state, \{ trackId \} = \{\}\) \{[\s\S]*?\n\}\n\nexport function loadRivalsState/,
            `function rivalSavePayload(state, trackId) {\n  const activeTrackId = stateTrackId(state, trackId);\n  return {\n    key: rivalKey(activeTrackId),\n    value: {\n      version: 6,\n      trackId: activeTrackId,\n      trackRevision: storageTrackId(activeTrackId),\n      laps: state.competitorLaps.filter(isValidLap)\n    }\n  };\n}\n\nfunction writeRivalPayload(payload) {\n  localStorage.setItem(payload.key, JSON.stringify(payload.value));\n}\n\nfunction cancelScheduledRivalFlush() {\n  if (!pendingRivalFlush) return;\n  if (pendingRivalFlush.type === 'idle') globalThis.cancelIdleCallback?.(pendingRivalFlush.id);\n  else globalThis.clearTimeout?.(pendingRivalFlush.id);\n  pendingRivalFlush = null;\n}\n\nexport function flushScheduledRivalsState() {\n  cancelScheduledRivalFlush();\n  if (!pendingRivalSaves.size) return true;\n  let success = true;\n  const payloads = [...pendingRivalSaves.values()];\n  pendingRivalSaves.clear();\n  for (const payload of payloads) {\n    try {\n      writeRivalPayload(payload);\n    } catch (_) {\n      success = false;\n    }\n  }\n  return success;\n}\n\nfunction ensurePersistenceLifecycle() {\n  if (persistenceLifecycleInstalled) return;\n  persistenceLifecycleInstalled = true;\n  globalThis.addEventListener?.('pagehide', flushScheduledRivalsState);\n  globalThis.document?.addEventListener?.('visibilitychange', () => {\n    if (globalThis.document?.visibilityState === 'hidden') flushScheduledRivalsState();\n  });\n}\n\nfunction schedulePendingRivalFlush() {\n  if (pendingRivalFlush) return;\n  const flush = () => {\n    pendingRivalFlush = null;\n    flushScheduledRivalsState();\n  };\n  if (typeof globalThis.requestIdleCallback === 'function') {\n    const id = globalThis.requestIdleCallback(flush, { timeout: 800 });\n    pendingRivalFlush = { type: 'idle', id };\n  } else {\n    const id = globalThis.setTimeout(flush, 32);\n    pendingRivalFlush = { type: 'timeout', id };\n  }\n}\n\nexport function scheduleRivalsStateSave(state, { trackId } = {}) {\n  try {\n    const payload = rivalSavePayload(state, trackId);\n    pendingRivalSaves.set(payload.key, payload);\n    ensurePersistenceLifecycle();\n    schedulePendingRivalFlush();\n    return true;\n  } catch (_) {\n    return false;\n  }\n}\n\nexport function saveRivalsState(state, { trackId } = {}) {\n  try {\n    const payload = rivalSavePayload(state, trackId);\n    pendingRivalSaves.delete(payload.key);\n    if (!pendingRivalSaves.size) cancelScheduledRivalFlush();\n    writeRivalPayload(payload);\n    return true;\n  } catch (_) {\n    return false;\n  }\n}\n\nexport function loadRivalsState`,
            'synchronous rival save implementation'
          );

          replace(
            'turn/race/rival-storage.js',
            `    if (state.competitorLaps.length) saveRivalsState(state, { trackId: activeTrackId });`,
            `    if (state.competitorLaps.length) scheduleRivalsStateSave(state, { trackId: activeTrackId });`,
            'startup rival normalization write'
          );

          replace(
            'turn/main.js',
            `import { RIVAL_LIMIT, loadRivalsState, saveRivalsState } from '/turn/race/rival-storage.js?build=20260720-r19';`,
            `import { RIVAL_LIMIT, loadRivalsState, scheduleRivalsStateSave } from '/turn/race/rival-storage.js?build=20260720-r19';`,
            'rival storage import'
          );
          replace(
            'turn/main.js',
            `function saveGhost() {\n  saveRivalsState(state);\n}`,
            `function saveGhost() {\n  scheduleRivalsStateSave(state);\n}`,
            'lap saveGhost hook'
          );

          replace(
            'turn-lab/tests/runtime-hotpath-performance-production.mjs',
            `  homeLayout,\n  worldRender\n] = await Promise.all([`,
            `  homeLayout,\n  worldRender,\n  rivalStorage,\n  mainSource\n] = await Promise.all([`,
            'hotpath test destructuring'
          );
          replace(
            'turn-lab/tests/runtime-hotpath-performance-production.mjs',
            `  fs.readFile(new URL('../../turn/m8-home-fixed-layout.js', import.meta.url), 'utf8'),\n  fs.readFile(new URL('../../turn/render/world.js', import.meta.url), 'utf8')\n]);`,
            `  fs.readFile(new URL('../../turn/m8-home-fixed-layout.js', import.meta.url), 'utf8'),\n  fs.readFile(new URL('../../turn/render/world.js', import.meta.url), 'utf8'),\n  fs.readFile(new URL('../../turn/race/rival-storage.js', import.meta.url), 'utf8'),\n  fs.readFile(new URL('../../turn/main.js', import.meta.url), 'utf8')\n]);`,
            'hotpath test sources'
          );
          replace(
            'turn-lab/tests/runtime-hotpath-performance-production.mjs',
            `const worldPrewarm = worldRender.indexOf('const worldModulesPromise = loadWorldModules();');`,
            `// Replay serialization can dwarf a toast update. Lap completion queues the four-rival payload\n// for idle time and flushes it on page hide so the timed lap frame does not pay JSON/storage cost.\nassert.match(mainSource, /function saveGhost\\(\\) \\{[\\s\\S]*scheduleRivalsStateSave\\(state\\)/);\nassert.doesNotMatch(mainSource, /function saveGhost\\(\\) \\{[\\s\\S]*saveRivalsState\\(state\\)/);\nassert.match(rivalStorage, /requestIdleCallback\\(flush, \\{ timeout: 800 \\}\\)/);\nassert.match(rivalStorage, /addEventListener\\?\\.\\('pagehide', flushScheduledRivalsState\\)/);\nassert.match(rivalStorage, /pendingRivalSaves = new Map\\(\\)/);\n\nconst worldPrewarm = worldRender.indexOf('const worldModulesPromise = loadWorldModules();');`,
            'hotpath rival persistence assertions'
          );
          NODE

      - name: Verify rival persistence optimization
        run: |
          node --check turn/race/rival-storage.js
          node --check turn/main.js
          node turn-lab/tests/runtime-hotpath-performance-production.mjs
          git diff --check

      - name: Commit rival persistence optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turn/race/rival-storage.js turn/main.js turn-lab/tests/runtime-hotpath-performance-production.mjs
          git commit -m "Move replay persistence off the lap frame"
          git push origin HEAD:turn-performance-loading-review

  admin-unlock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run hidden admin unlock regression
        run: node turn-lab/tests/admin-unlock-production.mjs

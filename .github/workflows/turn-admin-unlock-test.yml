name: TURN admin unlock regression

on:
  pull_request:
    branches:
      - main
    paths:
      - 'turn/index.html'
      - 'turn/testing/admin-unlock-sequence.js'
      - 'turn/achievements/**'
      - 'turn/progression/**'
      - 'turn-lab/tests/admin-unlock-production.mjs'
      - '.github/workflows/turn-admin-unlock-test.yml'
  push:
    branches:
      - main
    paths:
      - 'turn/index.html'
      - 'turn/testing/admin-unlock-sequence.js'
      - 'turn/achievements/**'
      - 'turn/progression/**'
      - 'turn-lab/tests/admin-unlock-production.mjs'
      - '.github/workflows/turn-admin-unlock-test.yml'

permissions:
  contents: write

jobs:
  release-sync:
    if: github.event_name == 'pull_request' && github.head_ref == 'turn-hatchback-rally-model-swap'
    runs-on: ubuntu-latest
    steps:
      - name: Check out vehicle swap branch
        uses: actions/checkout@v4
        with:
          ref: turn-hatchback-rally-model-swap

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prepare TURN 1.10.2 r181 identity and module graph
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          fs.writeFileSync('turn/release.json', `${JSON.stringify({
            version: '1.10.2',
            id: '2026.08.23-r181',
            cacheKey: '20260823-r181'
          }, null, 2)}\n`);

          function replace(pathname, from, to) {
            const before = fs.readFileSync(pathname, 'utf8');
            if (before.includes(to)) return;
            if (!before.includes(from)) throw new Error(`${pathname}: missing expected text: ${from}`);
            fs.writeFileSync(pathname, before.replaceAll(from, to));
          }

          replace(
            'turn/vehicle/car-models.js',
            './semantic-car-finish.js?revision=r180-paint-uv',
            './semantic-car-finish.js?revision=r181-hatchback-rally'
          );
          replace(
            'turn/vehicle/emergency-livery-models.js',
            './car-models.js?build=20260823-r180-native-car-surfaces',
            './car-models.js?build=20260823-r181-native-car-surfaces'
          );

          for (const filename of fs.readdirSync('turn/achievements')) {
            if (!filename.endsWith('.js')) continue;
            const pathname = path.join('turn/achievements', filename);
            let source = fs.readFileSync(pathname, 'utf8');
            source = source
              .replaceAll('./catalog.js?revision=r166-bella-records', './catalog.js?revision=r181-hatchback-rally')
              .replaceAll('./secret-catalog.js?revision=r166-bella-records', './secret-catalog.js?revision=r181-hatchback-rally');
            fs.writeFileSync(pathname, source);
          }
          replace(
            'turn/achievements.js',
            './achievements/catalog.js?revision=r166-bella-records',
            './achievements/catalog.js?revision=r181-hatchback-rally'
          );

          replace(
            'turn/ui/about-history-bootstrap-r165.js',
            '../content/about-history.js?build=20260823-r180',
            '../content/about-history.js?build=20260823-r181'
          );

          let history = fs.readFileSync('turn/content/about-history.js', 'utf8');
          if (!history.includes("['1.10.2 r181'")) {
            history = history.replace(
              "      ['1.10.1 r180', 'Corrects semantic palette UV orientation so factory colors and PAINTJOB affect the authored body, trim and rim cells.']",
              "      ['1.10.1 r180', 'Corrects semantic palette UV orientation so factory colors and PAINTJOB affect the authored body, trim and rim cells.'],\n      ['1.10.2 r181', 'Renames Sport Sedan to Hatchback, gives it the authored Sport Hatchback model and promotes the former Sport Sedan body to the black-and-gold Rally Racer while preserving both cars’ stable gameplay IDs.']"
            );
          }
          history = history
            .replace("version: '1.10.1',\n  build: '2026.08.23-r180',", "version: '1.10.2',\n  build: '2026.08.23-r181',")
            .replace(
              "note: 'TURN 1.10.1 build r180 corrects semantic vehicle paint UV orientation so factory colors and PAINTJOB reach the authored body, trim and rim surfaces.'",
              "note: 'TURN 1.10.2 build r181 promotes the Sport Hatchback to Hatchback and the former Sport Sedan model to Rally Racer while preserving PAINTJOB, progression and stable vehicle identities.'"
            );
          fs.writeFileSync('turn/content/about-history.js', history);

          replace(
            'turn-lab/tests/semantic-car-finish-production.mjs',
            "assert.equal(release.version, '1.10.1');",
            "assert.equal(release.version, '1.10.2');"
          );
          replace(
            'turn-lab/tests/semantic-car-finish-production.mjs',
            "assert.equal(release.id, '2026.08.23-r180');",
            "assert.equal(release.id, '2026.08.23-r181');"
          );

          for (const pathname of ['turn-next/index.html', 'yourturn/index.html']) {
            let source = fs.readFileSync(pathname, 'utf8');
            source = source
              .replaceAll('2026.08.23-r180', '2026.08.23-r181')
              .replaceAll('20260823-r180', '20260823-r181');
            if (pathname === 'turn-next/index.html') source = source.replaceAll('1.10.1', '1.10.2');
            fs.writeFileSync(pathname, source);
          }
          NODE

      - name: Generate release-bound surfaces
        run: |
          node turn/scripts/release.mjs --write
          node turn-next/scripts/build-parity-app.mjs
          node turn-next/scripts/build-parity-main.mjs

      - name: Verify generated r181 surfaces
        run: |
          node turn/scripts/release.mjs --check
          node turn-next/scripts/build-parity-app.mjs --check
          node turn-next/scripts/build-parity-main.mjs --check
          node turn-next/scripts/build-parity-entry.mjs --check
          git diff --check

      - name: Commit synchronized r181 release
        run: |
          if git diff --quiet; then
            echo "r181 release already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turn turn-lab turn-next yourturn
          git commit -m "Ship Hatchback and Rally Racer swap as TURN 1.10.2 r181"
          git push origin HEAD:turn-hatchback-rally-model-swap

  admin-unlock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run hidden admin unlock regression
        run: node turn-lab/tests/admin-unlock-production.mjs

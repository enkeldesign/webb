name: TURN admin unlock regression

on:
  pull_request:
    branches:
      - main
    paths:
      - 'turn/index.html'
      - 'turn/testing/admin-unlock-sequence.js'
      - 'turn/achievements/**'
      - 'turn/progression/**'
      - 'turn-lab/tests/admin-unlock-production.mjs'
      - '.github/workflows/turn-admin-unlock-test.yml'
  push:
    branches:
      - main
    paths:
      - 'turn/index.html'
      - 'turn/testing/admin-unlock-sequence.js'
      - 'turn/achievements/**'
      - 'turn/progression/**'
      - 'turn-lab/tests/admin-unlock-production.mjs'
      - '.github/workflows/turn-admin-unlock-test.yml'

permissions:
  contents: write

jobs:
  release-sync:
    if: github.event_name == 'pull_request' && github.head_ref == 'turn-performance-loading-review'
    runs-on: ubuntu-latest
    steps:
      - name: Check out performance branch
        uses: actions/checkout@v4
        with:
          ref: turn-performance-loading-review

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Synchronize parity and release identity
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const releasePath = 'turn/release.json';
          const release = JSON.parse(fs.readFileSync(releasePath, 'utf8'));
          if (release.version !== '1.10.4' || release.id !== '2026.08.23-r183' || release.cacheKey !== '20260823-r183') {
            fs.writeFileSync(releasePath, JSON.stringify({
              version: '1.10.4',
              id: '2026.08.23-r183',
              cacheKey: '20260823-r183'
            }, null, 2) + '\n');
          }
          const nextIndexPath = 'turn-next/index.html';
          let nextIndex = fs.readFileSync(nextIndexPath, 'utf8');
          nextIndex = nextIndex
            .replaceAll('1.10.3', '1.10.4')
            .replaceAll('2026.08.23-r182', '2026.08.23-r183')
            .replaceAll('20260823-r182', '20260823-r183');
          fs.writeFileSync(nextIndexPath, nextIndex);
          NODE
          node turn/scripts/release.mjs --write
          node turn-next/scripts/build-parity-app.mjs
          node turn-next/scripts/build-parity-main.mjs
          node turn-next/scripts/build-parity-entry.mjs

      - name: Verify synchronized build
        run: |
          node turn/scripts/release.mjs --check
          node turn-next/scripts/build-parity-app.mjs --check
          node turn-next/scripts/build-parity-main.mjs --check
          node turn-next/scripts/build-parity-entry.mjs --check
          git diff --check

      - name: Commit synchronized build
        run: |
          if git diff --quiet; then
            echo "Release and parity files already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turn turn-lab turn-next
          git commit -m "Release TURN 1.10.4 r183 performance pass"
          git push origin HEAD:turn-performance-loading-review

  admin-unlock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run hidden admin unlock regression
        run: node turn-lab/tests/admin-unlock-production.mjs

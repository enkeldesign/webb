name: Apply guarded core DBE shutdown

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/dbe-performance-r97'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply guarded shutdown patch
        run: python scripts/agent-dbe-core-off.py

      - name: Validate focused DBE changes
        run: |
          node --check turn/audio/audio-system.js
          node --check turn-lab/tests/drive-by-ear-production.mjs
          npx --yes eslint@9.39.1 turn/audio/audio-system.js turn-lab/tests/drive-by-ear-production.mjs
          node turn-lab/tests/audio-foundation-production.mjs
          node turn-lab/tests/driving-soundscape-production.mjs
          node turn-lab/tests/pace-notes-production.mjs
          node turn-lab/tests/drive-by-ear-production.mjs
          node turn-lab/tests/performance-production.mjs

      - name: Commit source patch when needed
        run: |
          if git diff --quiet -- turn turn-lab; then
            echo 'Core DBE shutdown already applied.'
            exit 0
          fi
          git config user.name 'TURN automation'
          git config user.email 'actions@users.noreply.github.com'
          git add turn turn-lab
          git diff --cached --check
          git commit -m 'Complete Drive By Ear shutdown path'
          git push origin HEAD:agent/dbe-performance-r97

name: Merge TURN localization inventory

on:
  push:
    branches:
      - docs/turn-localization-inventory
    paths:
      - .github/workflows/merge-turn-localization-inventory.yml

permissions:
  contents: write

jobs:
  merge-localization-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/turn-localization-inventory
          fetch-depth: 0

      - name: Consolidate and validate TSV
        shell: bash
        run: |
          set -euo pipefail
          base='turn/localization/messages.tsv'
          additions='turn/localization/messages-audit-additions.tsv'
          test -f "$base"
          test -f "$additions"
          test "$(head -n 1 "$base")" = $'key\tsurface\tenglish\tsv'
          test "$(head -n 1 "$additions")" = $'key\tsurface\tenglish\tsv'
          tail -n +2 "$additions" >> "$base"
          rm "$additions"
          test "$(wc -l < "$base" | tr -d ' ')" = '1113'
          python - <<'PY'
          import csv
          from pathlib import Path
          path = Path('turn/localization/messages.tsv')
          with path.open(encoding='utf-8', newline='') as handle:
              rows = list(csv.DictReader(handle, delimiter='\t'))
          assert len(rows) == 1112, len(rows)
          assert list(rows[0]) == ['key', 'surface', 'english', 'sv']
          assert len({row['key'] for row in rows}) == 1112
          assert all(row['english'] for row in rows)
          assert all(row['sv'] == '' for row in rows)
          PY
          rm '.github/workflows/merge-turn-localization-inventory.yml'

      - name: Commit canonical inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- turn/localization/messages.tsv turn/localization/messages-audit-additions.tsv .github/workflows/merge-turn-localization-inventory.yml
          git commit -m 'Consolidate TURN localization inventory'
          git push origin HEAD:docs/turn-localization-inventory

name: "TURN #1260 release preparation"

on:
  push:
    branches:
      - sol/1260-mayday-low-graphics
    paths:
      - .github/workflows/turn-1260-release-helper.yml

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the requested branch commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Confirm unchanged implementation and base
        env:
          EXPECTED_PARENT: efe801d3a1805f2433d58c821874f620b96709cc
          EXPECTED_BASE: b5552217f6ad4722a667dd5b0b87abde4d73e481
        run: |
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          git fetch origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"

      - name: Set the next release after current main
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const file = 'turn/release.json';
          const release = JSON.parse(fs.readFileSync(file, 'utf8'));
          assert.deepEqual(release, {
            version: '1.50.2',
            id: '2026.10.19-r484',
            cacheKey: '20261019-r484'
          });
          fs.writeFileSync(file, JSON.stringify({
            version: '1.50.3',
            id: '2026.10.20-r485',
            cacheKey: '20261020-r485'
          }, null, 2) + '\n');
          JS

      - name: Generate canonical release output
        run: node turn/scripts/release.mjs --write

      - name: Run focused MAYDAY regression
        run: node turn-lab/tests/emergency-vehicles-production.mjs

      - name: Check canonical release output
        run: node turn/scripts/release.mjs --check

      - name: Check release composition against main
        run: node turn-tests/release-composition-production.mjs --base origin/main

      - name: Lint TURN
        run: npx --yes eslint@9.39.1 turn turn-tests

      - name: Check whitespace
        run: git diff --check

      - name: Commit generated release output to the implementation branch
        run: |
          git config user.name "ASTRA"
          git config user.email "solavatar@openai.com"
          git add -- turn yourturn
          git diff --cached --stat
          git commit -m "TURN 1.50.3 r485: release MAYDAY LOW GRAPHICS fix (#1260)" -m "Generate release output with the canonical writer after the focused regression, release checks and ESLint pass." -m "Co-authored-by: SOL <solavatar@openai.com>"
          git push origin HEAD:refs/heads/sol/1260-mayday-low-graphics

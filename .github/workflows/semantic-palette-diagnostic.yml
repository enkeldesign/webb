name: TURN semantic palette diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - 'turn/assets/cars/**'
      - 'turn/vehicle/**'
      - 'turn-lab/scripts/inspect-semantic-palette.mjs'
      - '.github/workflows/semantic-palette-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Inspect authored UV cells
        run: node turn-lab/scripts/inspect-semantic-palette.mjs

name: TURN r224 LAB MOUNTAIN scope fix

on:
  push:
    branches:
      - feature/mountain-slalom-warning-sign-r224

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/mountain-slalom-warning-sign-r224
          fetch-depth: 0

      - name: Keep TURN LAB MOUNTAIN scope on current production build
        run: python3 .github/turn-r224-lab-scope-fix.py

      - name: Synchronize release surfaces
        run: node turn/scripts/release.mjs --write

      - name: Validate LAB override and release integrity
        run: |
          node turn/scripts/release.mjs --check
          node turn-lab/tests/mountain-long-lab.mjs
          node turn-tests/mountain-track-production.mjs
          node turn-tests/mountain-spotlight-headlight-production.mjs
          node turn-tests/release-composition-production.mjs --base=f17c38bce68bf6b88784babcff01e91744f50b20
          git diff --check

      - name: Commit LAB scope fix
        run: |
          git config user.name "enkeldesign"
          git config user.email "75029856+enkeldesign@users.noreply.github.com"
          git add turn turn-next turn-lab yourturn turn-tests
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Keep TURN LAB MOUNTAIN override release-bound"
          git push origin HEAD:feature/mountain-slalom-warning-sign-r224

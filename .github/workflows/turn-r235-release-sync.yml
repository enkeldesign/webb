name: TURN r235 release sync

on:
  push:
    branches:
      - sol/pill-toast-lane-r235

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/pill-toast-lane-r235
          fetch-depth: 0
      - name: Synchronize TURN release surfaces
        run: node turn/scripts/release.mjs --write
      - name: Validate generated release state
        run: |
          node turn/scripts/release.mjs
          git diff --check
      - name: Commit generated release surfaces
        run: |
          if git diff --quiet; then
            echo "Release surfaces already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turn turn-lab turn-next yourturn
          git commit -m "Synchronize TURN r235 release surfaces"
          git push origin HEAD:sol/pill-toast-lane-r235

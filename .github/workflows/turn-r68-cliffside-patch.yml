name: TURN r68 Cliffside patch

on:
  push:
    branches:
      - agent/turn-r68-cliffside-track
    paths:
      - 'turn/scripts/patch-r68-cliffside-world.mjs'
      - '.github/workflows/turn-r68-cliffside-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/turn-r68-cliffside-track
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply verified world patch
        run: node turn/scripts/patch-r68-cliffside-world.mjs
      - name: Commit patched world
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turn/tracks/cliffside-world.js
          git diff --cached --quiet && exit 0
          git commit -m "TURN r68: polish Cliffside terrain and summit gate"
          git push origin HEAD:agent/turn-r68-cliffside-track

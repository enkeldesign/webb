name: TURN color accessibility regression

on:
  pull_request:
    branches:
      - main
    paths:
      - 'turn/accessibility/**'
      - 'turn/content/about-history.js'
      - 'turn/audio/audio-system.js'
      - 'turn/drive-pad.css'
      - 'turn/garage/lot-layout-r60.js'
      - 'turn/garage/lot-r10.css'
      - 'turn/garage/lot-r10.js'
      - 'turn/manual-steering.css'
      - 'turn/orientation-compat.js'
      - 'turn/progression/lot-paint-reward.js'
      - 'turn/styles.css'
      - 'turn-lab/tests/color-accessibility-production.mjs'
      - '.github/workflows/turn-color-accessibility.yml'
  push:
    branches:
      - main
    paths:
      - 'turn/accessibility/**'
      - 'turn/content/about-history.js'
      - 'turn/audio/audio-system.js'
      - 'turn/drive-pad.css'
      - 'turn/garage/lot-layout-r60.js'
      - 'turn/garage/lot-r10.css'
      - 'turn/garage/lot-r10.js'
      - 'turn/manual-steering.css'
      - 'turn/orientation-compat.js'
      - 'turn/progression/lot-paint-reward.js'
      - 'turn/styles.css'
      - 'turn-lab/tests/color-accessibility-production.mjs'
      - '.github/workflows/turn-color-accessibility.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax-check color accessibility modules
        run: |
          node --check turn/accessibility/color-cues.js
          node --check turn/accessibility/color-accessibility-r163.js
          node --check turn-lab/tests/color-accessibility-production.mjs

      - name: Run color accessibility production regression
        run: node turn-lab/tests/color-accessibility-production.mjs

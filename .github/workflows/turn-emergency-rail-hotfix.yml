name: Apply TURN emergency rail hotfix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/turn-emergency-rail-hotfix.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply emergency rail and stripe corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import textwrap

          Path('turn/garage/lot-fixed-livery-ui.js').write_text(textwrap.dedent("""
          export function installFixedLiveryUiGuard() {
            const update = () => {
              for (const colors of document.querySelectorAll('.lot-colors')) {
                const viewbox = colors.closest('.lot-screen')?.querySelector('.lot-viewbox');
                const fixedLivery = colors.querySelector('.lot-fixed-livery');
                if (fixedLivery) {
                  colors.replaceChildren();
                  colors.hidden = false;
                  colors.setAttribute('aria-hidden', 'true');
                  colors.removeAttribute('aria-label');
                  viewbox?.classList.add('lot-viewbox-with-paint');
                } else if (colors.children.length > 0) {
                  colors.hidden = false;
                  colors.removeAttribute('aria-hidden');
                  viewbox?.classList.add('lot-viewbox-with-paint');
                }
              }
            };

            const observer = new MutationObserver(update);
            observer.observe(document.body, { childList: true, subtree: true });
            update();

            return () => observer.disconnect();
          }
          """).lstrip(), encoding='utf-8')

          track_path = Path('turn/garage/lot-track-select.js')
          track = track_path.read_text(encoding='utf-8')
          track = track.replace('20260803-r126-emergency-paint', '20260803-r127-emergency-paint-empty')
          track_path.write_text(track, encoding='utf-8')

          livery_path = Path('turn/vehicle/emergency-livery-models.js')
          livery = livery_path.read_text(encoding='utf-8')
          livery = livery.replace(
              "accent: 'side-stripe'\n  }),\n  firetruck",
              "accent: 'rear-side-stripe'\n  }),\n  firetruck",
              1
          )
          old = textwrap.dedent("""
            if (accent === 'door-panels') {
              addSidePair({
                length: size.z * 0.34,
                height: size.y * 0.29,
                y: bounds.min.y + size.y * 0.48,
                z: center.z + size.z * 0.03
              });
            } else {
              addSidePair({
                length: size.z * 0.72,
                height: Math.max(0.08, size.y * 0.09),
                y: bounds.min.y + size.y * 0.49,
                z: center.z
              });
            }
          """).lstrip('\n')
          new = textwrap.dedent("""
            if (accent === 'door-panels') {
              addSidePair({
                length: size.z * 0.34,
                height: size.y * 0.29,
                y: bounds.min.y + size.y * 0.48,
                z: center.z + size.z * 0.03
              });
            } else if (accent === 'rear-side-stripe') {
              addSidePair({
                length: size.z * 0.38,
                height: Math.max(0.08, size.y * 0.09),
                y: bounds.min.y + size.y * 0.49,
                z: center.z + size.z * 0.22
              });
            } else {
              addSidePair({
                length: size.z * 0.72,
                height: Math.max(0.08, size.y * 0.09),
                y: bounds.min.y + size.y * 0.49,
                z: center.z
              });
            }
          """).lstrip('\n')
          if old not in livery:
              raise SystemExit('Emergency stripe block did not match current main')
          livery_path.write_text(livery.replace(old, new, 1), encoding='utf-8')

          test_path = Path('turn-lab/tests/emergency-vehicles-production.mjs')
          test = test_path.read_text(encoding='utf-8')
          test = test.replace(
              "assert.match(emergencyLiveries, /ambulance:[\\s\\S]*primary: 0xf8f9fa[\\s\\S]*secondary: 0xd92d20/);",
              "assert.match(emergencyLiveries, /ambulance:[\\s\\S]*primary: 0xf8f9fa[\\s\\S]*secondary: 0xd92d20[\\s\\S]*accent: 'rear-side-stripe'/);"
          )
          test = test.replace(
              "assert.match(emergencyLiveries, /turnEmergencyLiveryAccent/);",
              "assert.match(emergencyLiveries, /turnEmergencyLiveryAccent/);\nassert.match(emergencyLiveries, /length: size\\.z \\* 0\\.38/);\nassert.match(emergencyLiveries, /z: center\\.z \\+ size\\.z \\* 0\\.22/);"
          )
          test = test.replace(
              "assert.match(fixedLiveryUi, /colors\\.hidden = true/);",
              "assert.doesNotMatch(fixedLiveryUi, /colors\\.hidden = true/);\nassert.match(fixedLiveryUi, /colors\\.setAttribute\\('aria-hidden', 'true'\\)/);"
          )
          test = test.replace('build=20260803-r126', 'build=20260803-r127')
          test_path.write_text(test, encoding='utf-8')

          release_path = Path('turn/release.json')
          release = json.loads(release_path.read_text(encoding='utf-8'))
          release.update({
              'version': '1.4.0',
              'id': '2026.08.03-r127',
              'cacheKey': '20260803-r127'
          })
          release_path.write_text(json.dumps(release, indent=2) + '\n', encoding='utf-8')

          for name in ['turn/design.html', 'turn-tests/design-system-production.mjs', 'turn-next/index.html']:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = text.replace('2026.08.03-r126', '2026.08.03-r127')
              text = text.replace('20260803-r126', '20260803-r127')
              text = text.replace('2026.08.03-R126', '2026.08.03-R127')
              text = text.replace(r'2026\.08\.03-r126', r'2026\.08\.03-r127')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Synchronize generated release files
        run: |
          node turn/scripts/release.mjs --write
          node turn-next/scripts/build-parity-app.mjs
          node turn-next/scripts/build-parity-main.mjs
          node turn-next/scripts/build-parity-entry.mjs

      - name: Verify focused regressions
        run: |
          node --check turn/garage/lot-fixed-livery-ui.js
          node --check turn/vehicle/emergency-livery-models.js
          node turn-lab/tests/emergency-vehicles-production.mjs
          node turn-lab/tests/garage-production.mjs
          node turn-tests/design-system-production.mjs
          node turn/scripts/release.mjs --check
          node turn-next/scripts/build-parity-app.mjs --check
          node turn-next/scripts/build-parity-main.mjs --check
          node turn-next/scripts/build-parity-entry.mjs --check

      - name: Commit hotfix and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/turn-emergency-rail-hotfix.yml
          git add turn turn-next turn-tests turn-lab/tests
          git commit -m 'Fix emergency paint rail and ambulance stripe'
          git pull --rebase origin main
          git push origin HEAD:main

name: TURN MOUNTAIN Kenney asset sync

on:
  push:
    branches:
      - feature/mountain-track
    paths:
      - '.github/workflows/turn-mountain-assets-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mountain-track

      - name: Download the same CC0 Kenney packs supplied for MOUNTAIN
        run: |
          curl --fail --location --retry 3 \
            'https://opengameart.org/sites/default/files/kenney_holiday-kit.zip' \
            --output /tmp/holiday.zip
          curl --fail --location --retry 3 \
            'https://opengameart.org/sites/default/files/kenney_fantasy-town-kit_2.0.zip' \
            --output /tmp/fantasy.zip
          unzip -t /tmp/holiday.zip >/dev/null
          unzip -t /tmp/fantasy.zip >/dev/null

      - name: Vendor selected Holiday and Fantasy Town GLBs
        run: |
          set -euo pipefail
          H='turn/assets/scenery/mountain/holiday'
          F='turn/assets/scenery/mountain/fantasy'
          mkdir -p "$H/Textures" "$F/Textures"

          unzip -p /tmp/holiday.zip 'Models/GLB format/cabin-wall.glb' > "$H/cabin-wall.glb"
          unzip -p /tmp/holiday.zip 'Models/GLB format/cabin-doorway.glb' > "$H/cabin-doorway.glb"
          unzip -p /tmp/holiday.zip 'Models/GLB format/cabin-window-large.glb' > "$H/cabin-window-large.glb"
          unzip -p /tmp/holiday.zip 'Models/GLB format/cabin-roof-snow.glb' > "$H/cabin-roof-snow.glb"
          unzip -p /tmp/holiday.zip 'Models/GLB format/bench.glb' > "$H/bench.glb"
          unzip -p /tmp/holiday.zip 'Models/GLB format/lantern.glb' > "$H/lantern.glb"
          unzip -p /tmp/holiday.zip 'Models/GLB format/sled.glb' > "$H/sled.glb"
          unzip -p /tmp/holiday.zip 'Models/GLB format/snow-pile.glb' > "$H/snow-pile.glb"
          unzip -p /tmp/holiday.zip 'Models/GLB format/snow-flat-large.glb' > "$H/snow-flat-large.glb"
          unzip -p /tmp/holiday.zip 'Models/GLB format/tree-snow-a.glb' > "$H/tree-snow-a.glb"
          unzip -p /tmp/holiday.zip 'Models/GLB format/Textures/colormap.png' > "$H/Textures/colormap.png"

          unzip -p /tmp/fantasy.zip 'Models/GLB format/stall-green.glb' > "$F/stall-green.glb"
          unzip -p /tmp/fantasy.zip 'Models/GLB format/stall-red.glb' > "$F/stall-red.glb"
          unzip -p /tmp/fantasy.zip 'Models/GLB format/cart.glb' > "$F/cart.glb"
          unzip -p /tmp/fantasy.zip 'Models/GLB format/fountain-round-detail.glb' > "$F/fountain-round-detail.glb"
          unzip -p /tmp/fantasy.zip 'Models/GLB format/fence.glb' > "$F/fence.glb"
          unzip -p /tmp/fantasy.zip 'Models/GLB format/Textures/colormap.png' > "$F/Textures/colormap.png"

      - name: Verify selected files match the supplied pack bytes
        run: |
          cat > /tmp/mountain-assets.sha256 <<'EOF'
          945e2f605209933626e7379c62e7bff1777866646255a09e0e9b96fa98b774ce  turn/assets/scenery/mountain/holiday/cabin-wall.glb
          613fe82e80dcc6302fc49aff1bbacfbd2adeba34f091b8fffb00f0d65bf4b13c  turn/assets/scenery/mountain/holiday/cabin-doorway.glb
          0678ee0347c3553a7afb2cacb5cf905659bd16c8b68d7c3dbaa29c1cd2c9b517  turn/assets/scenery/mountain/holiday/cabin-window-large.glb
          d36d7a0eb8397b3e6eaad49b115639a3448eb82e8a79cdc7b5b97915152b35d3  turn/assets/scenery/mountain/holiday/cabin-roof-snow.glb
          e37ffcbb074679098d16db68aa50ce34a3ca2f1900a20110da9509d312039554  turn/assets/scenery/mountain/holiday/bench.glb
          42c4851862b3ea223c49e387c10353b4ee3cfb95dc178020bcabd123d0abeb85  turn/assets/scenery/mountain/holiday/lantern.glb
          4e33b581b495375c289b36fe60e4d53a3f8e2e7bd957a1b05185f17f101930d4  turn/assets/scenery/mountain/holiday/sled.glb
          37ba917164564051371d63588489bb662444eba0327517546dd125ccd45b1007  turn/assets/scenery/mountain/holiday/snow-pile.glb
          1122009ac0fef96edc00cb6520c6593517f64c6ec1bb2329ba69c1df056a1c3b  turn/assets/scenery/mountain/holiday/snow-flat-large.glb
          582c4c33e9833372afd0e63f55822006b005b4555dd2ae061fa1cef1813574de  turn/assets/scenery/mountain/holiday/tree-snow-a.glb
          015fcc1664be7576f468a98bc4f5f329ef8b3c9caef0d85b2a4dc0ca69516863  turn/assets/scenery/mountain/holiday/Textures/colormap.png
          2da2f7b31cde5d943d7c08c457bbb39797ef0a607921fde0b8455f338ce40205  turn/assets/scenery/mountain/fantasy/stall-green.glb
          aa20a630f417032c46aaefbc779fd2b3355b451bf05d31acc36fd664146866b1  turn/assets/scenery/mountain/fantasy/stall-red.glb
          63503cd0a7398310e01aabc8e3663f711a7517394d23d179d0695157fee99d40  turn/assets/scenery/mountain/fantasy/cart.glb
          05cdd740e3175c2d3208d4cb6630a279a9b4cbc48393b28c92e3e40cca2a5d6b  turn/assets/scenery/mountain/fantasy/fountain-round-detail.glb
          92261b9419108d84f3db0def5eadeffa783032029897562b1f512e4a7570ef48  turn/assets/scenery/mountain/fantasy/fence.glb
          4aac939dc33195e35caf8c382ee3cb170054da763577f22d3c22692ec6afccdf  turn/assets/scenery/mountain/fantasy/Textures/colormap.png
          EOF
          sha256sum --check /tmp/mountain-assets.sha256

      - name: Commit vendored MOUNTAIN assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add turn/assets/scenery/mountain/holiday turn/assets/scenery/mountain/fantasy
          git diff --cached --quiet || git commit -m 'Vendor MOUNTAIN Holiday and Fantasy Town assets'
          git push origin HEAD:feature/mountain-track

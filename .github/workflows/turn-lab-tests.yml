name: TURN regression suite

on:
  pull_request:
    branches:
      - main
    paths:
      - 'turn/**'
      - 'turn-next/**'
      - 'turn-tests/**'
      - 'turn-lab/**'
      - 'eslint.config.mjs'
      - '.github/workflows/turn-lab-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'turn/**'
      - 'turn-next/**'
      - 'turn-tests/**'
      - 'turn-lab/**'
      - 'eslint.config.mjs'
      - '.github/workflows/turn-lab-tests.yml'

permissions:
  contents: write

jobs:
  release_sync:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/semantic-car-paint-r180'
    runs-on: ubuntu-latest
    steps:
      - name: Check out r180 branch
        uses: actions/checkout@v4
        with:
          ref: fix/semantic-car-paint-r180

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prepare TURN 1.10.1 r180 cache identity
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync('turn/release.json', `${JSON.stringify({
            version: '1.10.1',
            id: '2026.08.23-r180',
            cacheKey: '20260823-r180'
          }, null, 2)}\n`);

          function replace(path, from, to) {
            const before = fs.readFileSync(path, 'utf8');
            if (before.includes(to)) return;
            if (!before.includes(from)) throw new Error(`${path}: missing expected text: ${from}`);
            fs.writeFileSync(path, before.replaceAll(from, to));
          }

          replace('turn/vehicle/car-models.js', "./semantic-car-finish.js?revision=r179-native-surfaces", "./semantic-car-finish.js?revision=r180-paint-uv");
          replace('turn/vehicle/emergency-livery-models.js', "./car-models.js?build=20260823-r179-native-car-surfaces", "./car-models.js?build=20260823-r180-native-car-surfaces");
          replace('turn-lab/tests/semantic-car-finish-production.mjs', "assert.equal(release.version, '1.10.0');", "assert.equal(release.version, '1.10.1');");
          replace('turn-lab/tests/semantic-car-finish-production.mjs', "assert.equal(release.id, '2026.08.23-r179');", "assert.equal(release.id, '2026.08.23-r180');");

          for (const path of ['turn-next/index.html', 'yourturn/index.html']) {
            let source = fs.readFileSync(path, 'utf8');
            source = source
              .replaceAll('2026.08.23-r179', '2026.08.23-r180')
              .replaceAll('20260823-r179', '20260823-r180');
            if (path === 'turn-next/index.html') source = source.replaceAll('1.10.0', '1.10.1');
            fs.writeFileSync(path, source);
          }
          NODE

      - name: Synchronize generated production and LAB release surfaces
        run: node turn/scripts/release.mjs --write

      - name: Verify synchronized release surfaces
        run: |
          node turn/scripts/release.mjs --check
          node turn-next/scripts/build-parity-app.mjs --check
          node turn-next/scripts/build-parity-main.mjs --check
          node turn-next/scripts/build-parity-entry.mjs --check
          git diff --check

      - name: Commit synchronized r180 release
        run: |
          if git diff --quiet; then
            echo "r180 release already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turn/release.json turn/index.html turn-lab/index.html turn-next/index.html yourturn/index.html turn/vehicle/car-models.js turn/vehicle/emergency-livery-models.js turn-lab/tests/semantic-car-finish-production.mjs
          git commit -m "Ship semantic vehicle paint fix as TURN 1.10.1 r180"
          git push origin HEAD:fix/semantic-car-paint-r180

  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax-check TURN modules
        run: find turn turn-next turn-tests turn-lab/tests turn-lab/scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check

      - name: Lint TURN domain modules
        run: npx --yes eslint@9.39.1

      - name: Verify release source of truth
        run: node turn/scripts/release.mjs --check

      - name: Verify TURN NEXT generated parity bootstrap
        run: node turn-next/scripts/build-parity-app.mjs --check

      - name: Verify TURN NEXT generated parity main
        run: node turn-next/scripts/build-parity-main.mjs --check

      - name: Verify TURN NEXT generated parity entry
        run: node turn-next/scripts/build-parity-entry.mjs --check

      - name: Run TURN NEXT isolation and identity regression
        run: node turn-tests/turn-next-entry-production.mjs

      - name: Run web platform and motion composition regression
        run: node turn-tests/platform-production.mjs

      - name: Run TURN NEXT race-session orchestration regression
        run: node turn-tests/session-orchestrator-production.mjs

      - name: Run TURN NEXT home navigation regression
        run: node turn-tests/home-navigation-production.mjs

      - name: Run startup cover and unread achievement regression
        run: node turn-tests/startup-and-unread-production.mjs

      - name: Run inclusive Home feedback and attribution regression
        run: node turn-tests/home-feedback-production.mjs

      - name: Run About history and dialog-system regression
        run: node turn-tests/about-history-production.mjs

      - name: Run TURN design-system specimen regression
        run: node turn-tests/design-system-production.mjs

      - name: Run native form and disclosure regression
        run: node turn-tests/form-disclosure-system.mjs

      - name: Run track intro showcase camera regression
        run: node turn-tests/track-intro-camera-production.mjs

      - name: Run standalone motion cancellation regression
        run: node turn-tests/motion-permission-standalone-production.mjs

      - name: Run Home help and all-track rival reset regression
        run: node turn-tests/how-to-play-guide-production.mjs

      - name: Run TURN NEXT motion safe-zone regression
        run: node turn-tests/motion-safe-zone-production.mjs

      - name: Run post-optimisation soak regression
        run: node turn-tests/post-soak-production.mjs

      - name: Run production race and replay regression tests

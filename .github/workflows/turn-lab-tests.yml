name: TURN regression suite

on:
  pull_request:
    branches:
      - main
    paths:
      - 'turn/**'
      - 'turn-next/**'
      - 'turn-tests/**'
      - 'turn-lab/**'
      - 'eslint.config.mjs'
      - '.github/workflows/turn-lab-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'turn/**'
      - 'turn-next/**'
      - 'turn-tests/**'
      - 'turn-lab/**'
      - 'eslint.config.mjs'
      - '.github/workflows/turn-lab-tests.yml'

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Synchronize current TURN icon
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old_revision = '20260730-1136'
          new_revision = '20260803-profile-512'

          for filename in [
              'turn/index.html',
              'turn-next/index.html',
              'turn/m8-home.js',
              'turn-next/m8-home.js',
              'turn/site.webmanifest',
              'turn-next/site.webmanifest',
              'turn-lab/tests/app-icon-production.mjs',
          ]:
              path = Path(filename)
              source = path.read_text()
              source = source.replace(old_revision, new_revision)
              source = source.replace('1136x1136', '512x512')
              path.write_text(source)

          test_path = Path('turn-lab/tests/app-icon-production.mjs')
          test_source = test_path.read_text()
          test_source = test_source.replace('[1163, 1163]', '[512, 512]')
          test_source = test_source.replace(
              '96df2b8e041fb90b7a0efe08274c2548ac0cfb03',
              '8917377dc6368f9d543a118f764710433d79da01'
          )
          test_path.write_text(test_source)

          css_path = Path('turn/m8-home-fixed-layout.css')
          css = css_path.read_text()
          css = css.replace('box-sizing: content-box;', 'box-sizing: border-box;', 1)
          css = css.replace(
              'border-inline-end: 5px solid var(--m8-ink);',
              'box-shadow: 5px 0 0 var(--m8-ink);',
              1
          )
          css_path.write_text(css)

          navigation_test_path = Path('turn-tests/home-navigation-production.mjs')
          navigation_test = navigation_test_path.read_text()
          anchor = "assert.match(fixedLayoutCss, /\\.m8-home-fixed-layout \\.m8-home-logo[\\s\\S]*width: auto[\\s\\S]*height: 100%[\\s\\S]*aspect-ratio: 1[\\s\\S]*object-fit: contain[\\s\\S]*object-position: left center/);"
          addition = anchor + "\nassert.match(fixedLayoutCss, /\\.m8-home-fixed-layout \\.m8-home-logo[\\s\\S]*box-sizing: border-box[\\s\\S]*box-shadow: 5px 0 0 var\\(--m8-ink\\)/);\nassert.doesNotMatch(fixedLayoutCss, /border-inline-end: 5px solid var\\(--m8-ink\\)/);"
          if anchor in navigation_test and 'box-shadow: 5px 0 0 var\\(--m8-ink\\)' not in navigation_test:
              navigation_test = navigation_test.replace(anchor, addition, 1)
          navigation_test_path.write_text(navigation_test)

          remaining = []
          for root in ['turn', 'turn-next', 'turn-tests', 'turn-lab']:
              for path in Path(root).rglob('*'):
                  if path.is_file() and path.suffix.lower() in {'.html', '.js', '.mjs', '.json', '.webmanifest', '.css'}:
                      try:
                          if old_revision in path.read_text():
                              remaining.append(str(path))
                      except UnicodeDecodeError:
                          pass
          if remaining:
              raise SystemExit(f'Old icon revision remains in: {remaining}')
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax-check TURN modules
        run: find turn turn-next turn-tests turn-lab/tests turn-lab/scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check

      - name: Lint TURN domain modules
        run: npx --yes eslint@9.39.1

      - name: Verify release source of truth
        run: node turn/scripts/release.mjs --check

      - name: Verify TURN NEXT generated parity bootstrap
        run: node turn-next/scripts/build-parity-app.mjs --check

      - name: Verify TURN NEXT generated parity main
        run: node turn-next/scripts/build-parity-main.mjs --check

      - name: Verify TURN NEXT generated parity entry
        run: node turn-next/scripts/build-parity-entry.mjs --check

      - name: Run TURN NEXT isolation and identity regression
        run: node turn-tests/turn-next-entry-production.mjs

      - name: Run web platform and motion composition regression
        run: node turn-tests/platform-production.mjs

      - name: Run TURN NEXT race-session orchestration regression
        run: node turn-tests/session-orchestrator-production.mjs

      - name: Run TURN NEXT home navigation regression
        run: node turn-tests/home-navigation-production.mjs

      - name: Run inclusive Home feedback and attribution regression
        run: node turn-tests/home-feedback-production.mjs

      - name: Run TURN design-system specimen regression
        run: node turn-tests/design-system-production.mjs

      - name: Run native form and disclosure regression
        run: node turn-tests/form-disclosure-system.mjs

      - name: Run track intro showcase camera regression
        run: node turn-tests/track-intro-camera-production.mjs

      - name: Run standalone motion cancellation regression
        run: node turn-tests/motion-permission-standalone-production.mjs

      - name: Run Home help and all-track rival reset regression
        run: node turn-tests/how-to-play-guide-production.mjs

      - name: Run TURN NEXT motion safe-zone regression
        run: node turn-tests/motion-safe-zone-production.mjs

      - name: Run production race and replay regression tests
        run: node turn-tests/race-production.mjs

      - name: Run multi-track and Airport regression
        run: node turn-lab/tests/multi-track-production.mjs

      - name: Run track record 3D model regression
        run: node turn-lab/tests/track-best-model-production.mjs

      - name: Run track chooser palette and postcard regression
        run: node turn-tests/track-select-visuals-production.mjs

      - name: Run world containment and collision regression
        run: node turn-lab/tests/world-collision-production.mjs

      - name: Run Harbor hidden face regression
        run: node turn-tests/harbor-hidden-face-production.mjs

      - name: Run Midnight City lighting regression
        run: node turn-tests/midnight-city-lighting-production.mjs

      - name: Run production manual steering regression
        run: node turn-lab/tests/manual-steering-production.mjs

      - name: Run production garage regression
        run: node turn-lab/tests/garage-production.mjs

      - name: Run compact Lot layout regression
        run: node turn-lab/tests/lot-layout-production.mjs

      - name: Run DRIFT handling contract regression
        run: node turn-lab/tests/vehicle-drift-production.mjs

      - name: Run vehicle stat legend regression
        run: node turn-lab/tests/stat-legend-production.mjs

      - name: Run all-car orientation regression
        run: node turn-lab/tests/car-orientation-production.mjs

      - name: Run native and secondary paint regression
        run: node turn-lab/tests/native-paint-production.mjs

      - name: Run app icon and PWA branding regression
        run: node turn-lab/tests/app-icon-production.mjs

      - name: Run Open Graph and social preview regression
        run: node turn-lab/tests/social-preview-production.mjs

      - name: Run balance and anti-shortcut regression
        run: node turn-lab/tests/balance-and-checkpoints.mjs

      - name: Run unified drive pad and reverse regression
        run: node turn-lab/tests/drive-pad-production.mjs

      - name: Run state-aware in-game menu regression
        run: node turn-lab/tests/in-game-menu-production.mjs

      - name: Run lap result toast regression
        run: node turn-lab/tests/lap-result-toast-production.mjs

      - name: Run production sound foundation regression
        run: node turn-lab/tests/audio-foundation-production.mjs

      - name: Run universal driving soundscape regression
        run: node turn-lab/tests/driving-soundscape-production.mjs

      - name: Run DBE recovery guidance regression
        run: node turn-lab/tests/recovery-guidance-production.mjs

      - name: Run physical-road off-road ear-direction regression
        run: node turn-lab/tests/offroad-ear-direction-production.mjs

      - name: Run all-track auditory pace-note regression
        run: node turn-lab/tests/pace-notes-production.mjs

      - name: Audit Midnight City pace notes against route geometry
        run: node turn-tests/midnight-city-pace-note-map-production.mjs

      - name: Run Drive By Ear preference and shutdown regression
        run: node turn-lab/tests/drive-by-ear-production.mjs

      - name: Run production performance and diagnostics regression
        run: node turn-lab/tests/performance-production.mjs

      - name: Run covered rendering regression
        run: node turn-tests/covered-rendering-production.mjs

      - name: Run event-driven rival visual regression
        run: node turn-tests/rival-visual-sync-production.mjs

      - name: Run fixed skid history regression
        run: node turn-tests/skid-ring-buffer-production.mjs

      - name: Run elevation-aware runtime regression
        run: node turn-tests/elevation-production.mjs

      - name: Run Cliffside and four-slot chooser regression
        run: node turn-tests/cliffside-production.mjs

      - name: Run Cliffside containment regression
        run: node turn-tests/cliffside-containment-production.mjs

      - name: Run full viewport coverage regression
        run: node turn-tests/viewport-coverage-production.mjs

      - name: Verify production release architecture
        run: node turn-tests/release-production.mjs

      - name: Commit synchronized icon references
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turn turn-next turn-tests turn-lab/tests
          git commit -m "Synchronize TURN icon surfaces"
          git push origin HEAD:${{ github.head_ref }}

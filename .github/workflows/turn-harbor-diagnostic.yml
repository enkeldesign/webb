name: TURN Harbor diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - 'turn/**'
      - 'turn-tests/**'
      - 'turn-lab/**'
      - '.github/workflows/turn-harbor-diagnostic.yml'

permissions:
  contents: read

jobs:
  capture-multi-track-output:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Capture multi-track regression output
        shell: bash
        run: |
          set +e
          node turn-lab/tests/multi-track-production.mjs > multi-track.log 2>&1
          status=$?
          printf '\nEXIT_STATUS=%s\n' "$status" >> multi-track.log
          exit 0

      - name: Upload diagnostic bundle
        uses: actions/upload-artifact@v4
        with:
          name: harbor-multi-track-bundle
          path: |
            multi-track.log
            turn-lab/tests/multi-track-production.mjs
          retention-days: 1

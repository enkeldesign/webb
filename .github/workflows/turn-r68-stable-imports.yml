name: TURN r68 stable imports

on:
  push:
    branches:
      - agent/turn-r68-cliffside-track
    paths:
      - 'turn/scripts/patch-r68-stable-imports.mjs'
      - '.github/workflows/turn-r68-stable-imports.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/turn-r68-cliffside-track
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply verified stable imports
        run: node turn/scripts/patch-r68-stable-imports.mjs
      - name: Commit stable module publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turn/index.html turn/tracks/catalog.js turn/tracks/registry.js turn/tracks/cliffside-world.js
          git diff --cached --quiet && exit 0
          git commit -m "TURN r68: publish Cliffside modules through the release map"
          git push origin HEAD:agent/turn-r68-cliffside-track

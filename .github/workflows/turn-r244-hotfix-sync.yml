name: TURN r244 hotfix release sync

on:
  push:
    branches:
      - sol/fix-turn-loading-r244

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Synchronize release surfaces
        run: node turn/scripts/release.mjs --write
      - name: Verify startup shell after generation
        run: node turn-tests/startup-shell-contract.mjs
      - name: Commit generated release surfaces
        run: |
          if git diff --quiet; then
            echo 'Release surfaces already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add turn turn-lab turn-next yourturn
          git commit -m 'Synchronize TURN r244 release surfaces'
          git push

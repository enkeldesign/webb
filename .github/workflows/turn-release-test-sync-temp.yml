name: Synchronize TURN release regression

on:
  push:
    branches:
      - agent/turn-difficulty-about-release

permissions:
  contents: write

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/turn-difficulty-about-release

      - name: Make the isolation test follow the release source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('turn-tests/turn-next-entry-production.mjs')
          source = path.read_text()
          old = """assert.equal(release.version, '1.3.0');
          assert.equal(release.id, '2026.08.01-r122');
          assert.equal(release.cacheKey, '20260801-r122');"""
          new = """assert.match(release.version, /^\\d+\\.\\d+\\.\\d+$/);
          assert.match(release.id, /^\\d{4}\\.\\d{2}\\.\\d{2}-r\\d+$/);
          assert.equal(release.cacheKey, release.id.replaceAll('.', ''));"""
          if old not in source:
              raise SystemExit('Expected fixed release assertions were not found')
          path.write_text(source.replace(old, new))
          PY

      - name: Commit release-aware regression
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turn-tests/turn-next-entry-production.mjs
          git commit -m "Make TURN NEXT regression release-aware"
          git push origin HEAD:agent/turn-difficulty-about-release

name: TURN r245 Lot order sync

on:
  push:
    branches:
      - sol/learner-first-lot-r245

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Put Learner Car first and Tractor second
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const showroomPath = 'turn/garage/lot-showroom-experiment.js';
          let showroom = fs.readFileSync(showroomPath, 'utf8');
          const oldOrder = `export const LOT_CAR_ORDER = Object.freeze([\n  'classic',\n  'truck',\n  'sedan',\n  'van',\n  'suv',\n  'convertible',\n  'sedan-sports',\n  'tractor',`;
          const newOrder = `export const LOT_CAR_ORDER = Object.freeze([\n  'classic',\n  'tractor',\n  'truck',\n  'sedan',\n  'van',\n  'suv',\n  'convertible',\n  'sedan-sports',`;
          if (!showroom.includes(oldOrder)) throw new Error('Expected current Lot order not found');
          showroom = showroom.replace(oldOrder, newOrder);
          fs.writeFileSync(showroomPath, showroom);

          const testPath = 'turn-tests/m8-lot-selection-production.mjs';
          let test = fs.readFileSync(testPath, 'utf8');
          const anchor = `assert.match(showroom, /overlay\\.className = 'lot-screen lot-showroom'/,\n  'The production car selector must mount with the stable showroom state hook');`;
          const addition = `${anchor}\nassert.match(\n  showroom,\n  /export const LOT_CAR_ORDER = Object\\.freeze\\(\\[\\s*'classic',\\s*'tractor',/,\n  'The Learner Car must be first in The Lot and the Tractor must follow it'\n);`;
          if (!test.includes(anchor)) throw new Error('Lot regression anchor not found');
          test = test.replace(anchor, addition);
          test = test.replace('Opening The Lot must never launch all 16 real-model thumbnails', 'Opening The Lot must never launch all 17 real-model thumbnails');
          fs.writeFileSync(testPath, test);

          const releasePath = 'turn/release.json';
          const release = JSON.parse(fs.readFileSync(releasePath, 'utf8'));
          if (release.version !== '1.21.0' || release.id !== '2026.09.16-r244') {
            throw new Error(`Unexpected release base: ${release.version} ${release.id}`);
          }
          release.id = '2026.09.16-r245';
          release.cacheKey = '20260916-r245';
          fs.writeFileSync(releasePath, `${JSON.stringify(release, null, 2)}\n`);
          NODE
      - name: Synchronize release surfaces
        run: node turn/scripts/release.mjs --write
      - name: Verify focused Lot regression
        run: node turn-tests/m8-lot-selection-production.mjs
      - name: Verify release source of truth
        run: node turn/scripts/release.mjs --check
      - name: Commit r245 changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add turn turn-lab turn-next yourturn turn-tests/m8-lot-selection-production.mjs
          git commit -m 'Make Learner Car first in The Lot and publish r245'
          git push

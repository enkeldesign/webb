name: TURN r67 release sync

on:
  push:
    branches:
      - agent/turn-r67-elevation-foundation
    paths:
      - 'turn/release.json'
      - '.github/workflows/turn-r67-release-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/turn-r67-elevation-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate release entry
        run: node turn/scripts/release.mjs --write
      - name: Commit generated release files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turn/index.html
          git diff --cached --quiet && exit 0
          git commit -m "TURN r67: publish elevation foundation"
          git push origin HEAD:agent/turn-r67-elevation-foundation

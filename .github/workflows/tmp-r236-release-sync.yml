name: Temporary TURN r236 release sync

on:
  push:
    branches:
      - fix/spectate-ui-state-r236

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/spectate-ui-state-r236
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Synchronize release surfaces
        run: node turn/scripts/release.mjs --write
      - name: Commit generated release surfaces
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turn turn-next turn-lab yourturn
          git commit -m "Synchronize TURN r236 release surfaces"
          git push origin HEAD:fix/spectate-ui-state-r236

name: TURN r245 SMV SHIFT sync

on:
  push:
    branches:
      - sol/learner-first-lot-r245

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Make Tractor SMV SHIFT raise the speed ceilings
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('turn/vehicle/physics.js')
          s = p.read_text()
          s = s.replace("export const SMV_SPEED_LIMITS_KMH = Object.freeze({\n  drift: 50,\n  gas: 75,\n  boost: 100\n});", "// These are the user-facing HUD ceilings. TURN's production HUD intentionally\n// uses 2.9 displayed km/h per simulation speed unit, so SMV converts from that\n// scale rather than physical 3.6 km/h per m/s.\nconst TURN_HUD_SPEED_SCALE = 2.9;\nexport const SMV_SPEED_LIMITS_KMH = Object.freeze({\n  drift: 40,\n  gas: 60,\n  boost: 80\n});\nexport const SMV_SHIFT_SPEED_LIMITS_KMH = Object.freeze({\n  drift: 50,\n  gas: 70,\n  boost: 90\n});")
          s = s.replace("  boostActive = false,\n  driftHeld = false,\n  throttle = 0\n} = {}) {\n  if (String(vehicleId || '') !== SMV_VEHICLE_ID || perkUnlocked !== true) return Infinity;\n  if (boostActive) return SMV_SPEED_LIMITS_KMH.boost / 3.6;\n  if (driftHeld) return SMV_SPEED_LIMITS_KMH.drift / 3.6;\n  if (nonNegativeNumber(throttle, 0) > 0) return SMV_SPEED_LIMITS_KMH.gas / 3.6;\n  return Infinity;\n}", "  boostActive = false,\n  driftHeld = false,\n  throttle = 0,\n  shiftActive = false\n} = {}) {\n  if (String(vehicleId || '') !== SMV_VEHICLE_ID || perkUnlocked !== true) return Infinity;\n  const limits = shiftActive === true ? SMV_SHIFT_SPEED_LIMITS_KMH : SMV_SPEED_LIMITS_KMH;\n  if (boostActive) return limits.boost / TURN_HUD_SPEED_SCALE;\n  if (driftHeld) return limits.drift / TURN_HUD_SPEED_SCALE;\n  if (nonNegativeNumber(throttle, 0) > 0) return limits.gas / TURN_HUD_SPEED_SCALE;\n  return Infinity;\n}")
          s = s.replace("    boostActive: effectiveBoostActive,\n    driftHeld,\n    throttle: driveThrottle\n  });", "    boostActive: effectiveBoostActive,\n    driftHeld,\n    throttle: driveThrottle,\n    shiftActive: state.shiftActive === true\n  });")
          p.write_text(s)

          p = Path('turn-tests/tractor-smv-production.mjs')
          s = p.read_text()
          s = s.replace("assert.match(lotSource, /'sedan-sports',[\\s\\S]*'tractor',[\\s\\S]*'race',[\\s\\S]*'vintage-racer'/);\nassert.match(physicsSource, /drift: 50,[\\s\\S]*gas: 75,[\\s\\S]*boost: 100/);", "assert.match(lotSource, /'classic',[\\s\\S]*'tractor',[\\s\\S]*'truck'/);\nassert.match(physicsSource, /SMV_SPEED_LIMITS_KMH[\\s\\S]*drift: 40,[\\s\\S]*gas: 60,[\\s\\S]*boost: 80/);\nassert.match(physicsSource, /SMV_SHIFT_SPEED_LIMITS_KMH[\\s\\S]*drift: 50,[\\s\\S]*gas: 70,[\\s\\S]*boost: 90/);\nassert.match(physicsSource, /shiftActive: state\\.shiftActive === true/,\n  'SMV speed ceilings must follow the live SHIFT state');")
          s = s.replace("console.log('TURN Tractor SMV catalog, Lot order, propulsion ceilings and SHIFT profile checks passed.');", "console.log('TURN Tractor SMV catalog, Lot order, base/SHIFT ceilings and SHIFT profile checks passed.');")
          p.write_text(s)

          p = Path('turn/content/about-history-current.js')
          s = p.read_text()
          s = s.replace("    '50 / 75 / 100 km/h DRIFT, GAS and BOOST propulsive ceilings',\n    'SHIFT progression to 2 / 2 / 4 / 2 / 4 / 4',", "    '40 / 60 / 80 km/h DRIFT, GAS and BOOST practice ceilings',\n    'SHIFT progression to 2 / 2 / 4 / 2 / 4 / 4 and 50 / 70 / 90 km/h ceilings',")
          p.write_text(s)
          PY
      - name: Verify focused Tractor and Lot regressions
        run: |
          node turn-tests/tractor-smv-production.mjs
          node turn-tests/m8-lot-selection-production.mjs
      - name: Verify release source of truth
        run: node turn/scripts/release.mjs --check
      - name: Commit SMV SHIFT update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add turn/vehicle/physics.js turn-tests/tractor-smv-production.mjs turn/content/about-history-current.js
          git commit -m 'Raise Tractor SMV ceilings with SHIFT'
          git push

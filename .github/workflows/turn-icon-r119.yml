name: Publish TURN r119 icon suite

on:
  push:
    branches:
      - turn-icon-r119-release

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check cairosvg==2.8.2 pillow==11.3.0

      - name: Generate icon suite and metadata
        run: |
          python turn/scripts/publish-icon-r119.py
          node turn/scripts/release.mjs --write
          node turn-next/scripts/build-parity-app.mjs
          node turn-next/scripts/build-parity-entry.mjs

      - name: Verify generated release
        run: |
          node turn/scripts/release.mjs --check
          node turn-next/scripts/build-parity-app.mjs --check
          node turn-next/scripts/build-parity-entry.mjs --check
          node turn-lab/tests/app-icon-production.mjs

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish TURN r119 icon suite"
          git push origin HEAD:turn-icon-r119-release

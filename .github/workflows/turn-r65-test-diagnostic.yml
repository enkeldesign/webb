name: TURN r65 test diagnostic

on:
  push:
    branches:
      - agent/turn-r65-rival-visual-sync
    paths:
      - '.github/workflows/turn-r65-test-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: agent/turn-r65-rival-visual-sync

      - name: Capture focused test output
        run: |
          node turn-tests/rival-visual-sync-production.mjs > turn-tests/rival-visual-sync-diagnostic.log 2>&1 || true

      - name: Commit diagnostic output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turn-tests/rival-visual-sync-diagnostic.log
          git commit -m "Capture rival visual test diagnostic"
          git push

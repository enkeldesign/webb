name: TURN r68 test patch

on:
  push:
    branches:
      - agent/turn-r68-cliffside-track
    paths:
      - 'turn/scripts/patch-r68-multi-track-test.mjs'
      - '.github/workflows/turn-r68-test-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/turn-r68-cliffside-track
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply verified test patch
        run: node turn/scripts/patch-r68-multi-track-test.mjs
      - name: Commit patched regression
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turn-lab/tests/multi-track-production.mjs
          git diff --cached --quiet && exit 0
          git commit -m "TURN r68: expand the generic multi-track regression"
          git push origin HEAD:agent/turn-r68-cliffside-track

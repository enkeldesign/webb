name: "TURN r240 catalog identity fix"

on:
  push:
    branches:
      - balance/flow-shift-x3-r240

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: balance/flow-shift-x3-r240
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Canonicalize vehicle catalog targets
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('turn/scripts/release.mjs')
          s = p.read_text()
          marker = "  imports['/turn/progression/trophy-road.js?revision=r253-supercar-release-base']\n    = `/turn/progression/trophy-road.js?build=${release.cacheKey}`;\n"
          addition = """  const catalogPath = '/turn/vehicle/catalog.js';
          const catalogTarget = `${catalogPath}?build=${release.cacheKey}`;
          imports[catalogPath] = catalogTarget;
          for (const [specifier, existing] of Object.entries(imports)) {
            if (typeof existing !== 'string') continue;
            if (new URL(existing, 'https://enkel.design/turn/').pathname === catalogPath) {
              imports[specifier] = catalogTarget;
            }
          }

          """
          if s.count(marker) != 1:
              raise SystemExit('perk feedback release marker missing')
          p.write_text(s.replace(marker, addition + marker, 1))

          p = Path('turn-tests/release-composition-production.mjs')
          s = p.read_text()
          marker = "for (const [label, importMap] of [['Production TURN', headGraph.importMap], ['TURN NEXT', nextImportMap], ['YOUR TURN', yourTurnImportMap]]) {\n  assert.equal(importMap.imports['/turn/vehicle/car-visual-resources.js'],"
          replacement = """for (const [label, importMap] of [['Production TURN', headGraph.importMap], ['TURN NEXT', nextImportMap], ['YOUR TURN', yourTurnImportMap]]) {
            const catalogTarget = `/turn/vehicle/catalog.js?build=${headGraph.release.cacheKey}`;
            assert.equal(importMap.imports['/turn/vehicle/catalog.js'], catalogTarget,
              `${label} must route the canonical vehicle catalog through the current release build`);
            for (const target of Object.values(importMap.imports || {})) {
              if (typeof target !== 'string') continue;
              if (new URL(target, productionDocumentUrl).pathname !== '/turn/vehicle/catalog.js') continue;
              assert.equal(target, catalogTarget,
                `${label} must route every active vehicle catalog alias through the current release build`);
            }
            assert.equal(importMap.imports['/turn/vehicle/car-visual-resources.js'],"""
          if s.count(marker) != 1:
              raise SystemExit('release composition visual-owner marker missing')
          p.write_text(s.replace(marker, replacement, 1))
          PY
      - name: Regenerate release surfaces
        run: node turn/scripts/release.mjs --write
      - name: Verify identity and focused gameplay
        run: |
          node turn/scripts/release.mjs --check
          node turn-tests/release-composition-production.mjs --base origin/main
          node turn-tests/flow-shift-tuning-production.mjs
          node turn-tests/flow-shift-accessibility-production.mjs
          node turn-lab/tests/trophy-road-production.mjs
      - name: Commit clean fix
        run: |
          rm .github/workflows/tmp-r240-catalog-identity.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Keep vehicle catalog on the active release identity"
          git push origin HEAD:balance/flow-shift-x3-r240

name: TURN Mountain history sync

on:
  push:
    branches:
      - feature/mountain-track
    paths:
      - '.github/workflows/turn-mountain-history-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mountain-track
      - name: Add Mountain release history
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('turn/content/about-history.js')
          s = p.read_text()
          development = """  ,{\n    period: '17 August',\n    title: 'MOUNTAIN turns Track 6 into an alpine journey',\n    paragraphs: [\n      'TURN’s sixth production track replaces the old Track 6 placeholder with MOUNTAIN: a 49-metre alpine route that begins in a warm snowy village, climbs in long flowing curves around the hidden backside, reaches a river at the snow line and then changes character into an exposed front-face hairpin descent beside a waterfall.',\n      'The world combines a procedural alpine ground treatment, batched spruce forests and Cliffside-style granite with a cozy chalet village, chapel, inn, lanterns, Kenney Fantasy Town landmarks, a lake, summit river, waterfall mist and a layered mountain backdrop. Snow is deliberately visual rather than an ice-grip gimmick, while guardrail-aligned containment keeps the descent difficult without letting cars pass through scenery.',\n      'MOUNTAIN also joins TURN’s non-visual and progression systems as a first-class track: Drive By Ear changes from long flowing climb notes to alternating severity-three slalom calls, Color Cues adds a distinct blue family, every-track achievements now include six tracks, and Trophy Road unlocks MOUNTAIN at 1,000 trophies.'\n    ],\n    milestones: [\n      'Sixth production track with a 49 m summit and cinematic village-to-peak intro',\n      'Snowy village, summit river, front-face slalom, waterfall and alpine backdrop',\n      'TURN 1.9.0 · 2026.08.17-r173 with MOUNTAIN at 1,000 trophies'\n    ]\n  }\n"""
          marker = "\n]);\n\nexport const CHANGELOG = Object.freeze(["
          if "title: 'MOUNTAIN turns Track 6 into an alpine journey'" not in s:
              s = s.replace(marker, "\n" + development + marker, 1)

          changelog = """  ,{\n    date: '17 August',\n    entries: [\n      ['1.9.0 r173', 'Adds MOUNTAIN as TURN’s sixth production track and 1,000-trophy reward: snowy village, long alpine climb, summit river, technical slalom descent, waterfall and cinematic mountain backdrop.'],\n      ['MOUNTAIN world', 'Adds procedural alpine ground texture, snow line, batched spruce forest and granite, cozy chalets/inn/chapel/lanterns, Kenney Fantasy Town landmarks, lake, river, waterfall mist and guardrail-aligned containment.'],\n      ['MOUNTAIN accessibility', 'Adds a distinct blue Color Cue and Chromatic Camouflage family, six-track achievement semantics and a Drive By Ear map that deliberately changes from flowing climb calls to alternating tight descent calls.']\n    ]\n  }\n"""
          marker2 = "\n]);\n\nexport const CURRENT_RELEASE = Object.freeze({"
          if "['1.9.0 r173'" not in s:
              s = s.replace(marker2, "\n" + changelog + marker2, 1)

          start = s.index("export const CURRENT_RELEASE = Object.freeze({")
          if start >= 0:
              end = s.index("});", start) + 3
              current = """export const CURRENT_RELEASE = Object.freeze({\n  version: '1.9.0',\n  build: '2026.08.17-r173',\n  note: 'TURN 1.9.0 build r173 adds MOUNTAIN, a sixth production track with an alpine village climb, snow-line river, technical hairpin descent and waterfall, integrated with Trophy Road, Drive By Ear and Color Cues.'\n});"""
              s = s[:start] + current + s[end:]
          p.write_text(s)
          PY
      - name: Commit history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add turn/content/about-history.js
          git diff --cached --quiet || git commit -m 'Document TURN 1.9.0 Mountain release'
          git push origin HEAD:feature/mountain-track

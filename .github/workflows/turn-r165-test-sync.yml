name: Make release cache regression build-aware

on:
  push:
    branches:
      - fix/turn-cache-refresh-r165
    paths:
      - '.github/workflows/turn-r165-test-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/turn-cache-refresh-r165

      - name: Make Super Sedan cache assertions release-aware
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('turn-tests/super-sedan-unranked-production.mjs')
          text = path.read_text()
          anchor = "import { isSportsSedanEasterEgg } from '../turn/vehicle/catalog.js?test=r195-unranked-super-sedan';\n\n"
          replacement = anchor + "const release = JSON.parse(await fs.readFile(new URL('../turn/release.json', import.meta.url), 'utf8'));\n\n"
          if anchor not in text:
              raise SystemExit('Could not find release insertion anchor')
          text = text.replace(anchor, replacement, 1)
          old = """  assert.match(index, /lap-system-r86\\.js\\?build=20260811-r164&revision=r195-unranked-super-sedan/,\n    'Prod and TURN LAB must cache-bust the unranked lap runtime');\n  assert.match(index, /rival-storage\\.js\\?build=20260811-r164&revision=r195-unranked-super-sedan/,\n    'Prod and TURN LAB must cache-bust ranked rival storage');"""
          new = """  assert.match(index, new RegExp(`lap-system-r86\\\\.js\\\\?build=${release.cacheKey}&revision=r195-unranked-super-sedan`),\n    'Prod and TURN LAB must cache-bust the unranked lap runtime with the current release identity');\n  assert.match(index, new RegExp(`rival-storage\\\\.js\\\\?build=${release.cacheKey}&revision=r195-unranked-super-sedan`),\n    'Prod and TURN LAB must cache-bust ranked rival storage with the current release identity');"""
          if old not in text:
              raise SystemExit('Could not find hard-coded cache assertions')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Verify updated regression
        run: node turn-tests/super-sedan-unranked-production.mjs

      - name: Commit test fix and remove this temporary workflow
        run: |
          git rm .github/workflows/turn-r165-test-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add turn-tests/super-sedan-unranked-production.mjs
          git commit -m 'Make release cache regression use current TURN build'
          git push origin HEAD:fix/turn-cache-refresh-r165

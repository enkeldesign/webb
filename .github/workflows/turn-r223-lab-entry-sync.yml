name: TURN r223 LAB entry sync

on:
  push:
    branches:
      - fix/turn-low-graphics-render-only-r223

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/turn-low-graphics-render-only-r223
          fetch-depth: 0

      - name: Patch release generator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('turn/scripts/release.mjs')
          source = path.read_text()
          old = '''    .replace(/((?:href|src)="\\.\\/[^"?]+\\?build=)\\d{8}-r\\d+/g, `$1${release.cacheKey}`)\n    .replace(/<script type="importmap">[\\s\\S]*?<\\/script>/, productionImportMap);'''
          new = '''    .replace(/((?:href|src)="\\.\\/[^"?]+\\?build=)\\d{8}-r\\d+/g, `$1${release.cacheKey}`)\n    .replace(\n      /(src="\\.\\/tracks\\/kenney-track-landmarks-r517\\.js\\?revision=r532-countryside-nature-polish)(?:&build=\\d{8}-r\\d+)?"/,\n      `$1&build=${release.cacheKey}"`\n    )\n    .replace(/<script type="importmap">[\\s\\S]*?<\\/script>/, productionImportMap);'''
          if old not in source:
              raise SystemExit('Expected renderLabReleaseIndex anchor not found')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Regenerate and validate release parity
        run: |
          node turn/scripts/release.mjs --write
          node turn/scripts/release.mjs --check
          node turn-lab/tests/mountain-long-lab.mjs
          node turn-tests/release-composition-production.mjs --base=7706952fb8f3a0f9d6320fa487af70ec0adcf4f7
          git diff --check

      - name: Commit synchronized release surfaces
        run: |
          git config user.name 'enkeldesign'
          git config user.email '75029856+enkeldesign@users.noreply.github.com'
          git add turn/scripts/release.mjs turn-lab/index.html
          git commit -m 'Keep TURN LAB landmark entry release-bound'
          git push origin HEAD:fix/turn-low-graphics-render-only-r223

name: TURN r225 multi-track assertion fix

on:
  push:
    branches:
      - fix/mountain-warning-landmark-r225

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/mountain-warning-landmark-r225
          fetch-depth: 0

      - name: Update stale multi-track release assertion
        run: python3 .github/turn-r225-multitrack-test-fix.py

      - name: Validate affected contracts
        run: |
          node turn-lab/tests/multi-track-production.mjs
          node turn-tests/mountain-track-production.mjs
          node turn/scripts/release.mjs --check
          node turn-tests/release-composition-production.mjs --base=bd56be1d7454b1cd51634da50bbb68b40d51611b
          git diff --check

      - name: Commit test correction
        run: |
          git config user.name "enkeldesign"
          git config user.email "75029856+enkeldesign@users.noreply.github.com"
          git add turn-lab/tests/multi-track-production.mjs
          if git diff --cached --quiet; then
            echo "No test change to commit."
            exit 0
          fi
          git commit -m "Update MOUNTAIN multi-track release assertion"
          git push origin HEAD:fix/mountain-warning-landmark-r225

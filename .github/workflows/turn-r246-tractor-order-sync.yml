name: TURN r246 Tractor order sync

on:
  push:
    branches:
      - sol/tractor-second-r246

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Put Tractor second in trophy order
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('turn/garage/lot-trophy-order.js')
          s = p.read_text()
          old = "export const LOT_TROPHY_ORDER = Object.freeze([\n  'classic',\n  'truck',"
          new = "export const LOT_TROPHY_ORDER = Object.freeze([\n  'classic',\n  'tractor',\n  'truck',"
          if old not in s:
            raise SystemExit('Expected Lot trophy order anchor not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('turn-tests/m8-lot-selection-production.mjs')
          s = p.read_text()
          anchor = "assert.match(\n  showroom,\n  /export const LOT_CAR_ORDER = Object\\.freeze\\(\\[\\s*'classic',\\s*'tractor',/,\n  'The Learner Car must be first in The Lot and the Tractor must follow it'\n);"
          addition = anchor + "\nassert.match(\n  trophyOrder,\n  /export const LOT_TROPHY_ORDER = Object\\.freeze\\(\\[\\s*'classic',\\s*'tractor',/,\n  'The enhanced Lot order must keep Learner Car first and Tractor second'\n);"
          if "const trophyOrder =" not in s:
            import_anchor = "const showroom = await fs.readFile(new URL('../turn/garage/lot-showroom-experiment.js', import.meta.url), 'utf8');"
            if import_anchor not in s:
              raise SystemExit('M8 import anchor not found')
            s = s.replace(import_anchor, import_anchor + "\nconst trophyOrder = await fs.readFile(new URL('../turn/garage/lot-trophy-order.js', import.meta.url), 'utf8');", 1)
          if anchor not in s:
            raise SystemExit('M8 order assertion anchor not found')
          s = s.replace(anchor, addition, 1)
          p.write_text(s)

          p = Path('turn/release.json')
          release = json.loads(p.read_text())
          if release.get('version') != '1.21.0' or release.get('id') != '2026.09.16-r245':
            raise SystemExit(f"Unexpected release base: {release}")
          release['id'] = '2026.09.16-r246'
          release['cacheKey'] = '20260916-r246'
          p.write_text(json.dumps(release, indent=2) + '\n')
          PY
      - name: Synchronize release surfaces
        run: node turn/scripts/release.mjs --write
      - name: Verify focused Lot regression
        run: node turn-tests/m8-lot-selection-production.mjs
      - name: Verify release source of truth
        run: node turn/scripts/release.mjs --check
      - name: Commit r246 changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add turn turn-lab turn-next yourturn turn-tests/m8-lot-selection-production.mjs
          git commit -m 'Keep Tractor second in enhanced Lot order and publish r246'
          git push

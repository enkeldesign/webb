name: TURN r246 Tractor order sync

on:
  push:
    branches:
      - sol/tractor-second-r246

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Put Tractor second in trophy order
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('turn/garage/lot-trophy-order.js')
          s = p.read_text()
          old = "export const LOT_TROPHY_ORDER = Object.freeze([\n  'classic',\n  'truck',"
          new = "export const LOT_TROPHY_ORDER = Object.freeze([\n  'classic',\n  'tractor',\n  'truck',"
          if old not in s:
            raise SystemExit('Expected Lot trophy order anchor not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('turn-tests/tractor-smv-production.mjs')
          s = p.read_text()
          import_anchor = "const lotSource = await fs.readFile(new URL('../turn/garage/lot-showroom-experiment.js', import.meta.url), 'utf8');"
          if import_anchor not in s:
            raise SystemExit('Tractor regression import anchor not found')
          s = s.replace(import_anchor, import_anchor + "\nconst trophyOrderSource = await fs.readFile(new URL('../turn/garage/lot-trophy-order.js', import.meta.url), 'utf8');", 1)
          assertion_anchor = "assert.match(lotSource, /'classic',[\\s\\S]*'tractor',[\\s\\S]*'truck'/);"
          if assertion_anchor not in s:
            raise SystemExit('Tractor order assertion anchor not found')
          s = s.replace(assertion_anchor, assertion_anchor + "\nassert.match(trophyOrderSource, /'classic',[\\s\\S]*'tractor',[\\s\\S]*'truck'/,\n  'The enhanced Trophy Road order must keep Learner Car first and Tractor second');", 1)
          p.write_text(s)

          p = Path('turn/release.json')
          release = json.loads(p.read_text())
          if release.get('version') != '1.21.0' or release.get('id') != '2026.09.16-r245':
            raise SystemExit(f"Unexpected release base: {release}")
          release['id'] = '2026.09.16-r246'
          release['cacheKey'] = '20260916-r246'
          p.write_text(json.dumps(release, indent=2) + '\n')
          PY
      - name: Synchronize release surfaces
        run: node turn/scripts/release.mjs --write
      - name: Verify focused Tractor regression
        run: node turn-tests/tractor-smv-production.mjs
      - name: Verify release source of truth
        run: node turn/scripts/release.mjs --check
      - name: Commit r246 changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add turn turn-lab turn-next yourturn turn-tests/tractor-smv-production.mjs
          git commit -m 'Keep Tractor second in enhanced Lot order and publish r246'
          git push

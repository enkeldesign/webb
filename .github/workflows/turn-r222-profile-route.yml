name: TURN r222 graphics profile route

on:
  push:
    branches:
      - 'fix/turn-low-graphics-aa-scenery-r222'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/turn-low-graphics-aa-scenery-r222
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Make graphics profile release-bound
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path('turn/three-runtime.js')
          source = runtime.read_text()
          old = "import { graphicsProfile, graphicsPixelRatio } from './graphics-profile.js?build=20260913-r222';"
          new = "import { graphicsProfile, graphicsPixelRatio } from '/turn/graphics-profile.js';"
          if source.count(old) != 1:
              raise SystemExit('three-runtime graphics-profile r222 import not found exactly once')
          runtime.write_text(source.replace(old, new, 1))

          release = Path('turn/scripts/release.mjs')
          source = release.read_text()
          old = "  imports['three-native'] = nativeTarget;\n  imports.three = `/turn/three-runtime.js?build=${release.cacheKey}`;\n}"
          new = "  imports['three-native'] = nativeTarget;\n  imports.three = `/turn/three-runtime.js?build=${release.cacheKey}`;\n  imports['/turn/graphics-profile.js'] = `/turn/graphics-profile.js?build=${release.cacheKey}`;\n}"
          if source.count(old) != 1:
              raise SystemExit('release graphics runtime synchronization block not found exactly once')
          release.write_text(source.replace(old, new, 1))

          low_test = Path('turn-tests/low-graphics-production.mjs')
          source = low_test.read_text()
          anchor = "assert.match(indexSource, /\"three\": \"\\/turn\\/three-runtime\\.js\\?build=20260913-r222\"/);\n"
          addition = anchor + "assert.match(indexSource, /\"\\/turn\\/graphics-profile\\.js\": \"\\/turn\\/graphics-profile\\.js\\?build=20260913-r222\"/);\n"
          if source.count(anchor) != 1:
              raise SystemExit('LOW GRAPHICS index runtime assertion anchor not found')
          source = source.replace(anchor, addition, 1)
          anchor = "assert.match(runtimeSource, /antialias: true/);\n"
          addition = "assert.match(runtimeSource, /from '\\/turn\\/graphics-profile\\.js'/);\n" + anchor
          if source.count(anchor) != 1:
              raise SystemExit('LOW GRAPHICS runtime assertion anchor not found')
          low_test.write_text(source.replace(anchor, addition, 1))

          release_test = Path('turn-tests/release-production.mjs')
          source = release_test.read_text()
          anchor = "assert.equal(futureImports.three, `/turn/three-runtime.js?build=${futureRelease.cacheKey}`,\n  'Future releases must advance the shared graphics runtime identity');\n"
          addition = anchor + "assert.equal(futureImports['/turn/graphics-profile.js'], `/turn/graphics-profile.js?build=${futureRelease.cacheKey}`,\n  'Future releases must advance the LOW GRAPHICS profile identity');\n"
          if source.count(anchor) != 1:
              raise SystemExit('Future graphics runtime release assertion anchor not found')
          release_test.write_text(source.replace(anchor, addition, 1))
          PY
      - run: node turn/scripts/release.mjs --write
      - run: node turn/scripts/release.mjs --check
      - run: node turn-tests/low-graphics-production.mjs
      - run: node turn-tests/release-production.mjs
      - run: node turn-tests/release-composition-production.mjs --base 8f64ee2407951d6795ed14511476f39c9ef3cfb6
      - name: Commit profile routing
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add turn turn-next turn-lab yourturn turn-tests
          git commit -m 'Bind LOW GRAPHICS profile to release identity [skip ci]'
          git push origin HEAD:fix/turn-low-graphics-aa-scenery-r222

name: TURN 1.18.0 parity follow-up

on:
  push:
    branches:
      - release/1.18.0-r213

permissions:
  contents: write

concurrency:
  group: turn-release-r213-followup
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Synchronize YOUR TURN and release-aware performance test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = '20260909-r212'
          new = '20260911-r213'

          yourturn = Path('yourturn/index.html')
          text = yourturn.read_text()
          if old not in text:
              raise SystemExit('Expected r212 production identity was not found in YOUR TURN')
          yourturn.write_text(text.replace(old, new))

          test = Path('turn-lab/tests/start-finish-line-performance.mjs')
          source = test.read_text()
          old_head = "const [storage, sharing, chromatic, rivalOnboarding, index, shareBootstrap] = await Promise.all([\n"
          new_head = "const [storage, sharing, chromatic, rivalOnboarding, index, shareBootstrap, releaseSource] = await Promise.all([\n"
          source = source.replace(old_head, new_head, 1)
          old_tail = "  fs.readFile(new URL('../../turn/social/your-turn-share-bootstrap.js', import.meta.url), 'utf8')\n]);\n"
          new_tail = "  fs.readFile(new URL('../../turn/social/your-turn-share-bootstrap.js', import.meta.url), 'utf8'),\n  fs.readFile(new URL('../../turn/release.json', import.meta.url), 'utf8')\n]);\n\nconst release = JSON.parse(releaseSource);\nconst escapedCacheKey = release.cacheKey.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&');\n"
          source = source.replace(old_tail, new_tail, 1)
          source = source.replace(
              "assert.match(index, /rival-storage\\.js\\?build=20260909-r212&revision=r224-finish-line-summary/,",
              "assert.match(index, new RegExp(`rival-storage\\\\.js\\\\?build=${escapedCacheKey}&revision=r224-finish-line-summary`),"
          )
          source = source.replace(
              "assert.match(index, /rival-onboarding\\.js\\?build=20260909-r212&revision=r277-main-rival-gpu-warmup/,",
              "assert.match(index, new RegExp(`rival-onboarding\\\\.js\\\\?build=${escapedCacheKey}&revision=r277-main-rival-gpu-warmup`),"
          )
          if '20260909-r212' in source:
              raise SystemExit('A stale r212 assertion remains in start/finish performance regression')
          test.write_text(source)
          PY

      - name: Verify r213 release parity
        run: |
          node turn/scripts/release.mjs --check
          node turn-tests/release-production.mjs
          node turn-tests/release-composition-production.mjs --base 39a7d503edfe4702a17986635ddb6eea19a401e4
          node turn-tests/yourturn-engine-parity-production.mjs
          node turn-tests/yourturn-motion-parity-production.mjs
          node turn-tests/yourturn-turn-sharing-production.mjs
          node turn-tests/yourturn-short-links-production.mjs
          node turn-lab/tests/start-finish-line-performance.mjs

      - name: Commit parity fixes
        run: |
          rm .github/workflows/release-r213-followup.yml
          git config user.name "TURN release automation"
          git config user.email "75029856+enkeldesign@users.noreply.github.com"
          git add -A
          git commit -m "Synchronize YOUR TURN with TURN 1.18.0"
          git push origin HEAD:release/1.18.0-r213

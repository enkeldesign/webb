name: Tune LOW GRAPHICS r222

on:
  push:
    branches:
      - fix/turn-low-graphics-aa-scenery-r222

permissions:
  contents: write

jobs:
  tune:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/turn-low-graphics-aa-scenery-r222
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Tune LOW GRAPHICS and release r222
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if s.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}, found {s.count(old)}')
              p.write_text(s.replace(old, new, 1))

          replace_once('turn/graphics-profile.js', '  antialias: !lowGraphics,', '  antialias: true,')
          replace_once('turn/graphics-profile.js', '  optionalScenery: !lowGraphics', '  optionalScenery: true')
          replace_once('turn/three-runtime.js', '? { ...parameters, antialias: false }', '? { ...parameters, antialias: true }')

          world = Path('turn/render/world.js')
          s = world.read_text()
          s = s.replace("import { graphicsProfile } from '../graphics-profile.js';\n", '', 1)
          pattern = re.compile(r"\n  if \(graphicsProfile\.lowGraphics\) \{.*?\n  \}\n\n  const \[beauty, art, identity", re.S)
          s2, count = pattern.subn('\n  const [beauty, art, identity', s, count=1)
          if count != 1:
              raise SystemExit(f'turn/render/world.js: expected one LOW GRAPHICS world-loader branch, found {count}')
          world.write_text(s2)

          replace_once(
              'turn/ui/low-graphics-setting.js',
              'Uses lower resolution, no shadows or antialiasing, fewer real lights, no outline draw calls and less cosmetic scenery. Restart TURN to apply changes.',
              'Uses lower resolution, no shadows, fewer real lights and no outline draw calls. Antialiasing and full track scenery stay on. Restart TURN to apply changes.'
          )

          test = Path('turn-tests/low-graphics-production.mjs')
          s = test.read_text()
          s = s.replace("assert.equal(release.version, '1.19.7');", "assert.equal(release.version, '1.19.8');")
          s = s.replace("assert.equal(release.id, '2026.09.13-r221');", "assert.equal(release.id, '2026.09.13-r222');")
          s = s.replace("assert.equal(release.cacheKey, '20260913-r221');", "assert.equal(release.cacheKey, '20260913-r222');")
          s = s.replace('build=20260913-r221', 'build=20260913-r222')
          s = s.replace('/antialias: !lowGraphics/', '/antialias: true/')
          s = s.replace('/optionalScenery: !lowGraphics/', '/optionalScenery: true/')
          s = s.replace('/antialias: false/', '/antialias: true/')
          old_world_assertions = """const lowBranchStart = worldSource.indexOf('if (graphicsProfile.lowGraphics)');
const fullBranchStart = worldSource.indexOf('const [beauty, art, identity');
assert.ok(lowBranchStart >= 0 && fullBranchStart > lowBranchStart, 'World loader exposes a LOW GRAPHICS branch before the full cosmetic graph.');
const lowBranch = worldSource.slice(lowBranchStart, fullBranchStart);
assert.doesNotMatch(lowBranch, /world-beauty\\.js/);
assert.doesNotMatch(lowBranch, /world-art-pass\\.js/);
assert.doesNotMatch(lowBranch, /countryside-scenery-r177\\.js/);
assert.match(lowBranch, /countryside-bella-r166\\.js/);
assert.match(lowBranch, /track-identity\\.js/);
assert.match(lowBranch, /section-intensity\\.js/);
"""
          new_world_assertions = """assert.doesNotMatch(worldSource, /if \\(graphicsProfile\\.lowGraphics\\)/,
  'LOW GRAPHICS must not bypass the full Countryside cosmetic graph.');
assert.match(worldSource, /world-beauty\\.js/);
assert.match(worldSource, /world-art-pass\\.js/);
assert.match(worldSource, /countryside-scenery-r177\\.js/);
assert.match(worldSource, /countryside-bella-r166\\.js/);
assert.match(worldSource, /track-identity\\.js/);
assert.match(worldSource, /section-intensity\\.js/);
"""
          if old_world_assertions not in s:
              raise SystemExit('turn-tests/low-graphics-production.mjs: old world assertions not found')
          test.write_text(s.replace(old_world_assertions, new_world_assertions, 1))

          replace_once(
              'turn-tests/low-graphics-browser-smoke.mjs',
              "assert.equal(result.antialias, false, `${browserType.name()} disables WebGL antialiasing.`);",
              "assert.equal(result.antialias, true, `${browserType.name()} keeps WebGL antialiasing enabled.`);"
          )

          history = Path('turn/content/about-history-current.js')
          s = history.read_text()
          marker = """const previousLatest = BASE_CHANGELOG.at(-1);"""
          tuning = """const LOW_GRAPHICS_TUNING_HISTORY = Object.freeze({
  period: '13 September',
  title: 'LOW GRAPHICS keeps the smooth edges and full countryside',
  paragraphs: Object.freeze([
    'TURN 1.19.8 tunes LOW GRAPHICS after device testing. Antialiasing stays enabled, and Countryside once again loads its deferred world-beauty, art and extra scenery passes while the mode keeps its DPR 1.0 cap, disabled shadows, reduced real lights and suppressed outline draw calls.',
    'This keeps the strongest visual-quality wins that proved worthwhile in testing without giving up the lower-resolution, shadowless rendering profile aimed at older devices.'
  ]),
  milestones: Object.freeze([
    'Antialiasing remains enabled in LOW GRAPHICS',
    'Full Countryside world-beauty, art and extra scenery restored',
    'TURN 1.19.8 · 2026.09.13-r222'
  ])
});

"""
          if s.count(marker) != 1:
              raise SystemExit('about history insertion marker not unique')
          s = s.replace(marker, tuning + marker, 1)
          s = s.replace('  LOW_GRAPHICS_HISTORY\n]);', '  LOW_GRAPHICS_HISTORY,\n  LOW_GRAPHICS_TUNING_HISTORY\n]);', 1)
          changelog_anchor = """      Object.freeze(['One graphics profile', 'Applies the same low profile to the race renderer and TURN secondary WebGL previews after a restart.'])"""
          changelog_replacement = changelog_anchor + ",\n      Object.freeze(['1.19.8 r222', 'Keeps antialiasing and the full Countryside world-beauty, art and extra scenery pipeline enabled in LOW GRAPHICS after device testing.']),\n      Object.freeze(['Tuned low profile', 'Retains DPR 1.0, disabled shadows, fewer real lights and suppressed outline draw calls while restoring those visual-quality features.'])"
          if s.count(changelog_anchor) != 1:
              raise SystemExit('about history changelog anchor not unique')
          s = s.replace(changelog_anchor, changelog_replacement, 1)
          s = s.replace("note: 'TURN 1.19.7 adds LOW GRAPHICS for better performance on older devices.'", "note: 'TURN 1.19.8 tunes LOW GRAPHICS to keep antialiasing and full Countryside scenery.'", 1)
          history.write_text(s)

          Path('turn/release.json').write_text(json.dumps({
              'version': '1.19.8',
              'id': '2026.09.13-r222',
              'cacheKey': '20260913-r222'
          }, indent=2) + '\n')
          PY
          node turn/scripts/release.mjs --write
          node turn/scripts/release.mjs --check
          node turn-tests/low-graphics-production.mjs
          node turn-tests/release-production.mjs
          node turn-tests/about-history-production.mjs
          node turn-lab/tests/mountain-long-lab.mjs
      - name: Commit r222
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turn turn-next turn-lab yourturn turn-tests
          git commit -m "Tune LOW GRAPHICS visuals; release TURN 1.19.8 r222"
          git push origin HEAD:fix/turn-low-graphics-aa-scenery-r222

name: TEMP TURN support feedback release sync

on:
  push:
    branches:
      - 'sol/support-challenge-feedback'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: sol/support-challenge-feedback
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate and verify release
        run: |
          node turn/scripts/temp-support-feedback-release-sync.mjs
          node turn/scripts/release.mjs --write
          node turn/scripts/release.mjs --check
          node turn-tests/support-challenges-production.mjs
          node turn-tests/release-production.mjs
          node turn-tests/release-composition-production.mjs --base origin/main
          git diff --check

      - name: Commit release surfaces
        run: |
          git config user.name "enkeldesign"
          git config user.email "75029856+enkeldesign@users.noreply.github.com"
          git add turn/index.html turn-lab/index.html turn-next/index.html turn-next/app.js yourturn/index.html turn/ui/about-history-bootstrap-r165.js turn/content/about-history-current.js turn/design.html turn/design-dialogs.html turn/tracks/registry.js turn/tracks/mountain-world-long.js turn/tracks/midnight-city-world-r2.js turn/tracks/midnight-city-world-r3.js turn/tracks/midnight-city-world-r4.js turn/tracks/midnight-city-world-r5.js turn/tracks/midnight-city-world-r6.js turn/tracks/midnight-city-world-r7.js turn/tracks/midnight-city-world-r11.js
          if git diff --cached --quiet; then
            echo "Release surfaces already synchronized."
            exit 0
          fi
          git commit -m "Release TURN 1.20.1 r233"
          git push origin HEAD:sol/support-challenge-feedback

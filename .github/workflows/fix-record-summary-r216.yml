name: Fix TURN record summary identity r216

on:
  push:
    branches:
      - fix/record-summary-module-identity-r216

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/record-summary-module-identity-r216
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fix live record state and prepare TURN 1.19.2
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          release_script = Path('turn/scripts/release.mjs')
          source = release_script.read_text()

          anchor = "const SESSION_ORCHESTRATOR_SPECIFIER = '/turn/race/session-orchestrator.js?source=20260729-r118-m8';"
          replacement = anchor + "\nconst RIVAL_STORAGE_PATH = '/turn/race/rival-storage.js';\nconst RIVAL_STORAGE_REVISION = 'r224-finish-line-summary';"
          if "const RIVAL_STORAGE_PATH = '/turn/race/rival-storage.js';" not in source:
              if anchor not in source:
                  raise SystemExit('release.mjs session orchestrator anchor not found')
              source = source.replace(anchor, replacement, 1)

          function_anchor = "function synchronizeRuntimeReleaseBoundSpecifiers(importMap, release) {"
          rival_function = """function synchronizeRivalStorageTargets(importMap, release) {
            const canonicalTarget = `${RIVAL_STORAGE_PATH}?build=${release.cacheKey}&revision=${RIVAL_STORAGE_REVISION}`;
            for (const [specifier, target] of Object.entries(importMap.imports || {})) {
              if (typeof target !== 'string') continue;
              const targetUrl = new URL(target, 'https://enkel.design/turn/');
              if (targetUrl.pathname !== RIVAL_STORAGE_PATH) continue;
              importMap.imports[specifier] = canonicalTarget;
            }
          }

          """
          if 'function synchronizeRivalStorageTargets(importMap, release)' not in source:
              if function_anchor not in source:
                  raise SystemExit('release.mjs synchronization anchor not found')
              source = source.replace(function_anchor, rival_function + function_anchor, 1)

          call_anchor = "  synchronizeLotEnhancementSpecifiers(importMap, release);\n  synchronizeReleaseBoundImportTarget(importMap, release, SESSION_ORCHESTRATOR_SPECIFIER);"
          call_replacement = "  synchronizeLotEnhancementSpecifiers(importMap, release);\n  synchronizeRivalStorageTargets(importMap, release);\n  synchronizeReleaseBoundImportTarget(importMap, release, SESSION_ORCHESTRATOR_SPECIFIER);"
          if '  synchronizeRivalStorageTargets(importMap, release);' not in source:
              if call_anchor not in source:
                  raise SystemExit('release.mjs runtime synchronization call anchor not found')
              source = source.replace(call_anchor, call_replacement, 1)
          release_script.write_text(source)

          composition_test = Path('turn-tests/release-composition-production.mjs')
          test = composition_test.read_text()
          helper_anchor = 'export function assertNoUnchangedActiveIdentities(changedPaths, baseGraph, headGraph) {'
          helper = """function assertSingleActiveIdentity(graph, repositoryPath, label) {
            const identities = [...(graph.identities.get(repositoryPath) || [])];
            assert.equal(
              identities.length,
              1,
              `${label} must resolve ${repositoryPath} through one active URL identity; got ${identities.join(', ') || 'none'}`
            );
          }

          """
          if 'function assertSingleActiveIdentity(graph, repositoryPath, label)' not in test:
              if helper_anchor not in test:
                  raise SystemExit('release composition helper anchor not found')
              test = test.replace(helper_anchor, helper + helper_anchor, 1)

          assertion_anchor = "for (const repositoryPath of requiredActiveModules) {\n  assert.ok(headGraph.identities.has(repositoryPath), `${repositoryPath} must remain represented in the production module graph`);\n}\n"
          assertion = assertion_anchor + "\nassertSingleActiveIdentity(\n  headGraph,\n  'turn/race/rival-storage.js',\n  'Production TURN rival storage'\n);\n"
          if "'Production TURN rival storage'" not in test:
              if assertion_anchor not in test:
                  raise SystemExit('release composition active-module anchor not found')
              test = test.replace(assertion_anchor, assertion, 1)
          composition_test.write_text(test)

          release = {
              'version': '1.19.2',
              'id': '2026.09.12-r216',
              'cacheKey': '20260912-r216'
          }
          Path('turn/release.json').write_text(json.dumps(release, indent=2) + '\n')

          history = Path('turn/content/about-history.js')
          text = history.read_text()
          history_title = 'Fresh records become one live state'
          if history_title not in text:
              history_entry = """
            {
              period: '12 September',
              title: 'Fresh records become one live state',
              paragraphs: [
                'TURN 1.19.2 fixes a release-composition regression that could load rival storage under two different browser module URLs after a build bump. The racing runtime could therefore know about a freshly completed personal best — and enable YOUR TURN sharing — while Home still read an older in-memory summary and showed NO TIME YET until the app was restarted.',
                'Release generation now routes every rival-storage import-map alias to one canonical current-build URL. A release-composition guard also requires the stateful rival-storage module to have exactly one active runtime identity, keeping deferred persistence, record summaries and sharing on the same live state.'
              ],
              milestones: [
                'Fresh personal bests appear in Home immediately after the lap',
                'SHARE and BEST use the same live rival state',
                'TURN 1.19.2 · 2026.09.12-r216'
              ]
            }"""
              marker = "\n]);\n\nexport const CHANGELOG = Object.freeze(["
              if marker not in text:
                  raise SystemExit('DEVELOPMENT_HISTORY closing marker not found')
              text = text.replace(marker, ',' + history_entry + marker, 1)

          if "['1.19.2 r216'" not in text:
              changelog_entry = """
            {
              date: '12 September',
              entries: [
                ['1.19.2 r216', 'Fixes a freshly set personal best showing NO TIME YET in Home until restart even though SHARE was already available.'],
                ['Rival state identity', 'All production rival-storage aliases now resolve to one current-build ES-module identity so deferred saves and Home record summaries share the same in-memory cache.'],
                ['Release guard', 'Release composition now fails if rival storage becomes split across multiple active runtime URLs again.']
              ]
            }"""
              marker = "\n]);\n\nexport const CURRENT_RELEASE = Object.freeze({"
              if marker not in text:
                  raise SystemExit('CHANGELOG closing marker not found')
              text = text.replace(marker, ',' + changelog_entry + marker, 1)

          text = re.sub(
              r"export const CURRENT_RELEASE = Object\.freeze\(\{[\s\S]*?\}\);",
              """export const CURRENT_RELEASE = Object.freeze({
            version: '1.19.2',
            build: '2026.09.12-r216',
            note: 'TURN 1.19.2 keeps freshly completed personal bests and YOUR TURN sharing in sync immediately after a lap.'
          });""",
              text,
              count=1
          )
          history.write_text(text)

          bootstrap = Path('turn/ui/about-history-bootstrap-r165.js')
          bootstrap_text = bootstrap.read_text()
          bootstrap_text = re.sub(r"about-history\.js\?build=\d{8}-r\d+", 'about-history.js?build=20260912-r216', bootstrap_text)
          bootstrap.write_text(bootstrap_text)

          for filename in ['turn/design.html', 'turn/design-dialogs.html']:
              path = Path(filename)
              value = path.read_text()
              value = re.sub(r'TURN 1\.19\.1', 'TURN 1.19.2', value)
              value = re.sub(r'Build 2026\.09\.11-r215', 'Build 2026.09.12-r216', value)
              path.write_text(value)

          yourturn = Path('yourturn/index.html')
          value = yourturn.read_text().replace('20260911-r215', '20260912-r216')
          yourturn.write_text(value)
          PY

          node turn/scripts/release.mjs --write
          node turn-next/scripts/build-parity-app.mjs
          node turn-next/scripts/build-parity-main.mjs
          node turn-next/scripts/build-parity-entry.mjs

      - name: Verify record-state fix and release composition
        run: |
          node turn/scripts/release.mjs --check
          node turn-next/scripts/build-parity-app.mjs --check
          node turn-next/scripts/build-parity-main.mjs --check
          node turn-next/scripts/build-parity-entry.mjs --check
          node turn-tests/release-production.mjs
          node turn-tests/about-history-production.mjs
          node turn-tests/release-composition-production.mjs --base 510e2d70f1294fd595c3f38d0ef22752414ed6c7
          node turn-tests/yourturn-turn-sharing-production.mjs
          node turn-lab/tests/start-finish-line-performance.mjs

      - name: Commit fix and remove helper
        run: |
          rm .github/workflows/fix-record-summary-r216.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turn turn-lab turn-next turn-tests yourturn .github/workflows/fix-record-summary-r216.yml
          git commit -m "Fix TURN fresh record summary state"
          git push origin HEAD:fix/record-summary-module-identity-r216

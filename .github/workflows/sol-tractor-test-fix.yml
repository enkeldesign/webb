name: Temporary fix Tractor semantic regression

on:
  push:
    branches:
      - sol/tractor-smv

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/tractor-smv

      - name: Teach semantic regression about embedded Tractor palette
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'turn-lab/tests/semantic-car-finish-production.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const before = `  assert.deepEqual(
            (json.images || []).map((image) => image.uri),
            ['Textures/colormap.png'],
            \`\${car.name} must retain its authored palette reference\`
          );`;
          const after = `  const authoredImages = json.images || [];
          if (car.id === 'tractor') {
            assert.equal(authoredImages.length, 1, 'Tractor must preserve its one authored embedded palette image');
            assert.equal(authoredImages[0].mimeType, 'image/png', 'Tractor embedded palette must remain PNG');
            assert.ok(Number.isInteger(authoredImages[0].bufferView),
              'Tractor must retain the source GLB embedded palette instead of inventing an external texture dependency');
          } else {
            assert.deepEqual(
              authoredImages.map((image) => image.uri),
              ['Textures/colormap.png'],
              \`\${car.name} must retain its authored palette reference\`
            );
          }`;
          if (!source.includes(before)) throw new Error('Semantic palette assertion anchor not found');
          source = source.replace(before, after);
          fs.writeFileSync(path, source);
          NODE

      - name: Commit regression fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add turn-lab/tests/semantic-car-finish-production.mjs
          git commit -m 'Cover Tractor embedded palette in semantic regression'
          git push origin HEAD:sol/tractor-smv

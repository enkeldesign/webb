name: Temporary DBE pace-note retiming

on:
  push:
    branches:
      - sol/dbe-pace-notes-r250

permissions:
  contents: write

jobs:
  retime:
    if: ${{ github.event.head_commit.message == 'Apply DBE pace-note retiming' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: sol/dbe-pace-notes-r250
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply pace-note retiming
        run: |
          node turn/scripts/temporary-dbe-pace-r250.mjs
          node turn/scripts/release.mjs --write

      - name: Verify focused DBE and release checks
        run: |
          node --check turn/training/stages.js
          node turn-tests/drive-by-ear-training-production.mjs
          node turn-tests/about-history-production.mjs
          node turn-tests/release-production.mjs
          node turn-tests/release-composition-production.mjs --base c479e4894fdad6341888a407ad0a7e61e75a8c48
          node turn/scripts/release.mjs --check
          git diff --check

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "TURN: retime DBE 101 pace notes for slow-moving vehicle"
          git push origin HEAD:sol/dbe-pace-notes-r250

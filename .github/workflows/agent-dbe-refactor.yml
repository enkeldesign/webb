name: Apply guarded DBE refactor

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
  push:
    branches:
      - 'agent/dbe-performance-r97'
    paths:
      - 'scripts/agent-dbe-refactor.py'
      - '.github/workflows/agent-dbe-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    if: github.head_ref == 'agent/dbe-performance-r97' || github.ref_name == 'agent/dbe-performance-r97'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply guarded source edits
        run: python scripts/agent-dbe-refactor.py

      - name: Syntax-check changed modules
        run: |
          node --check turn/app.js
          node --check turn/audio/audio-system.js
          node --check turn/audio/pace-notes.js
          node --check turn/ui/drive-by-ear-setting.js
          node --check turn/ui/in-game-menu.js
          node --check turn-lab/tests/pace-notes-production.mjs
          node --check turn-lab/tests/drive-by-ear-production.mjs

      - name: Lint changed modules
        run: npx --yes eslint@9.39.1 turn/app.js turn/audio/audio-system.js turn/audio/pace-notes.js turn/ui/drive-by-ear-setting.js turn/ui/in-game-menu.js turn-lab/tests/pace-notes-production.mjs turn-lab/tests/drive-by-ear-production.mjs

      - name: Verify release identity
        run: node turn/scripts/release.mjs --check

      - name: Run focused audio and DBE regressions
        run: |
          node turn-lab/tests/audio-foundation-production.mjs
          node turn-lab/tests/driving-soundscape-production.mjs
          node turn-lab/tests/pace-notes-production.mjs
          node turn-lab/tests/drive-by-ear-production.mjs
          node turn-lab/tests/in-game-menu-production.mjs
          node turn-lab/tests/performance-production.mjs
          node turn-tests/release-production.mjs

      - name: Commit refactor
        run: |
          git config user.name 'TURN automation'
          git config user.email 'actions@users.noreply.github.com'
          git add turn turn-lab
          git diff --cached --check
          git commit -m 'TURN v1.17.0: optimize Drive By Ear audio'
          git push origin HEAD:agent/dbe-performance-r97

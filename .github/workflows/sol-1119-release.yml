name: SOL temporary #1119 release validation

on:
  push:
    branches:
      - sol/1119-accessibility-about
    paths:
      - 'turn/release.json'
      - '.github/workflows/sol-1119-release.yml'

permissions:
  contents: write

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate release graph
        run: node turn/scripts/release.mjs --write

      - name: Run focused regressions
        run: |
          node turn-tests/home-feedback-production.mjs
          node turn-tests/about-history-production.mjs

      - name: Verify release and lint
        run: |
          node turn/scripts/release.mjs --check
          node turn-tests/release-composition-production.mjs --base origin/main
          npx --yes eslint@9.39.1 turn turn-tests
          git diff --check

      - name: Commit generated release graph
        run: |
          if git diff --quiet; then
            echo "Release graph already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "TURN 1.50.3 r485: generate release graph (#1119)" -m "Co-authored-by: SOL <solavatar@openai.com>"
          git push origin HEAD:sol/1119-accessibility-about

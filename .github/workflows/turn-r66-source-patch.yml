name: TURN r66 source patch

on:
  push:
    branches:
      - agent/turn-r66-skid-ring-buffer
    paths:
      - 'turn/scripts/apply-r66-skid-ring.mjs'
      - '.github/workflows/turn-r66-source-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/turn-r66-skid-ring-buffer

      - name: Apply verified main.js patch
        run: node turn/scripts/apply-r66-skid-ring.mjs

      - name: Commit patched production core
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turn/main.js
          git commit -m "Use a fixed skid history ring buffer"
          git push

name: TURN r230 HEAD START icon updater

on:
  push:
    branches:
      - feat/head-start-authored-icon-r230

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/head-start-authored-icon-r230
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply authored HEAD START icon and release bump
        run: python3 .github/turn-r230-head-start-icon.py

      - name: Synchronize release surfaces
        run: node turn/scripts/release.mjs --write

      - name: Validate achievement icon and release
        run: |
          node turn/scripts/release.mjs --check
          node turn-lab/tests/achievements-production.mjs
          node turn-tests/release-composition-production.mjs --base=0a225b200e1e4703fabd37282cb5b392748f33c3
          git diff --check

      - name: Commit generated production change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turn turn-next turn-lab yourturn turn-tests
          git commit -m "Give HEAD START an authored flying-start icon"
          git push origin HEAD:feat/head-start-authored-icon-r230

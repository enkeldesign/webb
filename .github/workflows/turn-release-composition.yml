name: TURN release composition

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      # This graph check is cheap and intentionally owns broad release inputs.
      - 'turn/**/*.css'
      - 'turn/**/*.html'
      - 'turn/**/*.js'
      - 'turn/**/*.mjs'
      - 'turn/release.json'
      - 'turn/site.webmanifest'
      - 'turn-lab/index.html'
      - 'turn-next/index.html'
      - 'turn-next/app.js'
      - 'turn-next/main.js'
      - 'turn-next/scripts/**'
      - 'yourturn/index.html'
      - 'turn-tests/release-*.mjs'
      - '.github/workflows/turn-release-composition.yml'
  push:
    branches:
      - main
    paths:
      # Keep the deployed graph checked after every matching merge.
      - 'turn/**/*.css'
      - 'turn/**/*.html'
      - 'turn/**/*.js'
      - 'turn/**/*.mjs'
      - 'turn/release.json'
      - 'turn/site.webmanifest'
      - 'turn-lab/index.html'
      - 'turn-next/index.html'
      - 'turn-next/app.js'
      - 'turn-next/main.js'
      - 'turn-next/scripts/**'
      - 'yourturn/index.html'
      - 'turn-tests/release-*.mjs'
      - '.github/workflows/turn-release-composition.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  composition:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate support-feedback patch release
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'sol/support-challenge-feedback'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'turn/content/about-history-current.js';
          let source = fs.readFileSync(path, 'utf8');
          if (!source.includes('SUPPORT_CHALLENGE_FEEDBACK_HISTORY')) {
            const history = `const SUPPORT_CHALLENGE_FEEDBACK_HISTORY = Object.freeze({
  period: '14 September',
  title: 'Support challenges hand off cleanly',
  paragraphs: Object.freeze([
    'TURN 1.20.1 makes START CHALLENGE carry both parts of the recommendation into play: it selects the challenge track and preselects the recommended owned car in The Lot.',
    'Challenge completion now uses the compact pill cue in-race and replays it on CHOOSE TRACK while the trophy notification pulses away. When the same lap also unlocks an achievement and Trophy Road reward, challenge and achievement feedback share the first beat and the reward waits for the next one.'
  ]),
  milestones: Object.freeze([
    'Recommended challenge car preselected in The Lot',
    'Compact challenge pill and ordered challenge, achievement and reward feedback',
    'TURN 1.20.1 · 2026.09.14-r233'
  ])
});

`;
            source = source.replace('const previousLatest = BASE_CHANGELOG.at(-1);', `${history}const previousLatest = BASE_CHANGELOG.at(-1);`);
            source = source.replace(
              '  OVERCHARGED_BOOST_HISTORY,\n  SUPPORT_CHALLENGE_HISTORY\n]);',
              '  OVERCHARGED_BOOST_HISTORY,\n  SUPPORT_CHALLENGE_HISTORY,\n  SUPPORT_CHALLENGE_FEEDBACK_HISTORY\n]);'
            );
            source = source.replace(
              "      Object.freeze(['Progress without guesswork', 'Recommends an owned car, explains that a clean lap stays on-road from start to finish, awards 5 trophies for each previously unread HOW TO PLAY part, and offers a reroll after continued attempts.'])",
              "      Object.freeze(['Progress without guesswork', 'Recommends an owned car, explains that a clean lap stays on-road from start to finish, awards 5 trophies for each previously unread HOW TO PLAY part, and offers a reroll after continued attempts.']),\n      Object.freeze(['1.20.1 r233', 'Makes START CHALLENGE preselect both the recommended track and owned car, and replaces the large challenge completion block with the compact pill cue.']),\n      Object.freeze(['Ordered support feedback', 'Shows challenge and same-lap achievement feedback together, then gives Trophy Road rewards their own turn; CHOOSE TRACK replays the challenge cue while its trophy notification pulses away.'])"
            );
            source = source.replace(
              "  note: 'TURN 1.20.0 adds adaptive Trophy Road support challenges for stalled progress.'",
              "  note: 'TURN 1.20.1 polishes support challenge routing and completion feedback.'"
            );
            fs.writeFileSync(path, source);
          }
          NODE
          node turn/scripts/release.mjs --write
          node turn/scripts/release.mjs --check
          node turn-tests/support-challenges-production.mjs
          git diff --check

          git config user.name "enkeldesign"
          git config user.email "75029856+enkeldesign@users.noreply.github.com"
          git add \
            turn/index.html \
            turn-lab/index.html \
            turn-next/index.html \
            turn-next/app.js \
            yourturn/index.html \
            turn/ui/about-history-bootstrap-r165.js \
            turn/content/about-history-current.js \
            turn/design.html \
            turn/design-dialogs.html \
            turn/tracks/registry.js \
            turn/tracks/mountain-world-long.js \
            turn/tracks/midnight-city-world-r2.js \
            turn/tracks/midnight-city-world-r3.js \
            turn/tracks/midnight-city-world-r4.js \
            turn/tracks/midnight-city-world-r5.js \
            turn/tracks/midnight-city-world-r6.js \
            turn/tracks/midnight-city-world-r7.js \
            turn/tracks/midnight-city-world-r11.js
          if ! git diff --cached --quiet; then
            git commit -m "Release TURN 1.20.1 r233"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Verify release source of truth
        run: node turn/scripts/release.mjs --check

      - name: Verify release entrypoint contract
        run: node turn-tests/release-production.mjs

      - name: Verify active release composition
        env:
          TURN_COMPOSITION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node turn-tests/release-composition-production.mjs --base "$TURN_COMPOSITION_BASE"

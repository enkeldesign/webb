name: TURN r65 source patch

on:
  push:
    branches:
      - agent/turn-r65-rival-visual-sync
    paths:
      - 'turn/scripts/apply-r65-rival-sync.mjs'
      - '.github/workflows/turn-r65-source-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/turn-r65-rival-visual-sync

      - name: Apply verified main.js patch
        run: node turn/scripts/apply-r65-rival-sync.mjs

      - name: Commit patched production core
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turn/main.js
          git commit -m "Make rival visual sync event-driven"
          git push

name: TURN r225 MOUNTAIN warning location

on:
  push:
    branches:
      - fix/mountain-warning-landmark-r225

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/mountain-warning-landmark-r225
          fetch-depth: 0

      - name: Move warning landmark and bump release
        run: python3 .github/turn-r225-warning-location.py

      - name: Synchronize release surfaces
        run: node turn/scripts/release.mjs --write

      - name: Validate placement and release integrity
        run: |
          node turn/scripts/release.mjs --check
          node turn-tests/mountain-track-production.mjs
          node turn-lab/tests/mountain-long-lab.mjs
          node turn-tests/release-composition-production.mjs --base=bd56be1d7454b1cd51634da50bbb68b40d51611b
          git diff --check

      - name: Commit warning-location correction
        run: |
          git config user.name "enkeldesign"
          git config user.email "75029856+enkeldesign@users.noreply.github.com"
          git add turn turn-next turn-lab yourturn turn-tests
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Move MOUNTAIN warning landmark to summit sightline"
          git push origin HEAD:fix/mountain-warning-landmark-r225

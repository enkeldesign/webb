name: TURN Mountain Sprint sync

on:
  push:
    branches:
      - fix/mountain-sprint-achievement
    paths:
      - '.github/workflows/turn-mountain-sprint-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mountain-sprint-achievement
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Add Mountain Sprint and update master target set
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              s = p.read_text()
              actual = s.count(old)
              if actual == 0:
                  raise SystemExit(f'Missing expected text in {path}: {old!r}')
              if count is not None and actual != count:
                  raise SystemExit(f'Expected {count} matches in {path}, found {actual}: {old!r}')
              p.write_text(s.replace(old, new))

          # Canonical developer time trials: add MOUNTAIN as the sixth target.
          replace(
              'turn/achievements/time-trials.js',
              "  Object.freeze({\n    id: 'midnight-sprint',\n    trackId: 'midnight-city',\n    targetSeconds: 53,\n    title: 'MIDNIGHT SPRINT',\n    description: 'Finish Midnight City in under 53 seconds.'\n  })\n]);",
              "  Object.freeze({\n    id: 'midnight-sprint',\n    trackId: 'midnight-city',\n    targetSeconds: 53,\n    title: 'MIDNIGHT SPRINT',\n    description: 'Finish Midnight City in under 53 seconds.'\n  }),\n  Object.freeze({\n    id: 'mountain-sprint',\n    trackId: 'mountain',\n    targetSeconds: 27,\n    title: 'MOUNTAIN SPRINT',\n    description: 'Finish Mountain in under 27 seconds.'\n  })\n]);",
              1
          )

          # Fresh module URLs for all code paths that consume the trial set.
          replace('turn/achievements/catalog.js', "./time-trials.js?revision=r166-bella-records", "./time-trials.js?revision=r174-mountain-sprint", 1)
          replace('turn/achievements/runtime.js', "./time-trials.js?revision=r166-bella-records", "./time-trials.js?revision=r174-mountain-sprint", 1)
          replace('turn/achievements/runtime.js', "./view.js?revision=r166-bella-records", "./view.js?revision=r174-mountain-sprint", 1)
          replace('turn/achievements/view.js', "./time-trials.js?revision=r166-bella-records", "./time-trials.js?revision=r174-mountain-sprint", 1)
          replace('turn/achievements.js', "./achievements/time-trials.js?revision=r166-bella-records", "./achievements/time-trials.js?revision=r174-mountain-sprint", 1)
          replace('turn/achievements/catalog-chromatic-r183.js', "./catalog.js?revision=r166-chromatic-base", "./catalog.js?revision=r174-mountain-sprint-base", 2)

          # Trophy totals: +25 for MOUNTAIN SPRINT.
          replace('turn/progression/trophy-road.js', 'TROPHY_ROAD_MAX_THRESHOLD = 1700', 'TROPHY_ROAD_MAX_THRESHOLD = 1725', 1)
          replace('turn/progression/trophy-road-perks-r164.js', 'TROPHY_ROAD_MAX_THRESHOLD = 1850', 'TROPHY_ROAD_MAX_THRESHOLD = 1875', 1)
          replace('turn/progression/trophy-road-chromatic-r183.js', 'TROPHY_ROAD_MAX_THRESHOLD = 1850', 'TROPHY_ROAD_MAX_THRESHOLD = 1875', 1)

          # Production cache routing: force the new achievement/runtime and trophy scale immediately.
          replace(
              'turn/index.html',
              '"/turn/achievements/catalog.js?revision=r166-bella-records": "/turn/achievements/catalog-chromatic-r183.js?revision=r183-production"',
              '"/turn/achievements/catalog.js?revision=r166-bella-records": "/turn/achievements/catalog-chromatic-r183.js?revision=r174-mountain-sprint"',
              1
          )
          replace(
              'turn/index.html',
              '"./achievements/runtime.js?revision=r164-long-session-robustness": "./achievements/runtime.js?revision=r195-unranked-super-sedan&build=20260817-r173"',
              '"./achievements/runtime.js?revision=r164-long-session-robustness": "./achievements/runtime.js?revision=r174-mountain-sprint&build=20260817-r173"',
              1
          )
          replace(
              'turn/index.html',
              '"/turn/progression/trophy-road.js?revision=r166-bella-records": "/turn/progression/trophy-road-chromatic-r183.js?revision=r183-post-soak"',
              '"/turn/progression/trophy-road.js?revision=r166-bella-records": "/turn/progression/trophy-road-chromatic-r183.js?revision=r174-mountain-sprint"',
              1
          )

          # Base achievement regression now has six developer trials and 1,725 trophies.
          p = Path('turn-lab/tests/achievements-production.mjs')
          s = p.read_text()
          s = s.replace('ACHIEVEMENTS.length, 28', 'ACHIEVEMENTS.length, 29', 1)
          s = s.replace('TURN should ship twenty-eight achievements including four hidden discoveries', 'TURN should ship twenty-nine achievements including MOUNTAIN SPRINT and four hidden discoveries', 1)
          s = s.replace('assert.equal(totalAvailableTrophies(), 1700);', 'assert.equal(totalAvailableTrophies(), 1725);', 1)
          s = s.replace('  1700\n);', '  1725\n);', 1)
          s = s.replace('assert.equal(TIME_TRIALS.length, 5);', 'assert.equal(TIME_TRIALS.length, 6);', 1)
          s = s.replace('assert.equal(TIME_TRIAL_ACHIEVEMENT_IDS.length, 5);', 'assert.equal(TIME_TRIAL_ACHIEVEMENT_IDS.length, 6);', 1)
          s = s.replace("    ['midnight-city', 53]\n  ]", "    ['midnight-city', 53],\n    ['mountain', 27]\n  ]", 1)
          s = s.replace("assert.equal(TIME_TRIAL_MASTER_ID, 'faster-than-the-dev');", "assert.equal(TIME_TRIAL_MASTER_ID, 'faster-than-the-dev');\nassert.equal(byId('faster-than-the-dev')?.progressMax, 6,\n  'FASTER THAN THE DEV must require all six developer targets');", 1)
          s = s.replace("assert.equal(completedAllTimeTrials((id) => id !== 'harbor-sprint'), false);", "assert.equal(completedAllTimeTrials((id) => id !== 'harbor-sprint'), false);\nassert.equal(completedAllTimeTrials((id) => id !== 'mountain-sprint'), false,\n  'FASTER THAN THE DEV must remain locked until MOUNTAIN SPRINT is complete');", 1)
          s = s.replace('assert.match(timeTrialSource, /targetSeconds: 53/);', 'assert.match(timeTrialSource, /targetSeconds: 53/);\nassert.match(timeTrialSource, /targetSeconds: 27/);', 1)
          p.write_text(s)

          # Production catalogue adds the sixth sprint on top of MAYDAY + Chromatic.
          p = Path('turn-lab/tests/chromatic-camouflage-production.mjs')
          s = p.read_text()
          s = s.replace('ACHIEVEMENTS.length, 30', 'ACHIEVEMENTS.length, 31', 1)
          s = s.replace('existing 28 achievements plus MAYDAY and Chromatic Camouflage', 'existing 29 achievements plus MAYDAY and Chromatic Camouflage', 1)
          s = s.replace('1850', '1875')
          s = s.replace('1,850', '1,875')
          p.write_text(s)

          # Base/prod Trophy Road maxima follow the actual available trophy totals.
          p = Path('turn-lab/tests/trophy-road-production.mjs')
          s = p.read_text()
          s = s.replace('1700', '1725')
          s = s.replace('1850', '1875')
          s = s.replace('1,850', '1,875')
          p.write_text(s)
          PY

      - name: Run focused achievement regressions
        run: |
          node --check turn/achievements/time-trials.js
          node --check turn/achievements/runtime.js
          node --check turn/achievements/view.js
          node turn-lab/tests/achievements-production.mjs
          node turn-lab/tests/chromatic-camouflage-production.mjs
          node turn-lab/tests/trophy-road-production.mjs

      - name: Commit Mountain Sprint update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add turn/achievements/time-trials.js turn/achievements/catalog.js turn/achievements/runtime.js turn/achievements/view.js turn/achievements.js turn/achievements/catalog-chromatic-r183.js turn/progression/trophy-road.js turn/progression/trophy-road-perks-r164.js turn/progression/trophy-road-chromatic-r183.js turn/index.html turn-lab/tests/achievements-production.mjs turn-lab/tests/chromatic-camouflage-production.mjs turn-lab/tests/trophy-road-production.mjs
          git diff --cached --quiet || git commit -m 'Add Mountain Sprint developer target'
          git push origin HEAD:fix/mountain-sprint-achievement

name: TURN r73 viewport patch

on:
  push:
    branches:
      - agent/turn-r73-remove-ios-bottom-strip
    paths:
      - 'turn/scripts/patch-r73-viewport-coverage.mjs'
      - '.github/workflows/turn-r73-viewport-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/turn-r73-remove-ios-bottom-strip
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply verified patch
        run: node turn/scripts/patch-r73-viewport-coverage.mjs
      - name: Commit patched runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turn/main.js turn/styles.css
          git diff --cached --quiet && exit 0
          git commit -m "TURN r73: cover the full iOS viewport after rotation"
          git push origin HEAD:agent/turn-r73-remove-ios-bottom-strip

name: TURN HEAD START r228 updater

on:
  push:
    branches:
      - feature/head-start-achievement-r228

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/head-start-achievement-r228
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply HEAD START achievement
        run: python3 .github/turn-head-start-r228.py

      - name: Synchronize release surfaces
        run: node turn/scripts/release.mjs --write

      - name: Validate focused progression and release contracts
        run: |
          node turn/scripts/release.mjs --check
          node turn-tests/release-production.mjs
          node turn-tests/release-composition-production.mjs --base=24c34c24c799007e14debbd9bc6d8b3bd89d78ef
          node turn-tests/achievement-polling-production.mjs
          node turn-lab/tests/achievements-production.mjs
          node turn-lab/tests/chromatic-camouflage-production.mjs
          node turn-lab/tests/trophy-road-production.mjs
          git diff --check

      - name: Commit HEAD START release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turn turn-next turn-lab yourturn turn-tests
          git commit -m "Add HEAD START achievement"
          git push origin HEAD:feature/head-start-achievement-r228

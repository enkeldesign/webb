name: TURN r185 canonical release sync

on:
  push:
    branches:
      - track-difficulty-release-r185

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: track-difficulty-release-r185
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate canonical release surfaces
        run: node turn/scripts/release.mjs --write
      - name: Verify release and installed-PWA compatibility
        run: |
          node turn/scripts/release.mjs --check
          node turn-lab/tests/paint-lock-observer-production.mjs
          node turn-lab/tests/mountain-long-lab.mjs
      - name: Remove helper and publish generated release
        run: |
          rm -f .github/workflows/turn-r185-canonical-release-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Synchronize canonical TURN 1.12.0 release surfaces'
          git push origin HEAD:track-difficulty-release-r185

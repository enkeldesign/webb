name: TEMP TURN support feedback lifecycle

on:
  push:
    branches:
      - 'sol/support-feedback-lifecycle'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: sol/support-feedback-lifecycle
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prepare and generate TURN 1.20.2
        run: |
          node turn/scripts/temp-support-feedback-lifecycle.mjs
          node turn/scripts/release.mjs --write
          node turn/scripts/release.mjs --check

      - name: Verify focused and release contracts
        run: |
          node --check turn/achievements/support-challenge-feedback.js
          node --check turn/achievements/home-reward-replay-r225.js
          node --check turn/achievements/runtime.js
          node --check turn/achievements/view.js
          node --check turn/m8-home.js
          node turn-tests/support-challenges-production.mjs
          node turn-tests/home-navigation-production.mjs
          node turn-lab/tests/stat-legend-production.mjs
          node turn-tests/release-production.mjs
          node turn-tests/release-composition-production.mjs --base origin/main
          git diff --check

      - name: Install browser smoke dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium webkit

      - name: Start static TURN server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/turn-support-feedback-http.log 2>&1 &
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8000/ >/dev/null && exit 0
            sleep 0.5
          done
          cat /tmp/turn-support-feedback-http.log
          exit 1

      - name: Verify support feedback in Chromium and WebKit
        run: node turn-tests/support-feedback-browser-smoke.mjs

      - name: Commit generated release surfaces
        shell: bash
        run: |
          git config user.name "enkeldesign"
          git config user.email "75029856+enkeldesign@users.noreply.github.com"
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/turn-support-feedback-lifecycle-temp.yml|turn/scripts/temp-support-feedback-lifecycle.mjs)
                ;;
              *)
                git add -- "$file"
                ;;
            esac
          done < <(git diff --name-only)
          if git diff --cached --quiet; then
            echo "Release surfaces already synchronized."
            exit 0
          fi
          git commit -m "Release TURN 1.20.2 r234"
          git push origin HEAD:sol/support-feedback-lifecycle

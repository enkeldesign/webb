name: TEMP TURN support feedback lifecycle

on:
  push:
    branches:
      - 'sol/support-feedback-lifecycle'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: sol/support-feedback-lifecycle
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply lifecycle refactor if needed
        run: |
          if grep -q "rewardPresentationHolds: new Set()" turn/achievements/runtime.js; then
            echo "Lifecycle refactor already committed."
          else
            node turn/scripts/temp-support-feedback-lifecycle.mjs
          fi

      - name: Verify focused contracts
        run: |
          node --check turn/achievements/support-challenge-feedback.js
          node --check turn/achievements/home-reward-replay-r225.js
          node --check turn/achievements/runtime.js
          node --check turn/achievements/view.js
          node --check turn/m8-home.js
          node turn-tests/support-challenges-production.mjs
          node turn-tests/home-navigation-production.mjs
          node turn-lab/tests/stat-legend-production.mjs
          git diff --check

      - name: Install browser smoke dependencies
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit

      - name: Start static TURN server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/turn-support-feedback-http.log 2>&1 &
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8000/ >/dev/null && exit 0
            sleep 0.5
          done
          cat /tmp/turn-support-feedback-http.log
          exit 1

      - name: Verify support feedback in browsers
        run: node turn-tests/support-feedback-browser-smoke.mjs

      - name: Commit verified refactor
        run: |
          git config user.name "enkeldesign"
          git config user.email "75029856+enkeldesign@users.noreply.github.com"
          git add \
            turn/achievements/runtime.js \
            turn/achievements/view.js \
            turn/m8-home.js \
            turn/achievements/support-challenges.js \
            turn-tests/support-challenges-production.mjs \
            turn-tests/home-navigation-production.mjs \
            turn-lab/tests/stat-legend-production.mjs
          if git diff --cached --quiet; then
            echo "No lifecycle changes to commit."
            exit 0
          fi
          git commit -m "Coordinate support feedback through explicit lifecycle"
          git push origin HEAD:sol/support-feedback-lifecycle

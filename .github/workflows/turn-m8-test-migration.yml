name: TURN M8 test migration

on:
  push:
    branches:
      - turn-next-m8-home-navigation
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out M8 branch
        uses: actions/checkout@v4
        with:
          ref: turn-next-m8-home-navigation
          fetch-depth: 0

      - name: Finish M8 permanent test contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          for filename in [
              'turn-tests/platform-production.mjs',
              'turn-tests/motion-safe-zone-production.mjs',
          ]:
              path = Path(filename)
              lines = path.read_text().splitlines(keepends=True)
              matches = [
                  index for index, line in enumerate(lines)
                  if 'Platform M5–M8' in line and 'Session Lifecycle' in line
              ]
              if len(matches) != 1:
                  raise SystemExit(f'{filename}: expected one M8 badge line, found {len(matches)}')
              index = matches[0]
              lines[index] = lines[index].replace('Session Lifecycle', 'Session \\+ Home')
              path.write_text(''.join(lines))

          session_path = Path('turn-tests/session-orchestrator-production.mjs')
          session_source = session_path.read_text()
          old = "console.log('TURN NEXT Platform M7 race-session orchestration passed.');"
          new = "console.log('TURN NEXT Platform M7–M8 race-session orchestration passed.');"
          if session_source.count(old) != 1:
              raise SystemExit('Session test must contain exactly one M7 completion message.')
          session_path.write_text(session_source.replace(old, new))
          PY

      - name: Commit migrated tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turn-tests/platform-production.mjs turn-tests/motion-safe-zone-production.mjs turn-tests/session-orchestrator-production.mjs
          git commit -m "Finish TURN NEXT M8 test contracts"
          git push origin HEAD:turn-next-m8-home-navigation

name: SOL temporary TURN r405 accessibility colour generator

on:
  push:
    branches:
      - sol/install-accessibility-colours-r405
    paths:
      - 'turn/scripts/sol-install-accessibility-colours-r405.mjs'
      - '.github/workflows/sol-install-accessibility-colours-r405.yml'

permissions:
  contents: write

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply focused colour fix
        run: node turn/scripts/sol-install-accessibility-colours-r405.mjs

      - name: Synchronize release surfaces
        run: |
          node turn/scripts/release.mjs --write
          node turn/scripts/release.mjs --check
          node turn-tests/about-history-production.mjs
          node turn-tests/release-composition-production.mjs --base origin/main

      - name: Install browser test runtime
        timeout-minutes: 12
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 three@0.184.0
          npx playwright install-deps chromium webkit
          timeout 180 npx playwright install chromium webkit \
            || timeout 180 npx playwright install chromium webkit

      - name: Verify responsive install page in Chromium and WebKit
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/turn-r405-http.log 2>&1 &
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8000/ >/dev/null && break
            sleep 0.5
          done
          timeout 240 node turn-tests/responsive-browser-smoke.mjs

      - name: Commit verified production change
        run: |
          git add -A
          git diff --cached --check
          git config user.name 'SOL'
          git config user.email 'solavatar@openai.com'
          git commit -m 'TURN 1.36.43 r405: restore install accessibility colours' -m 'Preserve the Wikimedia accessibility symbol original #154F91 in light mode and use TURN blue-300 in dark mode. Extend the static and Chromium/WebKit regressions and synchronize all release bindings.' -m 'Co-authored-by: SOL <solavatar@openai.com>' -m 'Co-authored-by: ASTRA <astraavatar@ai-assistant.local>'
          git push origin HEAD:sol/install-accessibility-colours-r405

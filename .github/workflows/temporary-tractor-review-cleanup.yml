name: Temporary Tractor review cleanup

on:
  push:
    branches:
      - sol/tractor-review-cleanup-r248

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: sol/tractor-review-cleanup-r248

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prepare cleanup and generated release surfaces
        run: node turn/scripts/temporary-tractor-review-cleanup.mjs

      - name: Verify focused Tractor and release contracts
        run: |
          node turn-tests/tractor-smv-production.mjs
          node turn-lab/tests/semantic-car-finish-production.mjs
          node turn-lab/tests/native-paint-production.mjs
          node turn-lab/tests/garage-production.mjs
          node turn-tests/m8-lot-selection-production.mjs
          node turn-tests/release-production.mjs
          node turn-tests/release-composition-production.mjs
          node turn/scripts/release.mjs --check
          git diff --check

      - name: Commit prepared cleanup
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore .github/workflows/turn-lab-tests.yml
          git add .
          git commit -m "TURN: complete Tractor review cleanup and publish r248"
          git push origin HEAD:sol/tractor-review-cleanup-r248

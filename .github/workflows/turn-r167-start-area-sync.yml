name: Regenerate TURN r167 start-area release entries

on:
  push:
    branches:
      - polish/signature-yellow-road-edges
    paths:
      - '.github/workflows/turn-r167-start-area-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: polish/signature-yellow-road-edges

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Regenerate release identities
        run: |
          node turn/scripts/release.mjs --write
          python3 - <<'PY'
          from pathlib import Path

          next_path = Path('turn-next/index.html')
          next_text = next_path.read_text()
          next_text = next_text.replace('2026.08.16-r166', '2026.08.16-r167')
          next_text = next_text.replace('20260816-r166', '20260816-r167')
          next_path.write_text(next_text)

          history_path = Path('turn/content/about-history.js')
          history_text = history_path.read_text()
          history_text = history_text.replace("build: '2026.08.16-r165'", "build: '2026.08.16-r167'")
          history_text = history_text.replace(
              "note: 'Adds generated racing music, real-device iOS/PWA resilience, refined YOUR TURN controls, Q/E desktop actions and the Monster Truck’s all-terrain perk.'",
              "note: 'Refines TURN’s road-edge colour, start-area identity and visual consistency while preserving racing behaviour.'"
          )
          history_path.write_text(history_text)
          PY
          node turn-next/scripts/build-parity-app.mjs --write
          node turn-next/scripts/build-parity-main.mjs --write

      - name: Verify generated release contracts
        run: |
          node turn/scripts/release.mjs --check
          node turn-next/scripts/build-parity-app.mjs --check
          node turn-next/scripts/build-parity-main.mjs --check
          node turn-next/scripts/build-parity-entry.mjs --check
          node turn-tests/release-production.mjs
          node turn-tests/about-history-production.mjs
          node turn-lab/tests/multi-track-production.mjs
          node --check turn/tracks/start-area-polish-r519.js

      - name: Commit generated files and remove temporary workflow
        run: |
          git rm .github/workflows/turn-r167-start-area-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Regenerate TURN r167 release entries'
          git push origin HEAD:polish/signature-yellow-road-edges

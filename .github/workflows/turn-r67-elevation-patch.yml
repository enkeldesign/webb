name: TURN r67 elevation patch

on:
  push:
    branches:
      - agent/turn-r67-elevation-foundation
    paths:
      - 'turn/scripts/patch-r67-elevation.mjs'
      - '.github/workflows/turn-r67-elevation-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/turn-r67-elevation-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply verified source patch
        run: node turn/scripts/patch-r67-elevation.mjs
      - name: Commit patched production files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turn/main.js turn/render/camera.js turn/vehicle/physics.js
          git diff --cached --quiet && exit 0
          git commit -m "TURN r67: make runtime elevation-aware"
          git push origin HEAD:agent/turn-r67-elevation-foundation

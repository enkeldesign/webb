name: TURN r223 render-only updater

on:
  push:
    branches:
      - fix/turn-low-graphics-render-only-r223

permissions:
  contents: write

concurrency:
  group: turn-r223-render-only-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/turn-low-graphics-render-only-r223
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply render-only LOW GRAPHICS profile
        run: |
          python3 .github/turn-r223-render-only.py
          python3 .github/turn-r223-test-harness.py

      - name: Generate r223 release surfaces and TURN NEXT parity
        run: |
          node turn/scripts/release.mjs --write
          node turn-next/scripts/build-parity-main.mjs
          node turn-next/scripts/build-parity-entry.mjs

      - name: Remove temporary updater
        run: rm .github/turn-r223-render-only.py .github/turn-r223-test-harness.py .github/workflows/turn-r223-render-only.yml

      - name: Validate focused production contracts
        run: |
          git diff --check
          node turn/scripts/release.mjs --check
          node turn-next/scripts/build-parity-main.mjs --check
          node turn-next/scripts/build-parity-entry.mjs --check
          node turn-tests/low-graphics-production.mjs
          node turn-tests/car-visual-lifecycle-production.mjs
          node turn-tests/car-visual-lifecycle-production.mjs --low-graphics
          node turn-tests/rival-visual-sync-production.mjs
          node turn-tests/release-production.mjs
          node turn-tests/release-composition-production.mjs --base=7706952fb8f3a0f9d6320fa487af70ec0adcf4f7

      - name: Commit generated r223 tree
        run: |
          git config user.name 'enkeldesign'
          git config user.email '75029856+enkeldesign@users.noreply.github.com'
          git add -A
          git commit -m 'Make LOW GRAPHICS rendering-only; release TURN 1.19.9 r223'
          git push origin HEAD:fix/turn-low-graphics-render-only-r223

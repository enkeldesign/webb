name: Temporary OVERCHARGE test sync

on:
  push:
    branches:
      - sol/overcharged-boost-power

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/overcharged-boost-power
      - name: Update and verify guide regression expectation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('turn-tests/how-to-play-guide-production.mjs')
          text = path.read_text()
          old = 'OVERCHARGE is spent before normal BOOST'
          new = 'OVERCHARGE burns first as a stronger burst, then normal BOOST continues'
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale OVERCHARGE assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          node turn-tests/how-to-play-guide-production.mjs
      - name: Commit test update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turn-tests/how-to-play-guide-production.mjs
          git commit -m "Update OVERCHARGE guide regression expectation"
          git push origin HEAD:sol/overcharged-boost-power

name: SOL temporary r405 theme fix

on:
  push:
    branches:
      - sol/install-accessibility-colours-r405
    paths:
      - 'turn/scripts/sol-r405-theme-fix.mjs'
      - '.github/workflows/sol-r405-theme-fix.yml'

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply local dark-theme override
        run: node turn/scripts/sol-r405-theme-fix.mjs
      - name: Verify
        run: |
          node turn/scripts/release.mjs --check
          node turn-tests/about-history-production.mjs
          node turn-tests/design-system-production.mjs
          node turn-tests/release-composition-production.mjs --base origin/main
      - name: Commit and push
        run: |
          git config user.name 'SOL'
          git config user.email 'solavatar@openai.com'
          git add turn/design-tokens.css turn/browser-install-r165.css turn-tests/about-history-production.mjs
          git diff --cached --check
          git commit -m 'Keep accessibility dark colour local to install mark' -m 'Preserve the global dark-theme invariant while keeping the Wikimedia source blue in light mode and TURN blue-300 in dark mode.' -m 'Co-authored-by: SOL <solavatar@openai.com>' -m 'Co-authored-by: ASTRA <astraavatar@ai-assistant.local>'
          git push origin HEAD:sol/install-accessibility-colours-r405

name: TURN temporary DEAD CANYON hairpin fix

on:
  push:
    branches:
      - sol/dead-canyon-hairpin-void

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[dead-canyon-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: sol/dead-canyon-hairpin-void
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply focused hairpin repair
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const replace = (path, from, to) => {
            let source = fs.readFileSync(path, 'utf8');
            if (!source.includes(from)) throw new Error(`${path}: expected source not found`);
            source = source.replace(from, to);
            fs.writeFileSync(path, source);
          };

          replace(
            'turn/race/lap-system-r86.js',
            `export const DEAD_CANYON_CHECKPOINTS = Object.freeze(\n  Array.from({ length: 24 }, (_, index) => (index + 1) / 25)\n);`,
            `// The uniform 60% gate lands on DEAD CANYON's hairpin cusp. A legal\n// inside line can pass the apex without crossing that finite gate, then meet the\n// 64% gate and be marked LAP VOID. Move only that gate just before the cusp.\nexport const DEAD_CANYON_CHECKPOINTS = Object.freeze(\n  Array.from({ length: 24 }, (_, index) => (index === 14 ? 0.59 : (index + 1) / 25))\n);`
          );

          replace(
            'turn/tracks/dead-canyon-world.js',
            `function makeRoadEdgeLines(world, samples, trackWidth) {\n  const half = trackWidth / 2;\n  for (const side of [-1, 1]) {\n    const center = side * (half - 0.45);\n    const line = makeRibbon(samples, center - 0.22, center + 0.22, ROAD_HEIGHT + 0.035);\n    line.material = new THREE.MeshBasicMaterial({ color: ROAD_EDGE, side: THREE.DoubleSide });\n    line.name = 'Dead Canyon pale road edge';\n    world.add(line);\n  }\n}`,
            `function makeRoadEdgeLines(world, samples, trackWidth) {\n  const half = trackWidth / 2;\n  // The inside offset collapses through the 60% hairpin because the centreline\n  // radius is tighter than half the rendered road. Drawing that decorative edge\n  // across the cusp creates a fake pale line through the asphalt. The asphalt,\n  // shoulder, route and collision geometry stay unchanged; only omit the edge\n  // where it is no longer a real boundary.\n  const hairpinGapStart = Math.floor(samples.length * 0.592);\n  const hairpinGapEnd = Math.ceil(samples.length * 0.61);\n  for (const side of [-1, 1]) {\n    const center = side * (half - 0.45);\n    const skipSegment = side === 1\n      ? (index) => index >= hairpinGapStart && index <= hairpinGapEnd\n      : null;\n    const line = makeRibbon(\n      samples,\n      center - 0.22,\n      center + 0.22,\n      ROAD_HEIGHT + 0.035,\n      skipSegment\n    );\n    line.material = new THREE.MeshBasicMaterial({ color: ROAD_EDGE, side: THREE.DoubleSide });\n    line.name = 'Dead Canyon pale road edge';\n    world.add(line);\n  }\n}`
          );

          replace(
            'turn/tracks/dead-canyon-world.js',
            `function makeRibbon(samples, leftOffset, rightOffset, lift = 0) {\n  const positions = [];\n  const indices = [];`,
            `function makeRibbon(samples, leftOffset, rightOffset, lift = 0, skipSegment = null) {\n  const positions = [];\n  const indices = [];`
          );

          replace(
            'turn/tracks/dead-canyon-world.js',
            `  for (let index = 0; index < samples.length; index += 1) {\n    const a = index * 2;`,
            `  for (let index = 0; index < samples.length; index += 1) {\n    if (skipSegment?.(index)) continue;\n    const a = index * 2;`
          );

          replace(
            'turn-tests/eight-track-catalog-production.mjs',
            `function driveLap(trackId, { skip = null } = {}) {`,
            `function driveLap(trackId, { skip = null, lateralOffset = 0 } = {}) {`
          );

          replace(
            'turn-tests/eight-track-catalog-production.mjs',
            `    state.position.copy(sample.point);\n    state.velocity.copy(sample.tangent).multiplyScalar(30);`,
            `    state.position.copy(sample.point).addScaledVector(sample.normal, lateralOffset);\n    state.velocity.copy(sample.tangent).multiplyScalar(30);`
          );

          replace(
            'turn-tests/eight-track-catalog-production.mjs',
            `for (const [trackId, checkpoints] of [['beachfront', BEACHFRONT_CHECKPOINTS], ['dead-canyon', DEAD_CANYON_CHECKPOINTS]]) {\n  const full = driveLap(trackId);\n  assert.equal(full.state.lapInvalid, false, \`${'${trackId}'}: a full lap stays valid\`);\n  assert.equal(full.completed, 1, \`${'${trackId}'}: a full lap completes at the start gate\`);\n  const shortcut = driveLap(trackId, { skip: [0.3, 0.6] });\n  assert.equal(shortcut.completed, 0, \`${'${trackId}'}: a shortcut never completes a lap\`);\n  assert.ok(checkpoints !== LAP_CHECKPOINTS);\n}\n`,
            `for (const [trackId, checkpoints] of [['beachfront', BEACHFRONT_CHECKPOINTS], ['dead-canyon', DEAD_CANYON_CHECKPOINTS]]) {\n  const full = driveLap(trackId);\n  assert.equal(full.state.lapInvalid, false, \`${'${trackId}'}: a full lap stays valid\`);\n  assert.equal(full.completed, 1, \`${'${trackId}'}: a full lap completes at the start gate\`);\n  const shortcut = driveLap(trackId, { skip: [0.3, 0.6] });\n  assert.equal(shortcut.completed, 0, \`${'${trackId}'}: a shortcut never completes a lap\`);\n  assert.ok(checkpoints !== LAP_CHECKPOINTS);\n}\nassert.equal(DEAD_CANYON_CHECKPOINTS[14], 0.59, 'DEAD CANYON moves the hairpin gate off the 60% cusp');\nconst deadCanyonInsideHairpin = driveLap('dead-canyon', { lateralOffset: 27 / 2 });\nassert.equal(deadCanyonInsideHairpin.state.lapInvalid, false,\n  'DEAD CANYON: the legal inside road edge through the hairpin must not become LAP VOID');\nassert.equal(deadCanyonInsideHairpin.completed, 1,\n  'DEAD CANYON: the inside hairpin line still completes the ordered checkpoint chain');\n`
          );

          replace(
            'turn-tests/harbor-surface-browser-smoke.mjs',
            `          const surfaces = [];\n          world.traverse((node) => {\n            if (id === 'dead-canyon' && /^(Dead Canyon route terrain|Dead Canyon shoulder)$/.test(node.name)) surfaces.push(node);\n            if (id === 'mountain' && /^Mountain Kenney (irregular|overlapping) roadside snow/.test(node.name)) surfaces.push(node);\n          });`,
            `          const surfaces = [];\n          const roadEdges = [];\n          world.traverse((node) => {\n            if (id === 'dead-canyon' && /^(Dead Canyon route terrain|Dead Canyon shoulder)$/.test(node.name)) surfaces.push(node);\n            if (id === 'dead-canyon' && node.name === 'Dead Canyon pale road edge') roadEdges.push(node);\n            if (id === 'mountain' && /^Mountain Kenney (irregular|overlapping) roadside snow/.test(node.name)) surfaces.push(node);\n          });`
          );

          replace(
            'turn-tests/harbor-surface-browser-smoke.mjs',
            `          const examples = [];\n          for (let index = 0; index < samples.length; index++) {`,
            `          const examples = [];\n          let checkedHairpinInterior = 0;\n          let hairpinEdgeIntrusions = 0;\n          const hairpinEdgeExamples = [];\n          for (let index = 0; index < samples.length; index++) {`
          );

          replace(
            'turn-tests/harbor-surface-browser-smoke.mjs',
            `          checked.push({ id, surfaceCount: surfaces.length, checkedRoadPoints, coveredRoadPoints, missingRoadPoints, examples });`,
            `          if (id === 'dead-canyon') {\n            for (let index = 1240; index <= 1380; index += 1) {\n              for (let step = -15; step <= 15; step += 1) {\n                const fraction = step / 20;\n                const sample = samples[index];\n                const point = sample.point.clone().addScaledVector(sample.normal, fraction * 27 / 2);\n                point.y += 30;\n                rays.set(point, downward);\n                const asphalt = rays.intersectObject(road, false)[0];\n                const edge = rays.intersectObjects(roadEdges, true)[0];\n                checkedHairpinInterior += 1;\n                if (edge && asphalt && edge.distance < asphalt.distance - 0.005) {\n                  hairpinEdgeIntrusions += 1;\n                  if (hairpinEdgeExamples.length < 4) hairpinEdgeExamples.push({ index, fraction });\n                }\n              }\n            }\n          }\n          checked.push({\n            id, surfaceCount: surfaces.length, checkedRoadPoints, coveredRoadPoints, missingRoadPoints, examples,\n            checkedHairpinInterior, hairpinEdgeIntrusions, hairpinEdgeExamples\n          });`
          );

          replace(
            'turn-tests/harbor-surface-browser-smoke.mjs',
            `  assert.equal(result.coveredRoadPoints, 0, \`${'${result.id}'}: scenery must not cover asphalt: ${'${JSON.stringify(result.examples)}'}\`);\n}`,
            `  assert.equal(result.coveredRoadPoints, 0, \`${'${result.id}'}: scenery must not cover asphalt: ${'${JSON.stringify(result.examples)}'}\`);\n  if (result.id === 'dead-canyon') {\n    assert.ok(result.checkedHairpinInterior > 4000, 'dead-canyon: densely probe the hairpin interior');\n    assert.equal(result.hairpinEdgeIntrusions, 0,\n      \`dead-canyon: decorative road edge must not cut across the hairpin: ${'${JSON.stringify(result.hairpinEdgeExamples)}'}\`);\n  }\n}`
          );

          fs.writeFileSync('turn/release.json', JSON.stringify({
            version: '1.36.40',
            id: '2026.10.06-r402',
            cacheKey: '20261006-r402'
          }, null, 2) + '\n');
          NODE

          node turn/scripts/release.mjs --write
          node turn/scripts/release.mjs --check
          node turn-tests/eight-track-catalog-production.mjs
          node turn-tests/release-composition-production.mjs --base origin/main

      - name: Commit repair and release surfaces
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turn turn-tests yourturn
          git commit -m "TURN 1.36.40 r402: fix DEAD CANYON hairpin [dead-canyon-fix]" -m "Co-authored-by: SOL <solavatar@openai.com>" -m "Co-authored-by: ASTRA <astraavatar@ai-assistant.local>"
          git push origin HEAD:sol/dead-canyon-hairpin-void

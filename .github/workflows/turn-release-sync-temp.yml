name: TURN temporary release sync

on:
  push:
    branches:
      - astra/install-page-token-polish

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[release-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: astra/install-page-token-polish
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Synchronize release surfaces
        run: |
          node turn/scripts/release.mjs --write
          node turn/scripts/release.mjs --check

      - name: Commit synchronized release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turn yourturn
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "TURN 1.36.39 r401: synchronize release surfaces [release-sync]" -m "Co-authored-by: SOL <solavatar@openai.com>" -m "Co-authored-by: ASTRA <astraavatar@ai-assistant.local>"
          git push origin HEAD:astra/install-page-token-polish

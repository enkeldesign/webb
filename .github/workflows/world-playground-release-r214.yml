name: Prepare TURN 1.19.0 r214 playground release

on:
  push:
    branches:
      - feature/how-to-play-world-playground

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/how-to-play-world-playground
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update release identity and release notes
        run: |
          cat > turn/release.json <<'EOF'
          {
            "version": "1.19.0",
            "id": "2026.09.11-r214",
            "cacheKey": "20260911-r214"
          }
          EOF

          node turn/scripts/release.mjs --write

          python - <<'PY'
          from pathlib import Path
          import re

          history = Path('turn/content/about-history.js')
          text = history.read_text()

          if "The six tracks become one miniature world" not in text:
              history_entry = """\n  {\n    period: '11 September',\n    title: 'The six tracks become one miniature world',\n    paragraphs: [\n      'HOW TO PLAY gains a playable miniature TURN world: one oversized continuous road links Harbor, the coastal Cliffside, Mountain, Midnight City, Countryside and Airport using the geography established for the wider TURN setting rather than combining the six competitive race circuits.',\n      'Each district reuses TURN landmarks and visual language at model-world scale — Harbor containers, cranes and ships; Cliffside houses, rocks and ocean liner; Mountain village, river and waterfall; Midnight City skyscrapers, parks, neon and directional signs; Countryside farms, trees and windmill; and Airport runway, control tower and aircraft.',\n      'The playground is deliberately untimed. HOW TO PLAY launches it directly in the Learner Car, lap timing and records stay dormant, and invisible shore and mountain-range boundaries keep free roaming inside the coastal world without producing LAP VOID.'\n    ],\n    milestones: [\n      'Explore the world of TURN action in HOW TO PLAY',\n      'One continuous model-world road loop across all six track identities',\n      'Untimed Learner Car free roam with shore and mountain containment',\n      'TURN 1.19.0 · 2026.09.11-r214 world-playground release'\n    ]\n  }"""
              marker = "\n]);\n\nexport const CHANGELOG = Object.freeze(["
              if marker not in text:
                  raise SystemExit('DEVELOPMENT_HISTORY closing marker not found')
              text = text.replace(marker, "," + history_entry + marker, 1)

          if "['1.19.0 r214'" not in text:
              changelog_entry = """\n  {\n    date: '11 September',\n    entries: [\n      ['1.19.0 r214', 'Adds the HOW TO PLAY TURN world playground: an untimed Learner Car free-roam loop through miniature versions of Harbor, Cliffside, Mountain, Midnight City, Countryside and Airport.'],\n      ['World layout', 'Uses the coastal TURN world map as geography, with Harbor on the western sea, Cliffside climbing north to Mountain, the city in the centre, Countryside toward the east and Airport beyond it.'],\n      ['Model-world landmarks', 'Reuses classic scenery families and track motifs while keeping one shared road rather than six isolated race courses.'],\n      ['Free-roam safety', 'Keeps timing, records and LAP VOID dormant and contains the world with invisible shore and mountain-range walls that preserve useful tangential motion.']\n    ]\n  }"""
              marker = "\n]);\n\nexport const CURRENT_RELEASE = Object.freeze({"
              if marker not in text:
                  raise SystemExit('CHANGELOG closing marker not found')
              text = text.replace(marker, "," + changelog_entry + marker, 1)

          text = re.sub(
              r"export const CURRENT_RELEASE = Object\.freeze\(\{[\s\S]*?\}\);",
              """export const CURRENT_RELEASE = Object.freeze({\n  version: '1.19.0',\n  build: '2026.09.11-r214',\n  note: 'TURN 1.19.0 turns HOW TO PLAY into a place to explore with one miniature coastal world connecting all six track identities.'\n});""",
              text,
              count=1
          )
          history.write_text(text)

          bootstrap = Path('turn/ui/about-history-bootstrap-r165.js')
          text = bootstrap.read_text()
          text = re.sub(r"about-history\.js\?build=\d{8}-r\d+", "about-history.js?build=20260911-r214", text)
          bootstrap.write_text(text)

          for filename in ['turn/design.html', 'turn/design-dialogs.html']:
              path = Path(filename)
              text = path.read_text()
              text = re.sub(r'TURN 1\.18\.0', 'TURN 1.19.0', text)
              text = re.sub(r'Build 2026\.09\.11-r213', 'Build 2026.09.11-r214', text)
              path.write_text(text)

          yourturn = Path('yourturn/index.html')
          text = yourturn.read_text().replace('20260911-r213', '20260911-r214')
          yourturn.write_text(text)
          PY

          node turn-next/scripts/build-parity-app.mjs
          node turn-next/scripts/build-parity-main.mjs
          node turn-next/scripts/build-parity-entry.mjs

      - name: Verify release and playground contracts
        run: |
          node --check turn/training/world-playground-course.js
          node --check turn/training/world-playground-entry.js
          node --check turn/training/world-playground.js
          node turn-tests/world-playground-production.mjs
          node turn-tests/how-to-play-guide-production.mjs
          node turn/scripts/release.mjs --check
          node turn-next/scripts/build-parity-app.mjs --check
          node turn-next/scripts/build-parity-main.mjs --check
          node turn-next/scripts/build-parity-entry.mjs --check
          node turn-tests/release-production.mjs
          node turn-tests/about-history-production.mjs
          node turn-tests/release-composition-production.mjs --base ea8f1f70e2a3149099c7f3e33d8f4e9fcbb29383

      - name: Commit TURN 1.19.0 r214
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turn turn-lab turn-next yourturn
          git commit -m "Release TURN 1.19.0 r214" || exit 0
          git push origin HEAD:feature/how-to-play-world-playground

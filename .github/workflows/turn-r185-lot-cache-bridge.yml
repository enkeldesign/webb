name: TURN r185 Lot cache bridge finalizer

on:
  push:
    branches:
      - track-difficulty-release-r185

permissions:
  contents: write

jobs:
  bridge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: track-difficulty-release-r185
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preserve the previous installed-PWA Lot runtime URL
        run: |
          python3 - <<'PY'
          from pathlib import Path
          current = '        "/turn/garage/lot-enhancement-runtime.js?revision=r164-post-soak&build=20260831-r185": "/turn/garage/lot-enhancement-runtime.js?revision=r223-training-car-taxi&build=20260831-r185",'
          legacy = '        "/turn/garage/lot-enhancement-runtime.js?revision=r164-post-soak&build=20260826-r184": "/turn/garage/lot-enhancement-runtime.js?revision=r223-training-car-taxi&build=20260831-r185",'
          for name in ['turn/index.html', 'turn-lab/index.html']:
              path = Path(name)
              text = path.read_text()
              if legacy in text:
                  continue
              if current not in text:
                  raise SystemExit(f'Current Lot runtime mapping missing from {name}')
              path.write_text(text.replace(current, legacy + '\n' + current, 1))
          PY
      - name: Verify release and Lot compatibility contracts
        run: |
          node turn/scripts/release.mjs --check
          node turn-lab/tests/paint-lock-observer-production.mjs
          node turn-lab/tests/mountain-long-lab.mjs
      - name: Remove helper and publish bridge
        run: |
          rm -f .github/workflows/turn-r185-lot-cache-bridge.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Preserve r184 Lot runtime cache bridge'
          git push origin HEAD:track-difficulty-release-r185

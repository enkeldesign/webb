name: Sync garage wheel cache contract

on:
  push:
    branches:
      - feature/turn-steering-wheels-kenney-monster
    paths:
      - '.github/workflows/sync-garage-wheel-cache-contract.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/turn-steering-wheels-kenney-monster
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sync garage cache assertions
        run: node turn-tests/sync-garage-wheel-cache-contract.mjs
      - name: Verify garage plus wheel/palette contracts
        run: |
          node turn-lab/tests/garage-production.mjs
          node turn-lab/tests/car-orientation-production.mjs
          node turn-lab/tests/semantic-car-finish-production.mjs
      - name: Remove sync scaffolding
        run: |
          rm -f turn-tests/sync-garage-wheel-cache-contract.mjs
          rm -f .github/workflows/sync-garage-wheel-cache-contract.yml
      - name: Commit contract sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync garage steering-wheel cache contract [garage-cache]"
          git push origin HEAD:feature/turn-steering-wheels-kenney-monster

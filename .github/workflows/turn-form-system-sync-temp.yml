name: Synchronize TURN form and disclosure system

on:
  push:
    branches:
      - agent/turn-form-disclosure-system

permissions:
  contents: write

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/turn-form-disclosure-system

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Wire production and update references
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          def replace_once(source, old, new, label):
              if old not in source:
                  raise SystemExit(f'Missing expected {label}')
              return source.replace(old, new, 1)

          app_path = Path('turn/app.js')
          app = app_path.read_text()
          old_styles = """installStylesheet(
            './m8-how-to-play-r126.css?revision=r134-contained-disclosure',
            'data-turn-m8-how-to-play'
          );"""
          new_styles = """installStylesheet(
            './m8-how-to-play-r126.css?revision=r141-form-disclosure',
            'data-turn-m8-how-to-play'
          );
          installStylesheet(
            './settings-components-r141.css?revision=r141-form-disclosure',
            'data-turn-settings-components'
          );"""
          app = replace_once(app, old_styles, new_styles, 'How to Play stylesheet block')
          app = app.replace(
              "withBuild('./ui/how-to-play-guide.js?revision=r134-contained-disclosure')",
              "withBuild('./ui/how-to-play-guide.js?revision=r141-form-disclosure')"
          )
          app_path.write_text(app)

          test_path = Path('turn-tests/how-to-play-guide-production.mjs')
          test = test_path.read_text().replace('r134-contained-disclosure', 'r141-form-disclosure')
          test = test.replace(
              "GUIDE_VERSION = 'r134-contained-drive-by-ear-disclosure'",
              "GUIDE_VERSION = 'r141-form-disclosure-system'"
          )
          test = test.replace(
              "assert.match(guide, /<summary>Explore the Drive By Ear sounds<\\/summary>/);",
              "assert.match(guide, /<summary><span class=\"m8-disclosure-symbol\" aria-hidden=\"true\"><\\/span><span>Explore the Drive By Ear sounds<\\/span><\\/summary>/);"
          )
          test = test.replace(
              "/<summary>Explore the Drive By Ear sounds<\\/summary>[\\s\\S]*<div class=\"m8-dbe-guide-panel\">[\\s\\S]*<div class=\"m8-dbe-guide-content\">/",
              "/<summary><span class=\"m8-disclosure-symbol\" aria-hidden=\"true\"><\\/span><span>Explore the Drive By Ear sounds<\\/span><\\/summary>[\\s\\S]*<div class=\"m8-dbe-guide-panel\">[\\s\\S]*<div class=\"m8-dbe-guide-content\">/"
          )
          test_path.write_text(test)

          workflow_path = Path('.github/workflows/turn-lab-tests.yml')
          workflow = workflow_path.read_text()
          marker = """      - name: Run TURN design-system specimen regression
                run: node turn-tests/design-system-production.mjs
          """
          addition = marker + """
                - name: Run native form and disclosure regression
                  run: node turn-tests/form-disclosure-system.mjs
          """
          if 'Run native form and disclosure regression' not in workflow:
              workflow = replace_once(workflow, marker, addition, 'design-system workflow step')
          workflow_path.write_text(workflow)

          design_path = Path('turn/design.html')
          design = design_path.read_text()
          design = design.replace('r140-difficulty-system', 'r141-form-disclosure')
          design = design.replace('TURN V1.3.1 · BUILD 2026.08.02-R123', 'TURN V1.3.2 · BUILD 2026.08.02-R124')

          table_row = """            <tr><td>Difficulty</td><td>Easy green 200, Medium yellow 200, Hard red 200</td><td>Text label remains mandatory; colour is supporting information</td></tr>
          """
          table_addition = table_row + """            <tr><td>Form controls</td><td>Paper idle state, Pink selected state, Blue focus ring</td><td>Radio buttons, checkboxes and range inputs retain native semantics</td></tr>
                      <tr><td>Disclosure</td><td>Blue trigger, Paper panel, state symbol beside the label</td><td>Native details and summary communicate expanded and collapsed state</td></tr>
          """
          if '<td>Form controls</td>' not in design:
              design = replace_once(design, table_row, table_addition, 'design inventory difficulty row')

          css_marker = """    .about-link:hover { text-decoration-thickness: 3px; }

              .screens {"""
          css_addition = """    .about-link:hover { text-decoration-thickness: 3px; }

              .form-system-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; align-items: start; }
              .form-card { position: relative; min-width: 0; margin: 0; padding: 18px; border: 4px solid var(--turn-ink); border-radius: var(--turn-radius-default); background: var(--turn-surface-raised); box-shadow: var(--turn-shadow-default); }
              .form-card legend, .form-card > h3 { display: table; width: fit-content; max-width: calc(100% - 24px); padding: 0 8px; background: var(--turn-surface-raised); font-size: 1.25rem; font-weight: 950; line-height: 1.1; }
              .form-card legend { margin-inline-start: 2px; }
              .form-card > h3 { position: relative; z-index: 1; margin: -31px 0 14px 2px; }
              .form-option { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 12px; margin-top: 12px; cursor: pointer; }
              .form-option strong, .form-option small { display: block; }
              .form-option small { margin-top: 2px; line-height: 1.3; }
              .form-control { appearance: none; width: 30px; height: 30px; margin: 0; border: 4px solid var(--turn-ink); background-color: var(--turn-form-control-idle); background-position: center; background-repeat: no-repeat; }
              .form-control[type='radio'] { border-radius: var(--turn-radius-circle); }
              .form-control[type='radio']:checked { background: radial-gradient(circle, var(--turn-form-control-idle) 0 27%, transparent 30%), var(--turn-form-control-selected); }
              .form-control[type='checkbox'] { border-radius: var(--turn-radius-micro); }
              .form-control[type='checkbox']:checked { background-color: var(--turn-form-control-selected); background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 24 24'%3E%3Cpath d='M4 12.5 9.5 18 20 6.5' fill='none' stroke='%2308090a' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"); background-size: 21px 21px; }
              .form-control:focus-visible { outline: 5px solid var(--turn-form-control-focus); outline-offset: 4px; }
              .disclosure-sample { overflow: hidden; border: 4px solid var(--turn-ink); border-radius: var(--turn-radius-default); background: var(--turn-disclosure-panel); box-shadow: var(--turn-shadow-default); }
              .disclosure-sample summary { display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 12px 16px; background: var(--turn-disclosure-trigger); cursor: pointer; list-style: none; font-weight: 950; }
              .disclosure-sample summary::-webkit-details-marker { display: none; }
              .disclosure-symbol { flex: 0 0 auto; display: grid; place-items: center; width: 32px; height: 32px; border: 3px solid var(--turn-ink); border-radius: var(--turn-radius-circle); background: var(--turn-disclosure-panel); font-size: 1.35rem; line-height: 1; }
              .disclosure-symbol::before { content: '+'; }
              .disclosure-sample[open] .disclosure-symbol::before { content: '−'; }
              .disclosure-panel { padding: 16px; border-top: 3px solid var(--turn-ink); background: var(--turn-disclosure-panel); }
              .disclosure-panel p { margin: 0; }

              .screens {"""
          if '.form-system-grid {' not in design:
              design = replace_once(design, css_marker, css_addition, 'design form CSS marker')

          pattern_marker = """        <div>
                    <span class="token-label">Header metadata</span>
                    <div style="margin-top:12px"><span class="metadata-pattern"><span>TURN V1.3.2 · BUILD 2026.08.02-R124</span><button class="about-link" type="button">ABOUT TURN</button></span></div>
                    <p style="margin:12px 0 0"><strong>ABOUT TURN is visually a link but semantically a button</strong> because it opens a dialog. It has no hard shadow, fill or border. Underline, placement and a strong focus ring keep it discoverable without competing with the menu.</p>
                  </div>
          """
          pattern_addition = pattern_marker + """        <div>
                    <span class="token-label">Native form controls</span>
                    <div class="form-system-grid" style="margin-top:18px">
                      <fieldset class="form-card">
                        <legend>Steering</legend>
                        <label class="form-option"><input class="form-control" type="radio" name="designSteering" checked><span><strong>Device rotation</strong><small>Turn the whole device like a steering wheel.</small></span></label>
                        <label class="form-option"><input class="form-control" type="radio" name="designSteering"><span><strong>On-screen steering</strong><small>Use the steering control or a keyboard.</small></span></label>
                      </fieldset>
                      <section class="form-card" aria-labelledby="designAudioTitle">
                        <h3 id="designAudioTitle">Audio</h3>
                        <label class="form-option"><input class="form-control" type="checkbox" checked><span><strong>Sound</strong><small>Turn every TURN sound on or off.</small></span></label>
                        <label class="form-option"><input class="form-control" type="checkbox"><span><strong>Drive By Ear™</strong><small>Spatial steering guidance and race information.</small></span></label>
                      </section>
                    </div>
                    <p style="margin:14px 0 0"><strong>Legend and heading elements share one floating card-title treatment.</strong> Radio buttons and Checkboxes use the same Paper shell, Pink selected state, black outline and Blue focus ring while retaining their correct native roles.</p>
                  </div>
                  <div>
                    <span class="token-label">Disclosure</span>
                    <details class="disclosure-sample" style="margin-top:12px">
                      <summary><span class="disclosure-symbol" aria-hidden="true"></span><span>Explore the Drive By Ear sounds</span></summary>
                      <div class="disclosure-panel"><p><strong>Blue trigger, Paper panel.</strong> The decorative state symbol sits directly before the summary text, while the native details element exposes the expanded or collapsed state.</p></div>
                    </details>
                  </div>
          """
          if 'Native form controls' not in design:
              design = replace_once(design, pattern_marker, pattern_addition, 'header metadata pattern')

          design_path.write_text(design)
          PY

      - name: Generate release identities
        run: |
          node turn/scripts/release.mjs --write
          node turn-next/scripts/build-parity-app.mjs
          node turn-next/scripts/build-parity-main.mjs

      - name: Synchronize TURN NEXT entry metadata
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          release = json.loads(Path('turn/release.json').read_text())
          path = Path('turn-next/index.html')
          source = path.read_text()
          old_version = re.search(r"version: '(\d+\.\d+\.\d+)'", source).group(1)
          old_id = re.search(r"id: '(\d{4}\.\d{2}\.\d{2}-r\d+)'", source).group(1)
          old_cache = re.search(r"cacheKey: '(\d{8}-r\d+)'", source).group(1)
          source = source.replace(f'<!-- TURN {old_id} release identity -->', f'<!-- TURN {release["id"]} release identity -->')
          source = source.replace(f'TURN NEXT · Source TURN v{old_version} · Build {old_id}', f'TURN NEXT · Source TURN v{release["version"]} · Build {release["id"]}')
          source = source.replace(f"version: '{old_version}'", f"version: '{release['version']}'")
          source = source.replace(f"id: '{old_id}'", f"id: '{release['id']}'")
          source = source.replace(f"cacheKey: '{old_cache}'", f"cacheKey: '{release['cacheKey']}'")
          source = source.replace(old_cache, release['cacheKey'])
          path.write_text(source)
          PY

      - name: Verify generated release files
        run: |
          node turn/scripts/release.mjs --check
          node turn-next/scripts/build-parity-app.mjs --check
          node turn-next/scripts/build-parity-main.mjs --check
          node turn-next/scripts/build-parity-entry.mjs --check
          node turn-tests/form-disclosure-system.mjs

      - name: Commit synchronized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turn/app.js turn/design.html turn/index.html turn-next/app.js turn-next/main.js turn-next/index.html turn-tests/how-to-play-guide-production.mjs .github/workflows/turn-lab-tests.yml
          git commit -m "Apply TURN native form and disclosure system"
          git push origin HEAD:agent/turn-form-disclosure-system

name: TURN r247 factory paint sync

on:
  push:
    branches:
      - sol/factory-secondary-colors-r247

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply r247 source changes
        run: node .github/scripts/turn-r247-factory-paint-sync.mjs
      - name: Synchronize release-facing surfaces
        run: node turn/scripts/release.mjs --write
      - name: Run focused factory paint regressions
        run: |
          node turn-tests/tractor-smv-production.mjs
          node turn-lab/tests/native-paint-production.mjs
          node turn-lab/tests/garage-production.mjs
          node turn-lab/tests/vehicle-drift-production.mjs
          node turn-lab/tests/emergency-livery-layering-production.mjs
          node turn-lab/tests/car-orientation-production.mjs
      - name: Verify release source of truth
        run: node turn/scripts/release.mjs --check
      - name: Commit r247
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add turn turn-lab turn-next yourturn turn-tests
          git commit -m 'Retune Tractor and AWD factory secondary colours and publish r247'
          git push

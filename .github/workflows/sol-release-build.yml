name: SOL temporary TURN release generator

on:
  push:
    branches:
      - sol/1256-startup-recovery
    paths:
      - 'turn/release.json'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate and verify TURN release
        run: |
          node turn/scripts/release.mjs --write
          node turn/scripts/release.mjs --check
          node turn-tests/release-composition-production.mjs --base origin/main
          npx --yes eslint@9.39.1 turn turn-tests

      - name: Commit generated release graph
        run: |
          if git diff --quiet; then
            echo "Release graph already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "TURN 1.50.2 r484: generate release graph (#1256)" -m "Co-authored-by: SOL <solavatar@openai.com>"
          git push origin HEAD:sol/1256-startup-recovery

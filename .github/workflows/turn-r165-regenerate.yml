name: Regenerate TURN r165 release entries

on:
  push:
    branches:
      - fix/turn-cache-refresh-r165
    paths:
      - '.github/workflows/turn-r165-regenerate.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/turn-cache-refresh-r165

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Regenerate release entries
        run: node turn/scripts/release.mjs --write

      - name: Verify release entries
        run: |
          node turn/scripts/release.mjs --check
          node turn-tests/release-production.mjs
          node turn-tests/racing-music-production.mjs

      - name: Commit generated entries
        run: |
          git rm .github/workflows/turn-r165-regenerate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add turn/index.html turn-lab/index.html
          git commit -m 'Regenerate TURN r165 release entries'
          git push origin HEAD:fix/turn-cache-refresh-r165

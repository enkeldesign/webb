name: Regenerate TURN r166 release entries

on:
  push:
    branches:
      - polish/signature-yellow-road-edges
    paths:
      - '.github/workflows/turn-r166-signature-yellow-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: polish/signature-yellow-road-edges

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Regenerate release identities
        run: |
          node turn/scripts/release.mjs --write
          python3 - <<'PY'
          from pathlib import Path
          path = Path('turn-next/index.html')
          text = path.read_text()
          text = text.replace('2026.08.16-r165', '2026.08.16-r166')
          text = text.replace('20260816-r165', '20260816-r166')
          path.write_text(text)
          PY
          node turn-next/scripts/build-parity-app.mjs --write
          node turn-next/scripts/build-parity-main.mjs --write

      - name: Verify generated release contracts
        run: |
          node turn/scripts/release.mjs --check
          node turn-next/scripts/build-parity-app.mjs --check
          node turn-next/scripts/build-parity-main.mjs --check
          node turn-next/scripts/build-parity-entry.mjs --check
          node turn-tests/release-production.mjs
          node turn-lab/tests/multi-track-production.mjs

      - name: Commit generated files and remove temporary workflow
        run: |
          git rm .github/workflows/turn-r166-signature-yellow-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Regenerate TURN r166 release entries'
          git push origin HEAD:polish/signature-yellow-road-edges

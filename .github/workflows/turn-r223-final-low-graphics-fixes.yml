name: TURN r223 final LOW GRAPHICS fixes

on:
  push:
    branches:
      - fix/turn-low-graphics-render-only-r223

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/turn-low-graphics-render-only-r223
          fetch-depth: 0

      - name: Patch LOW GRAPHICS producers and regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              source = p.read_text()
              if old not in source:
                  raise SystemExit(f'Expected anchor not found in {path}: {old[:120]!r}')
              p.write_text(source.replace(old, new, count))

          # COUNTRYSIDE: do not allocate the shared outline material or flag contour meshes.
          replace(
              'turn/world-assets.js',
              "import { installCountrysideWorld } from './tracks/countryside-world-r531.js?revision=r532-countryside-nature-polish';\n",
              "import { installCountrysideWorld } from './tracks/countryside-world-r531.js?revision=r532-countryside-nature-polish';\nimport { graphicsProfile } from '/turn/graphics-profile.js';\n"
          )
          replace(
              'turn/world-assets.js',
              "const blackOutlineMaterial = new THREE.MeshBasicMaterial({\n  color: 0x08090a,\n  side: THREE.BackSide\n});",
              "const blackOutlineMaterial = graphicsProfile.outlines\n  ? new THREE.MeshBasicMaterial({\n      color: 0x08090a,\n      side: THREE.BackSide\n    })\n  : null;"
          )
          replace(
              'turn/world-assets.js',
              "function addOutline(root, scale = 1.025) {\n  const meshes = [];",
              "function addOutline(root, scale = 1.025) {\n  if (!graphicsProfile.outlines) return;\n\n  const meshes = [];"
          )

          # MIDNIGHT CITY r1: keep poles/lamps/emissive meshes, but never construct real road lights in low mode.
          replace(
              'turn/tracks/midnight-city-world.js',
              "import * as THREE from 'three';\n",
              "import * as THREE from 'three';\nimport { graphicsProfile } from '/turn/graphics-profile.js';\n"
          )
          replace(
              'turn/tracks/midnight-city-world.js',
              "  for (let index = 0; index < samples.length; index += 90) {\n    const sample = samples[index];\n    const light = new THREE.PointLight(WARM_LIGHT, 7.5, 74, 1.65);\n    light.position.copy(sample.point).setY(sample.point.y + 8.4);\n    world.add(light);\n  }",
              "  if (graphicsProfile.pointLights) {\n    for (let index = 0; index < samples.length; index += 90) {\n      const sample = samples[index];\n      const light = new THREE.PointLight(WARM_LIGHT, 7.5, 74, 1.65);\n      light.position.copy(sample.point).setY(sample.point.y + 8.4);\n      world.add(light);\n    }\n  }"
          )

          # MIDNIGHT CITY r2: preserve the rig container, but skip fill-light allocation and any strengthening pass.
          replace(
              'turn/tracks/midnight-city-world-r2.js',
              "import * as THREE from 'three';\nimport { installMidnightCityWorld as installMidnightCityWorldR1 } from './midnight-city-world.js?base=20260801-r1';",
              "import * as THREE from 'three';\nimport { graphicsProfile } from '/turn/graphics-profile.js';\nimport { installMidnightCityWorld as installMidnightCityWorldR1 } from './midnight-city-world.js?build=20260913-r223';"
          )
          replace(
              'turn/tracks/midnight-city-world-r2.js',
              "  for (const side of [-1, 1]) {\n    const light = new THREE.PointLight(PLAYER_FILL, 6.2, 58, 1.72);\n    light.name = `Midnight City player fill ${side < 0 ? 'left' : 'right'}`;\n    light.position.set(side * 1.55, 2.85, 2.4);\n    light.castShadow = false;\n    rig.add(light);\n  }",
              "  if (graphicsProfile.pointLights) {\n    for (const side of [-1, 1]) {\n      const light = new THREE.PointLight(PLAYER_FILL, 6.2, 58, 1.72);\n      light.name = `Midnight City player fill ${side < 0 ? 'left' : 'right'}`;\n      light.position.set(side * 1.55, 2.85, 2.4);\n      light.castShadow = false;\n      rig.add(light);\n    }\n  }"
          )
          replace(
              'turn/tracks/midnight-city-world-r2.js',
              "function strengthenStreetLights(world) {\n  let count = 0;",
              "function strengthenStreetLights(world) {\n  if (!graphicsProfile.pointLights) return 0;\n\n  let count = 0;"
          )

          # MIDNIGHT CITY r3: projected/unlit headlights remain, but no real fill or street light may be re-enabled.
          replace(
              'turn/tracks/midnight-city-world-r3.js',
              "import * as THREE from 'three';\nimport { installMidnightCityWorld as installMidnightCityWorldR2 } from './midnight-city-world-r2.js?base=20260801-r2';",
              "import * as THREE from 'three';\nimport { graphicsProfile } from '/turn/graphics-profile.js';\nimport { installMidnightCityWorld as installMidnightCityWorldR2 } from './midnight-city-world-r2.js?build=20260913-r223';"
          )
          replace(
              'turn/tracks/midnight-city-world-r3.js',
              "  const fill = new THREE.PointLight(PLAYER_FILL, 3.1, 17, 2);\n  fill.name = 'Midnight City player visibility fill';\n  fill.position.set(0, 2.55, 0.45);\n  fill.castShadow = false;\n  rig.add(fill);",
              "  if (graphicsProfile.pointLights) {\n    const fill = new THREE.PointLight(PLAYER_FILL, 3.1, 17, 2);\n    fill.name = 'Midnight City player visibility fill';\n    fill.position.set(0, 2.55, 0.45);\n    fill.castShadow = false;\n    rig.add(fill);\n  }"
          )
          replace(
              'turn/tracks/midnight-city-world-r3.js',
              "  let active = 0;\n  let disabled = 0;\n  for (let index = 0; index < lights.length; index += 1) {",
              "  if (!graphicsProfile.pointLights) {\n    for (const light of lights) {\n      light.visible = false;\n      light.intensity = 0;\n      light.castShadow = false;\n      light.userData.turnLowGraphicsDisabledLight = true;\n    }\n    return { active: 0, disabled: lights.length };\n  }\n\n  let active = 0;\n  let disabled = 0;\n  for (let index = 0; index < lights.length; index += 1) {"
          )

          # Advance the existing MIDNIGHT wrapper chain using generated build identity, not new revisions.
          chain = [
              ('turn/tracks/midnight-city-world-r4.js', "./midnight-city-world-r3.js?base=20260801-r3", "./midnight-city-world-r3.js?build=20260913-r223"),
              ('turn/tracks/midnight-city-world-r5.js', "./midnight-city-world-r4.js?base=20260801-r4", "./midnight-city-world-r4.js?build=20260913-r223"),
              ('turn/tracks/midnight-city-world-r6.js', "./midnight-city-world-r5.js?base=20260801-r5", "./midnight-city-world-r5.js?build=20260913-r223"),
              ('turn/tracks/midnight-city-world-r7.js', "./midnight-city-world-r6.js?base=20260801-r6", "./midnight-city-world-r6.js?build=20260913-r223"),
              ('turn/tracks/midnight-city-world-r11.js', "./midnight-city-world-r7.js?base=20260801-r7", "./midnight-city-world-r7.js?build=20260913-r223"),
              ('turn/tracks/registry.js', "./midnight-city-world-r11.js?build=20260819-r176-upward-road-normals", "./midnight-city-world-r11.js?build=20260913-r223")
          ]
          for path, old, new in chain:
              replace(path, old, new)

          # Release generator owns these build-bound wrapper identities from now on.
          release_path = Path('turn/scripts/release.mjs')
          release = release_path.read_text()
          old_companions = "  'turn/design.html',\n  'turn/design-dialogs.html'\n]);"
          new_companions = "  'turn/design.html',\n  'turn/design-dialogs.html',\n  'turn/tracks/registry.js',\n  'turn/tracks/midnight-city-world-r2.js',\n  'turn/tracks/midnight-city-world-r3.js',\n  'turn/tracks/midnight-city-world-r4.js',\n  'turn/tracks/midnight-city-world-r5.js',\n  'turn/tracks/midnight-city-world-r6.js',\n  'turn/tracks/midnight-city-world-r7.js',\n  'turn/tracks/midnight-city-world-r11.js'\n]);"
          if old_companions not in release:
              raise SystemExit('Release companion anchor not found')
          release = release.replace(old_companions, new_companions, 1)

          old_render = "  if (repositoryPath === 'turn/content/about-history-current.js') {\n    // Historical entries keep their original release identities.\n    return source.replace(\n      /(export const CURRENT_RELEASE = Object\\.freeze\\(\\{\\s*version: ')[^']+(',\\s*build: ')[^']+(')/,\n      `$1${release.version}$2${release.id}$3`\n    );\n  }\n  assert.ok(repositoryPath === 'turn/design.html' || repositoryPath === 'turn/design-dialogs.html',"
          new_render = "  if (repositoryPath === 'turn/content/about-history-current.js') {\n    // Historical entries keep their original release identities.\n    return source.replace(\n      /(export const CURRENT_RELEASE = Object\\.freeze\\(\\{\\s*version: ')[^']+(',\\s*build: ')[^']+(')/,\n      `$1${release.version}$2${release.id}$3`\n    );\n  }\n  if (repositoryPath === 'turn/tracks/registry.js') {\n    return source.replace(\n      /(await import\\(\\s*'\\.\\/midnight-city-world-r11\\.js\\?build=)[^']+('\\s*\\))/,\n      `$1${release.cacheKey}$2`\n    );\n  }\n  if (/^turn\\/tracks\\/midnight-city-world-r(?:2|3|4|5|6|7|11)\\.js$/.test(repositoryPath)) {\n    return source.replace(\n      /(from '\\.\\/midnight-city-world(?:-r\\d+)?\\.js\\?build=)[^']+(')/,\n      `$1${release.cacheKey}$2`\n    );\n  }\n  assert.ok(repositoryPath === 'turn/design.html' || repositoryPath === 'turn/design-dialogs.html',"
          if old_render not in release:
              raise SystemExit('Release companion renderer anchor not found')
          release_path.write_text(release.replace(old_render, new_render, 1))

          # Extend LOW GRAPHICS regression with producer-level and executed-path checks.
          test_path = Path('turn-tests/low-graphics-production.mjs')
          test = test_path.read_text()
          test = test.replace(
              "  startAreaSource\n] = await Promise.all([",
              "  startAreaSource,\n  worldAssetsSource,\n  midnightBaseSource,\n  midnightR2Source,\n  midnightR3Source\n] = await Promise.all([",
              1
          )
          test = test.replace(
              "  fs.readFile(new URL('../turn/tracks/start-area-polish-r519.js', import.meta.url), 'utf8')\n]);",
              "  fs.readFile(new URL('../turn/tracks/start-area-polish-r519.js', import.meta.url), 'utf8'),\n  fs.readFile(new URL('../turn/world-assets.js', import.meta.url), 'utf8'),\n  fs.readFile(new URL('../turn/tracks/midnight-city-world.js', import.meta.url), 'utf8'),\n  fs.readFile(new URL('../turn/tracks/midnight-city-world-r2.js', import.meta.url), 'utf8'),\n  fs.readFile(new URL('../turn/tracks/midnight-city-world-r3.js', import.meta.url), 'utf8')\n]);",
              1
          )
          test = test.replace(
              "  [startAreaSource, 'start-area contours']\n];",
              "  [startAreaSource, 'start-area contours'],\n  [worldAssetsSource, 'Countryside start flags']\n];",
              1
          )
          insertion = r'''

assert.match(worldAssetsSource, /const blackOutlineMaterial = graphicsProfile\.outlines/,
  'COUNTRYSIDE must not allocate the flag outline material in LOW GRAPHICS.');
assert.match(worldAssetsSource, /function addOutline\(root, scale = 1\.025\) \{\n  if \(!graphicsProfile\.outlines\) return;/,
  'COUNTRYSIDE flag outlines must return before mesh allocation.');
assert.match(midnightBaseSource, /if \(graphicsProfile\.pointLights\) \{[\s\S]*new THREE\.PointLight\(WARM_LIGHT/,
  'MIDNIGHT CITY must not construct sparse real street lights in LOW GRAPHICS.');
assert.match(midnightR2Source, /function strengthenStreetLights\(world\) \{\n  if \(!graphicsProfile\.pointLights\) return 0;/,
  'MIDNIGHT CITY r2 must not strengthen inherited PointLights in LOW GRAPHICS.');
assert.match(midnightR3Source, /if \(!graphicsProfile\.pointLights\) \{[\s\S]*return \{ active: 0, disabled: lights\.length \};/,
  'MIDNIGHT CITY final alignment must not re-enable PointLights in LOW GRAPHICS.');

const lowGraphicsProfile = Object.freeze({ outlines: false, pointLights: false });
const alignSparseStreetLights = compileFunction(midnightR3Source, 'alignSparseStreetLights', {
  graphicsProfile: lowGraphicsProfile,
  WARM_LIGHT: 0xffd27a
});
const streetLights = Array.from({ length: 12 }, () => ({
  isPointLight: true,
  color: { getHex: () => 0xffd27a },
  visible: false,
  intensity: 0,
  castShadow: false,
  userData: {},
  position: {}
}));
const streetWorld = { traverse(callback) { for (const light of streetLights) callback(light); } };
const aligned = alignSparseStreetLights(streetWorld, [{}], 27);
assert.deepEqual(aligned, { active: 0, disabled: streetLights.length },
  'Completed MIDNIGHT CITY street-light alignment must report zero active lights in LOW GRAPHICS.');
assert.ok(streetLights.every((light) => light.visible === false && light.intensity === 0),
  'Completed MIDNIGHT CITY setup must leave every real street light disabled.');

let flagOutlineAllocations = 0;
class FlagOutlineMesh {
  constructor(geometry, material) {
    flagOutlineAllocations += 1;
    this.geometry = geometry;
    this.material = material;
    this.scale = { setScalar() {} };
  }
}
const addFlagOutlineLow = compileFunction(worldAssetsSource, 'addOutline', {
  graphicsProfile: lowGraphicsProfile,
  THREE: { Mesh: FlagOutlineMesh },
  blackOutlineMaterial: {}
});
const flagMesh = { isMesh: true, geometry: {}, add() { throw new Error('LOW GRAPHICS must not attach a flag outline.'); } };
addFlagOutlineLow({ traverse(callback) { callback(flagMesh); } });
assert.equal(flagOutlineAllocations, 0,
  'LOW GRAPHICS must not allocate a COUNTRYSIDE flag outline mesh.');

let normalOutlineAllocations = 0;
class NormalFlagOutlineMesh {
  constructor(geometry, material) {
    normalOutlineAllocations += 1;
    this.geometry = geometry;
    this.material = material;
    this.scale = { setScalar() {} };
  }
}
const addFlagOutlineNormal = compileFunction(worldAssetsSource, 'addOutline', {
  graphicsProfile: { outlines: true },
  THREE: { Mesh: NormalFlagOutlineMesh },
  blackOutlineMaterial: {}
});
addFlagOutlineNormal({ traverse(callback) { callback({ isMesh: true, geometry: {}, add() {} }); } });
assert.equal(normalOutlineAllocations, 1,
  'The flag-outline regression harness must exercise the normal allocation path.');

function compileFunction(source, name, bindings) {
  const functionSource = extractFunction(source, name);
  const names = Object.keys(bindings);
  const values = Object.values(bindings);
  return Function(...names, `"use strict"; ${functionSource}; return ${name};`)(...values);
}

function extractFunction(source, name) {
  const start = source.indexOf(`function ${name}(`);
  assert.notEqual(start, -1, `Expected ${name}() in production source.`);
  const brace = source.indexOf('{', start);
  let depth = 0;
  let quote = null;
  let escaped = false;
  for (let index = brace; index < source.length; index += 1) {
    const char = source[index];
    if (quote) {
      if (escaped) escaped = false;
      else if (char === '\\') escaped = true;
      else if (char === quote) quote = null;
      continue;
    }
    if (char === '"' || char === "'" || char === '`') {
      quote = char;
      continue;
    }
    if (char === '{') depth += 1;
    else if (char === '}') {
      depth -= 1;
      if (depth === 0) return source.slice(start, index + 1);
    }
  }
  throw new Error(`Could not extract ${name}().`);
}
'''
          anchor = "\nconsole.log('LOW GRAPHICS production contract passed.');"
          if anchor not in test:
              raise SystemExit('LOW GRAPHICS test insertion anchor not found')
          test_path.write_text(test.replace(anchor, insertion + anchor, 1))

          # MIDNIGHT lighting contract follows the release-owned active wrapper identity.
          mid_test_path = Path('turn-tests/midnight-city-lighting-production.mjs')
          mid_test = mid_test_path.read_text()
          mid_test = mid_test.replace(
              "  registrySource\n] = await Promise.all([",
              "  registrySource,\n  releaseSource\n] = await Promise.all([",
              1
          ).replace(
              "  fs.readFile(new URL('../turn/tracks/registry.js', import.meta.url), 'utf8')\n]);",
              "  fs.readFile(new URL('../turn/tracks/registry.js', import.meta.url), 'utf8'),\n  fs.readFile(new URL('../turn/release.json', import.meta.url), 'utf8')\n]);",
              1
          )
          mid_test = mid_test.replace(
              "assert.match(registrySource, /midnight-city-world-r11\\.js\\?build=20260819-r176-upward-road-normals/,\n  'Production must cache-bust the Midnight City wrapper that repairs inherited surface normals');",
              "const release = JSON.parse(releaseSource);\nassert.match(registrySource, new RegExp(`midnight-city-world-r11\\\\.js\\\\?build=${release.cacheKey}`),\n  'Production must load the current-build Midnight City wrapper so nested lighting fixes cannot remain cached');",
              1
          )
          mid_test_path.write_text(mid_test)
          PY

      - name: Synchronize release surfaces
        run: |
          node turn/scripts/release.mjs --write

      - name: Validate focused fixes
        run: |
          git diff --check
          node turn/scripts/release.mjs --check
          node turn-tests/low-graphics-production.mjs
          node turn-tests/midnight-city-lighting-production.mjs
          node turn-lab/tests/mountain-long-lab.mjs
          node turn-tests/release-composition-production.mjs --base=7706952fb8f3a0f9d6320fa487af70ec0adcf4f7

      - name: Commit final r223 fixes
        run: |
          git config user.name 'enkeldesign'
          git config user.email '75029856+enkeldesign@users.noreply.github.com'
          git add turn turn-tests turn-lab/index.html turn-next yourturn
          git commit -m 'Close LOW GRAPHICS lighting and flag gaps'
          git push origin HEAD:fix/turn-low-graphics-render-only-r223

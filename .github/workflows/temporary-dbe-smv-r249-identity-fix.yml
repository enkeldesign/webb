name: Temporary DBE 101 module identity fix

on:
  push:
    branches:
      - sol/dbe-101-smv-r249

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Run DBE child module identity fix'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: sol/dbe-101-smv-r249
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply identity fix and synchronize release surfaces
        run: |
          node turn/scripts/temporary-dbe-smv-r249-identity-fix.mjs
          node turn/scripts/release.mjs --write

      - name: Verify DBE and release integrity against current main base
        run: |
          node --check turn/training/drive-by-ear-training.js
          node --check turn/scripts/release.mjs
          node turn-tests/drive-by-ear-training-production.mjs
          node turn-tests/tractor-smv-production.mjs
          node turn-tests/about-history-production.mjs
          node turn-tests/release-production.mjs
          node turn-tests/release-composition-production.mjs --base bc9299bb74cb0e8286b1f8dac2e50f2e5c062043
          node turn/scripts/release.mjs --check
          git diff --check

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "TURN: bind DBE child modules to r249 release identity"
          git push origin HEAD:sol/dbe-101-smv-r249

name: TURN vehicle visual regression

on:
  pull_request:
    branches:
      - main
    paths:
      - 'turn/assets/cars/supercar-data-*.js'
      - 'turn/assets/cars/supercar-model-data.js'
      - 'turn/vehicle/car-models.js'
      - 'turn/vehicle/catalog.js'
      - 'turn/vehicle/learner-car-livery.js'
      - 'turn/vehicle/semantic-car-finish.js'
      - 'turn/vehicle/supercar-kenney-wheels.js'
      - 'turn/vehicle/wheel-animation-rig.js'
      - 'turn/vehicle/wide-gamut.js'
      - 'turn/assets/cars/training-car.glb'
      - 'turn/design-tokens.css'
      - 'turn/styles.css'
      - 'turn/rival-onboarding.css'
      - 'turn/ui/rival-onboarding.js'
      - 'turn/garage/garage.js'
      - 'turn/garage/garage.css'
      - 'turn/garage/showroom-viewer.js'
      - 'turn/pre-race.css'
      - 'turn/garage/saved-car-paint.js'
      - 'turn/progression/trophy-road.js'
      - 'turn/graphics-profile.js'
      - 'turn/three-runtime.js'
      - 'turn/ui/low-graphics-setting.js'
      - 'turn/render/world.js'
      - 'turn/index.html'
      - 'turn/release.json'
      - 'turn-lab/supercar-lot-visual.html'
      - 'turn-lab/rival-paint-regression.html'
      - 'turn-tests/supercar-lot-visual-smoke.mjs'
      - 'turn-tests/rival-paint-webgl-regression.mjs'
      - 'turn-tests/low-graphics-production.mjs'
      - 'turn-tests/low-graphics-browser-smoke.mjs'
      - '.github/workflows/turn-supercar-lot-visual-smoke.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Chromium, WebKit and their system packages come baked into Playwright's own image
    # (pinned to the same version as the npm package), so the job never waits on apt or a
    # browser download.
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
      options: --user 1001
    # Steps in a container default to sh; the server wait loop uses bash brace expansion.
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate the authored Supercar wheel contract
        timeout-minutes: 7
        run: node turn-lab/tests/semantic-car-finish-production.mjs

      - name: Validate LOW GRAPHICS production contract
        timeout-minutes: 7
        run: node turn-tests/low-graphics-production.mjs

      - name: Install test packages
        timeout-minutes: 5
        run: npm install --no-save playwright@1.55.0 pngjs@7.0.0

      - name: Start static TURN server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/turn-vehicle-visual-http.log 2>&1 &
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8000/turn-lab/supercar-lot-visual.html >/dev/null && exit 0
            sleep 0.5
          done
          cat /tmp/turn-vehicle-visual-http.log
          exit 1

      - name: Validate LOW GRAPHICS in Chromium and WebKit
        timeout-minutes: 7
        run: node turn-tests/low-graphics-browser-smoke.mjs

      - name: Render and validate the actual GARAGE preview
        timeout-minutes: 7
        run: node turn-tests/supercar-lot-visual-smoke.mjs

      - name: Validate CHASE YOUR BEST custom paint pixels
        timeout-minutes: 7
        run: node turn-tests/rival-paint-webgl-regression.mjs

      - name: Upload Supercar Lot inspection frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supercar-lot-visual-regression
          path: supercar-lot-visual-artifact
          if-no-files-found: warn
          retention-days: 7

      - name: Upload CHASE YOUR BEST paint regression
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rival-paint-regression
          path: rival-paint-regression-artifact
          if-no-files-found: warn
          retention-days: 7

name: TURN Supercar Lot visual smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - 'turn/assets/cars/supercar-data-*.js'
      - 'turn/assets/cars/supercar-model-data.js'
      - 'turn/vehicle/car-models.js'
      - 'turn/vehicle/catalog.js'
      - 'turn/vehicle/learner-car-livery.js'
      - 'turn/vehicle/semantic-car-finish.js'
      - 'turn/vehicle/supercar-kenney-wheels.js'
      - 'turn/vehicle/wide-gamut.js'
      - 'turn/assets/cars/training-car.glb'
      - 'turn/design-tokens.css'
      - 'turn/styles.css'
      - 'turn/garage/lot-info-panel-r212.css'
      - 'turn/garage/lot-info-typography-r213.css'
      - 'turn/garage/lot-layout-r60.css'
      - 'turn/garage/lot-r10.css'
      - 'turn/garage/lot-saved-paint.js'
      - 'turn/garage/lot-saved-paint.css'
      - 'turn/garage/lot-showroom-experiment.js'
      - 'turn/garage/lot-showroom-cleanup-r201.css'
      - 'turn/garage/lot-showroom-experiment.css'
      - 'turn/garage/lot-thumbnail-composition-r211.css'
      - 'turn/progression/trophy-road.js'
      - 'turn-lab/supercar-lot-visual.html'
      - 'turn-tests/supercar-lot-visual-smoke.mjs'
      - '.github/workflows/turn-supercar-lot-visual-smoke.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate the authored Supercar wheel contract
        run: node turn-lab/tests/semantic-car-finish-production.mjs

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0 pngjs@7.0.0
          npx playwright install chromium

      - name: Start static TURN server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/turn-supercar-http.log 2>&1 &
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8000/turn-lab/supercar-lot-visual.html >/dev/null && exit 0
            sleep 0.5
          done
          cat /tmp/turn-supercar-http.log
          exit 1

      - name: Render and validate the actual Lot preview
        run: node turn-tests/supercar-lot-visual-smoke.mjs

      - name: Upload Supercar Lot inspection frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supercar-lot-visual-smoke
          path: supercar-lot-visual-artifact
          if-no-files-found: warn
          retention-days: 7

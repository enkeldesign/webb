name: Apply TURN logo divider

on:
  push:
    branches:
      - agent/turn-logo-header-divider

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/turn-logo-header-divider

      - name: Add the header divider
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('turn/m8-home-fixed-layout.css')
          source = path.read_text()
          old = """  display: block;
  width: auto;
  height: 100%;"""
          new = """  display: block;
  box-sizing: border-box;
  width: auto;
  height: 100%;
  border-inline-end: 5px solid var(--m8-ink);"""
          if old not in source:
              raise SystemExit('Expected Home logo block was not found')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Commit the divider
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turn/m8-home-fixed-layout.css
          git commit -m "Add divider beside the TURN Home icon"
          git push origin HEAD:agent/turn-logo-header-divider

name: TEMP TURN support challenge release sync

on:
  push:
    branches:
      - sol/support-challenges

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Finalize canonical identities, tests and release metadata
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(path, before, after) {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(before)) throw new Error(`${path}: expected patch marker not found`);
            fs.writeFileSync(path, source.replace(before, after));
          }

          replaceOnce(
            'turn/achievements/runtime.js',
            "} from './store.js?revision=r271-support-bonuses';",
            "} from './store.js?revision=r243-mountain-1300';"
          );

          replaceOnce(
            'turn/scripts/release.mjs',
            "function synchronizeAchievementProgressionTargets(importMap, release) {\n  const imports = importMap.imports ||= {};",
            "function synchronizeAchievementProgressionTargets(importMap, release) {\n  const imports = importMap.imports ||= {};\n  const storeTarget = `/turn/achievements/store.js?build=${release.cacheKey}`;\n  for (const specifier of [\n    '/turn/achievements/store.js',\n    '/turn/achievements/store.js?revision=r240-trophy-road-2',\n    '/turn/achievements/store.js?revision=r243-mountain-1300'\n  ]) imports[specifier] = storeTarget;"
          );

          fs.writeFileSync('turn/release.json', `${JSON.stringify({
            version: '1.20.0',
            id: '2026.09.14-r232',
            cacheKey: '20260914-r232'
          }, null, 2)}\n`);

          const historyPath = 'turn/content/about-history-current.js';
          let history = fs.readFileSync(historyPath, 'utf8');
          const historyMarker = 'const previousLatest = BASE_CHANGELOG.at(-1);';
          const supportHistory = `const SUPPORT_CHALLENGE_HISTORY = Object.freeze({\n  period: '14 September',\n  title: 'Trophy Road offers a hand when progress stalls',\n  paragraphs: Object.freeze([\n    'TURN 1.20.0 adds support challenges after six valid laps without earning trophies. It prioritises remaining WINNER opportunities when four saved rivals are available, then HOW TO PLAY, SAFETY and—once unlocked—DRIFT.',\n    'The challenge rules live in turn/support-challenges.json: thresholds, rewards, easier support targets and recommended cars can be tuned as data. Bonus trophies advance Trophy Road without creating extra achievements.'\n  ]),\n  milestones: Object.freeze([\n    'Contextual WINNER and SAFETY challenges, plus DRIFT after DRIFT ATTACK unlocks',\n    'DID YOU READ ALL OF IT? pays 5 trophies for each previously unread HOW TO PLAY part',\n    'TURN 1.20.0 · 2026.09.14-r232'\n  ])\n});\n\n`;
          if (!history.includes(historyMarker)) throw new Error('History insertion marker missing');
          history = history.replace(historyMarker, supportHistory + historyMarker);
          history = history.replace(
            '  HEAD_START_ICON_HISTORY,\n  OVERCHARGED_BOOST_HISTORY\n]);',
            '  HEAD_START_ICON_HISTORY,\n  OVERCHARGED_BOOST_HISTORY,\n  SUPPORT_CHALLENGE_HISTORY\n]);'
          );
          history = history.replace(
            "      Object.freeze(['Stronger burst, same ceiling', 'Returns immediately to ordinary BOOST power after OVERCHARGE is spent and leaves the boosted top-speed ceiling unchanged.'])",
            "      Object.freeze(['Stronger burst, same ceiling', 'Returns immediately to ordinary BOOST power after OVERCHARGE is spent and leaves the boosted top-speed ceiling unchanged.']),\n      Object.freeze(['1.20.0 r232', 'Adds adaptive Trophy Road support challenges when progress stalls: WINNER, HOW TO PLAY, SAFETY and, after it unlocks, DRIFT.']),\n      Object.freeze(['Progress without guesswork', 'Recommends an owned car, explains that a clean lap stays on-road from start to finish, awards 5 trophies for each previously unread HOW TO PLAY part, and offers a reroll after continued attempts.'])"
          );
          history = history.replace(
            "  note: 'TURN 1.19.15 makes OVERCHARGE a stronger short BOOST burst.'",
            "  note: 'TURN 1.20.0 adds adaptive Trophy Road support challenges for stalled progress.'"
          );
          fs.writeFileSync(historyPath, history);

          const testSource = `import assert from 'node:assert/strict';\nimport fs from 'node:fs/promises';\nimport {\n  SUPPORT_CHALLENGE_CONFIG_CACHE_KEY,\n  SUPPORT_CHALLENGE_CONFIG_URL,\n  loadSupportChallengeConfig,\n  normalizeSupportChallengeConfig,\n  normalizeSupportChallengeState\n} from '../turn/achievements/support-challenges.js';\nimport { createAchievementStore, normalizeAchievementState } from '../turn/achievements/store.js';\n\nconst rawConfig = JSON.parse(await fs.readFile(new URL('../turn/support-challenges.json', import.meta.url), 'utf8'));\nconst source = await fs.readFile(new URL('../turn/achievements/support-challenges.js', import.meta.url), 'utf8');\nconst config = normalizeSupportChallengeConfig(rawConfig);\n\nassert.equal(config.enabled, true);\nassert.equal(config.offerAfterValidLapsWithoutTrophy, 6);\nassert.equal(config.rerollAfterAdditionalValidLaps, 10);\nassert.equal(config.stopAtTrophies, 2300);\nassert.deepEqual(config.priority, ['winner', 'learning', 'safety', 'drift']);\nassert.equal(config.learning.title, 'DID YOU READ ALL OF IT?');\nassert.equal(config.learning.rewardPerPart, 5);\nassert.doesNotMatch(JSON.stringify(rawConfig), /disclosure/i, 'Player-facing support rules must not call HOW TO PLAY parts disclosures');\nassert.match(config.safety.cleanLapExplanation, /staying on the road from start to finish/i);\nassert.match(config.safety.cleanLapExplanation, /off-road breaks the clean lap/i);\nassert.equal(config.drift.requiredReward, 'drift-attack');\nassert.match(source, /isRewardUnlocked\(config\.drift\.requiredReward\)/, 'DRIFT support must remain gated behind the DRIFT ATTACK reward');\nassert.match(source, /storedRivalCount\(trackId[\\s\\S]*< RIVAL_LIMIT/, 'WINNER support must require all four stored rivals');\nassert.match(source, /detail\?\.onCourseThroughout === true/, 'SAFETY support must consume the physics-owned clean-lap result');\nassert.match(source, /baselineParts/, 'HOW TO PLAY support must remember what was already read before the challenge');\nassert.match(source, /REROLL CHALLENGE/, 'Continued stalled progress must expose the reroll action');\n\nconst normalized = normalizeSupportChallengeState({\n  dryValidLaps: 6.9,\n  lapsSinceChallengeProgress: 10.4,\n  completed: ['winner:countryside', 'winner:countryside'],\n  skipped: ['safety:airport']\n});\nassert.equal(normalized.dryValidLaps, 6);\nassert.equal(normalized.lapsSinceChallengeProgress, 10);\nassert.deepEqual(normalized.completed, ['winner:countryside']);\n\nconst memory = new Map();\nconst storage = {\n  getItem: (key) => memory.get(key) ?? null,\n  setItem: (key, value) => memory.set(key, String(value))\n};\nconst store = createAchievementStore(storage);\nassert.equal(store.trophyTotal(), 0);\nassert.equal(store.grantBonus('support:test', 5, { reason: 'support-test' })?.trophies, 5);\nassert.equal(store.trophyTotal(), 5);\nassert.equal(store.grantBonus('support:test', 5), null, 'A support bonus must be idempotent');\nassert.equal(store.hasBonus('support:test'), true);\nassert.equal(normalizeAchievementState(JSON.parse(memory.get('turn-achievements-v1'))).bonuses['support:test'].trophies, 5);\n\nlet requestedUrl = '';\nlet requestedOptions = null;\nconst fetched = await loadSupportChallengeConfig({\n  storage,\n  now: () => 12345,\n  fetchImpl: async (url, options) => {\n    requestedUrl = String(url);\n    requestedOptions = options;\n    return { ok: true, json: async () => rawConfig };\n  }\n});\nassert.equal(fetched.enabled, true);\nassert.match(requestedUrl, new RegExp(SUPPORT_CHALLENGE_CONFIG_URL.replaceAll('/', '\\\\/')));\nassert.match(requestedUrl, /fresh=12345/);\nassert.equal(requestedOptions?.cache, 'no-store');\nassert.ok(memory.get(SUPPORT_CHALLENGE_CONFIG_CACHE_KEY), 'Fetched rules must retain a last-known-good offline copy');\n\nconsole.log('TURN Trophy Road support challenge regression passed.');\n`;
          fs.writeFileSync('turn-tests/support-challenges-production.mjs', testSource);

          const workflowPath = '.github/workflows/turn-lab-tests.yml';
          let workflow = fs.readFileSync(workflowPath, 'utf8');
          const achievementStep = "      - name: Run achievement system regression\n        run: node turn-lab/tests/achievements-production.mjs";
          if (!workflow.includes('Run Trophy Road support challenge regression')) {
            if (!workflow.includes(achievementStep)) throw new Error('Achievement workflow insertion marker missing');
            workflow = workflow.replace(
              achievementStep,
              `${achievementStep}\n\n      - name: Run Trophy Road support challenge regression\n        run: node turn-tests/support-challenges-production.mjs`
            );
            fs.writeFileSync(workflowPath, workflow);
          }

          const achievements = fs.readFileSync('turn/achievements.js', 'utf8');
          const runtime = fs.readFileSync('turn/achievements/runtime.js', 'utf8');
          if (/r271-support/.test(achievements + runtime)) throw new Error('New manual support revision identifiers remain');
          NODE

      - name: Synchronize release surfaces
        run: node turn/scripts/release.mjs --write

      - name: Verify focused support challenge release
        run: |
          node --check turn/achievements/support-challenges.js
          node --check turn/achievements/runtime.js
          node --check turn/achievements/store.js
          node turn/scripts/release.mjs --check
          node turn-lab/tests/achievements-production.mjs
          node turn-tests/support-challenges-production.mjs
          node turn-tests/release-composition-production.mjs --base origin/main
          npx --yes eslint@9.39.1 turn/achievements/support-challenges.js turn/achievements/runtime.js turn/achievements/store.js turn-tests/support-challenges-production.mjs

      - name: Commit synchronized release and remove temporary workflow
        run: |
          rm .github/workflows/turn-support-release-sync-temp.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Release adaptive Trophy Road support challenges"
          git push origin HEAD:sol/support-challenges

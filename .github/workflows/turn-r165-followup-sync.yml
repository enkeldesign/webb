name: Sync TURN r165 About release identity

on:
  push:
    branches:
      - fix/turn-cache-refresh-r165
    paths:
      - '.github/workflows/turn-r165-followup-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/turn-cache-refresh-r165

      - name: Synchronize About release identity
        run: |
          python3 - <<'PY'
          from pathlib import Path

          bootstrap = Path('turn/ui/about-history-bootstrap-r165.js')
          text = bootstrap.read_text()
          text = text.replace(
              "../content/about-history.js?build=20260811-r164",
              "../content/about-history.js?build=20260816-r165",
          )
          bootstrap.write_text(text)

          history = Path('turn/content/about-history.js')
          text = history.read_text()
          text = text.replace(
              "build: '2026.08.11-r164'",
              "build: '2026.08.16-r165'",
          )
          history.write_text(text)
          PY

      - name: Verify About release contract
        run: node turn-tests/about-history-production.mjs

      - name: Commit synchronized About files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add turn/ui/about-history-bootstrap-r165.js turn/content/about-history.js
          git commit -m 'Synchronize About with TURN r165 cache identity'
          git push origin HEAD:fix/turn-cache-refresh-r165

name: TURN r239 feedback portability fix

on:
  push:
    branches:
      - feat/perk-feedback-overdrive-r239

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/perk-feedback-overdrive-r239
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Harden compact feedback for partial DOM environments
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('turn/achievements/support-challenge-feedback.js')
          source = p.read_text()

          before = """function installPillLaneCoordinator() {
            const tracked = new Set();
          """
          after = """function installPillLaneCoordinator() {
            if (
              typeof globalThis.MutationObserver !== 'function'
              || typeof globalThis.HTMLElement !== 'function'
              || typeof document.querySelectorAll !== 'function'
            ) return () => {};
          
            const tracked = new Set();
          """
          if source.count(before) != 1:
              raise SystemExit(f'pill coordinator marker count={source.count(before)}')
          source = source.replace(before, after, 1)

          before = "activeCompactRacePill?.remove();"
          after = "activeCompactRacePill?.remove?.();"
          if source.count(before) != 1:
              raise SystemExit(f'compact pill remove marker count={source.count(before)}')
          source = source.replace(before, after, 1)

          before = """  globalThis.requestAnimationFrame(() => {
            if (activeCompactRacePill === toast) toast.classList.add('is-visible');
          });
          """
          after = """  const reveal = () => {
            if (activeCompactRacePill === toast) toast.classList.add('is-visible');
          };
            if (typeof globalThis.requestAnimationFrame === 'function') globalThis.requestAnimationFrame(reveal);
            else globalThis.setTimeout(reveal, 0);
          """
          if source.count(before) != 1:
              raise SystemExit(f'compact pill RAF marker count={source.count(before)}')
          source = source.replace(before, after, 1)

          p.write_text(source)
          PY
      - name: Verify focused regressions
        run: |
          node turn-tests/flow-shift-accessibility-production.mjs
          node turn-tests/flow-shift-tuning-production.mjs
          node turn-tests/support-challenges-production.mjs
          node turn/scripts/release.mjs --check
          node turn-tests/release-composition-production.mjs --base-ref=origin/main
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/tmp-r239-feedback-portability.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Keep perk feedback portable across DOM environments"
          git push origin HEAD:feat/perk-feedback-overdrive-r239

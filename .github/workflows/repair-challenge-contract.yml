name: Repair challenge contract

on:
  push:
    branches:
      - feature/turn-steering-wheels-kenney-monster
    paths:
      - '.github/workflows/repair-challenge-contract.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/turn-steering-wheels-kenney-monster
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Repair only the accidental challenge-test block
        run: node turn-tests/repair-challenge-contract.mjs
      - name: Verify challenge and parity contracts
        run: |
          node turn-tests/challenge-mode-production.mjs
          node turn-next/scripts/build-parity-app.mjs --check
      - name: Remove repair scaffolding
        run: |
          rm -f turn-tests/repair-challenge-contract.mjs
          rm -f .github/workflows/repair-challenge-contract.yml
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore challenge replay contract [challenge-repair]"
          git push origin HEAD:feature/turn-steering-wheels-kenney-monster

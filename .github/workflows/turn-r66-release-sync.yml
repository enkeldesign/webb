name: TURN r66 release sync

on:
  push:
    branches:
      - agent/turn-r66-skid-ring-buffer
    paths:
      - 'turn/release.json'
      - '.github/workflows/turn-r66-release-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: agent/turn-r66-skid-ring-buffer

      - name: Synchronize production entry
        run: node turn/scripts/release.mjs --write

      - name: Commit synchronized entry
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add turn/index.html
          git commit -m "Synchronize TURN r66 release entry"
          git push

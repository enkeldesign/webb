  <script>
    /* Theme (#1067): YOUR TURN follows the device's light or dark setting, with no
       choice of its own. It sets data-theme on <html> before any stylesheet paints and
       the browser colour (theme-color) to match, and keeps following live changes. */
    (() => {
      const BROWSER = { light: '#38d9ff', dark: '#111214' };
      const root = document.documentElement;
      const media = matchMedia('(prefers-color-scheme: dark)');
      const listeners = new Set();
      const apply = () => {
        const theme = media.matches ? 'dark' : 'light';
        root.dataset.theme = theme;
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = BROWSER[theme];
        for (const listener of listeners) listener(theme);
        return theme;
      };
      media.addEventListener?.('change', apply);
      globalThis.__turnTheme = Object.freeze({
        get choice() { return 'system'; },
        get theme() { return root.dataset.theme; },
        apply,
        subscribe(listener) { listeners.add(listener); return () => listeners.delete(listener); }
      });
      apply();
    })();
  </script>

<body class="yourturn">
  <div id="game" aria-label="YOUR TURN racing challenge"></div>

  <section class="panel" id="intro" hidden aria-hidden="true">
    <button id="motionButton" type="button" hidden></button>
    <button id="manualButton" type="button" hidden></button>
    <p id="status" role="status" hidden></p>
  </section>

  <div class="hud" id="hud" hidden>
    <div class="topbar">
      <div class="stats">
        <div class="chip speed-chip">speed<strong><span id="speed">0</span> km/h</strong></div>
        <div class="chip lap-chip">lap<strong id="lap">1</strong></div>
        <div class="chip time-chip">time<strong id="lapTime">0:00.000</strong></div>
        <div class="chip best-chip">best<strong id="bestTime">--:--.---</strong></div>
        <div class="chip yourturn-target-chip" id="yourTurnTargetChip" hidden>
          <span>YOUR TURN</span>
          <strong>BEAT <b id="yourTurnTargetOpponent"></b> · <span id="yourTurnTargetTime"></span></strong>
        </div>
      </div>
      <div class="map-wrap"><canvas id="map" width="300" height="210" aria-label="Track map"></canvas></div>
    </div>
    <aside class="score-feedback" id="scoreFeedback" aria-label="Driving score" hidden>
      <div class="score-feedback-row" data-score-feedback-drift-readout>
        <div class="score-feedback-gauge-shell" data-score-channel="drift" aria-hidden="true">
          <div class="score-feedback-meter"><i data-score-feedback-meter-fill></i></div>
        </div>
        <section class="score-feedback-state" data-score-feedback-state>
          <div class="score-feedback-heading"><span data-score-feedback-label>DRIFT</span><span>COMBO</span></div>
          <div class="score-feedback-values"><strong data-score-feedback-current>0</strong><b data-score-feedback-multiplier>×1</b></div>
          <div class="score-feedback-footer">
            <div class="score-feedback-lap"><span>LAP</span><b data-score-feedback-total>0</b></div>
          </div>
        </section>
      </div>
      <div class="score-feedback-row score-feedback-flow-row" data-score-feedback-flow-readout hidden>
        <div class="score-feedback-gauge-shell" data-score-channel="flow" aria-hidden="true">
          <div class="score-feedback-gauge" data-score-channel="flow"><i data-score-feedback-flow-meter-fill></i></div>
        </div>
        <section class="score-feedback-state score-feedback-flow-state" data-score-feedback-flow-state>
          <div class="score-feedback-heading"><span>FLOW</span><span>COMBO</span></div>
          <div class="score-feedback-values"><strong data-score-feedback-flow-current>0</strong><b data-score-feedback-flow-multiplier>×1</b></div>
          <div class="score-feedback-footer">
            <div class="score-feedback-lap"><span>LAP</span><b data-score-feedback-flow-total>0</b></div>
            <div class="score-feedback-techniques" data-score-feedback-flow-techniques aria-hidden="true">
              <span></span><span></span><span></span><span></span><span></span>
            </div>
          </div>
        </section>
      </div>
      <section class="score-feedback-callout" data-score-feedback-callout aria-hidden="true" hidden>
        <strong data-score-feedback-callout-label></strong>
        <b data-score-feedback-callout-score hidden></b>
      </section>
      <p class="turn-sr-only" data-score-feedback-announcer role="status" aria-live="polite" aria-atomic="true"></p>
    </aside>
    <div class="message" id="message" role="status"></div>
    <div class="tilt-drive" aria-hidden="true">
      <span><b>brake</b><b>gas</b></span>
      <div class="tilt-track"><i class="tilt-needle" id="tiltNeedle"></i></div>
      <small class="tilt-value" id="tiltValue">neutral</small>
    </div>
  </div>

  <div class="manual-steer" id="manualSteer" role="slider" aria-label="Steering. Drag left or right." aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0" hidden>
    <span class="manual-steer-knob" aria-hidden="true"></span>
  </div>

  <div class="controls" id="controls" hidden>
    <div class="utility-group">
      <button class="utility yourturn-challenge-button" id="yourTurnChallengeButton" type="button" hidden aria-label="Open the challenge">THE CHALLENGE</button>
      <button class="utility" id="calibrateButton" type="button">Recalibrate</button>
      <button class="utility" id="resetButton" type="button">Restart Lap</button>
    </div>
    <div class="pedals">
      <button class="pedal brake" id="brakeButton" type="button">Brake</button>
      <button class="pedal gas" id="gasButton" type="button">Gas</button>
    </div>
  </div>


  <dialog class="yourturn-dialog" id="yourTurnDialog" aria-labelledby="yourTurnTitle">
    <article class="yourturn-card">
      <button class="yourturn-motion-toggle" id="yourTurnMotionToggle" type="button" hidden aria-label="Pause background motion" aria-pressed="false" title="Pause background motion">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
          <rect x="6" y="5" width="4" height="14" rx="1"></rect>
          <rect x="14" y="5" width="4" height="14" rx="1"></rect>
        </svg>
      </button>
      <header class="yourturn-card-head">
        <img src="/turn/TURNicon.PNG?icon=20260803-profile-512" alt="" aria-hidden="true">
        <div>
          <span class="yourturn-kicker">YOUR TURN</span>
          <h1 id="yourTurnTitle"></h1>
        </div>
      </header>
      <div class="yourturn-details"></div>
      <p class="yourturn-copy"></p>
      <div class="yourturn-extra"></div>
      <label class="yourturn-name-field" hidden>
        <span>Your name in the challenge</span>
        <input type="text" maxlength="24" autocomplete="nickname" placeholder="WRITE YOUR NAME HERE">
      </label>
      <p class="yourturn-dialog-status" role="status" aria-live="polite"></p>
      <div class="yourturn-actions"></div>
    </article>
  </dialog>

  <div class="yourturn-loading" id="yourTurnLoading" role="status" aria-live="polite">
    <img src="/turn/TURNicon.PNG?icon=20260803-profile-512" alt="">
    <strong>YOUR TURN</strong>
    <span>Loading challenge…</span>
  </div>

  <!-- Challenge orchestration is YOUR TURN-specific; steering is not. -->
  <script src="/turn/ui/startup-screen-reader-handoff-r529.js?build=20261007-r407&revision=r531-screen-reader-followup"></script>
  <script type="module" src="/yourturn/app.js?revision=r601-launch-recovery"></script>
  <script type="module" src="/yourturn/race-controls-r417.js?revision=r602"></script>
  <script type="module" src="/yourturn/track-map-r417.js?revision=r417"></script>
  <script type="module" src="/yourturn/racer-labels-bootstrap.js?revision=r3"></script>
  <script type="module" src="/yourturn/racer-colors.js?revision=r2"></script>
  <script type="module" src="/yourturn/start-gate.js?revision=r2-turn-camera"></script>
</body>

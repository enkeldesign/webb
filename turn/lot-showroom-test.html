<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#8ed8ff">
  <title>TURN · Showroom Lot Test</title>
  <link rel="stylesheet" href="./styles.css?showroom-test=r200">
  <link rel="stylesheet" href="./garage/lot-r10.css?showroom-test=r200">
  <link rel="stylesheet" href="./garage/lot-stat-legend.css?showroom-test=r200">
  <link rel="stylesheet" href="./garage/lot-layout-r60.css?showroom-test=r200">
  <link rel="stylesheet" href="./accessibility/color-cues-r163.css?showroom-test=r200">
  <link rel="stylesheet" href="./progression/trophy-road.css?showroom-test=r200">
  <link rel="stylesheet" href="./garage/lot-showroom-experiment.css?showroom-test=r200">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #8ed8ff; }
    .showroom-test-reopen {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #8ed8ff;
      color: #08090a;
      text-align: center;
    }
    .showroom-test-reopen[hidden] { display: none; }
    .showroom-test-reopen > div {
      max-width: 460px;
      padding: 24px;
      border: 4px solid #08090a;
      border-radius: 18px;
      background: #fff8e8;
      box-shadow: 7px 7px 0 #08090a;
    }
    .showroom-test-reopen h1 { margin: 0 0 10px; }
    .showroom-test-reopen p { margin: 0 0 18px; }
    .showroom-test-reopen button {
      min-height: 52px;
      padding: 10px 18px;
      border: 4px solid #08090a;
      border-radius: 14px;
      background: #ffd43b;
      color: #08090a;
      box-shadow: 4px 4px 0 #08090a;
      font: inherit;
      font-weight: 900;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
      "/turn/progression/trophy-road.js?revision=r166-bella-records": "/turn/progression/trophy-road-chromatic-r183.js?revision=r183-post-soak",
      "/turn/vehicle/catalog.js?build=20260720-r20": "/turn/vehicle/catalog.js?build=20260818-r175&showroom-test=r200",
      "/turn/vehicle/car-models.js?build=20260720-r22": "/turn/vehicle/emergency-livery-models.js?build=20260818-r175&showroom-test=r200",
      "/turn/performance-monitor.js?build=20260720-r20": "/turn/performance-monitor.js?build=20260818-r175&showroom-test=r200"
    }
  }
  </script>
</head>
<body>
  <section class="showroom-test-reopen" id="showroomTestReopen" hidden>
    <div>
      <h1>SHOWROOM TEST</h1>
      <p id="showroomTestResult">The test Lot was closed.</p>
      <button id="showroomTestAgain" type="button">OPEN THE LOT AGAIN</button>
    </div>
  </section>

  <script type="module">
    import { showTheLot } from './garage/lot-showroom-experiment.js?revision=r200-standalone-test';
    import {
      prepareLotEnhancements,
      enhanceLotNow
    } from './garage/lot-enhancement-runtime.js?revision=r200-showroom-test';

    const reopen = document.querySelector('#showroomTestReopen');
    const resultText = document.querySelector('#showroomTestResult');
    const again = document.querySelector('#showroomTestAgain');
    let running = false;

    async function openShowroom() {
      if (running) return;
      running = true;
      reopen.hidden = true;
      await prepareLotEnhancements();

      const resultPromise = showTheLot();
      const removeEnhancements = enhanceLotNow();
      try {
        const result = await resultPromise;
        resultText.textContent = result
          ? `Selected ${result.carId}. This standalone page stops before the race so you can test the Lot repeatedly.`
          : 'The test Lot was closed.';
      } finally {
        removeEnhancements();
        running = false;
        reopen.hidden = false;
      }
    }

    again.addEventListener('click', openShowroom);
    openShowroom().catch((error) => {
      console.error(error);
      running = false;
      resultText.textContent = `Showroom failed to start: ${error?.message || error}`;
      reopen.hidden = false;
    });
  </script>
</body>
</html>

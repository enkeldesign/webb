<!-- Car -->
<g transform="rotate(-20 400 300)">

  <!-- Main body, with windows cut out -->
  <path
    d="
      M 335 155
      H 465
      Q 500 155 500 190
      V 405
      Q 500 440 465 440
      H 335
      Q 300 440 300 405
      V 190
      Q 300 155 335 155
      Z

      M 337 210

        <ellipse cx="115" cy="235" rx="13" ry="27" fill="#151515"/>
        <ellipse cx="400" cy="244" rx="55" ry="73" fill="#080808"/>
        <ellipse cx="400" cy="244" rx="32" ry="49" fill="#666" stroke="#d8d8d8" stroke-width="9"/>
        <ellipse cx="400" cy="244" rx="14" ry="28" fill="#151515"/>
      </g>
      <path d="M65 235 Q55 168 88 120 Q112 88 171 75 L288 64 Q343 62 386 92 L449 138 Q481 160 482 205 L474 247 Q465 277 428 286 L134 286 Q79 280 65 235Z" fill="url(#car)" stroke="#0b0b0b" stroke-width="13"/>
      <path d="M139 118 Q172 77 231 70 L316 71 Q351 77 385 107 L411 137 L130 145Z" fill="#151515" stroke="#0a0a0a" stroke-width="10"/>
      <path d="M154 117 Q182 88 226 82 L252 82 L252 135 L143 136Z" fill="url(#glass)"/>
      <path d="M269 82 L315 84 Q345 89 374 113 L393 136 L269 136Z" fill="url(#glass)"/>
      <path d="M157 159 L432 158 Q461 160 466 188 L462 225 Q455 248 425 252 L133 252 Q96 246 91 218 L94 183 Q98 164 123 161Z" fill="#f5a900" opacity=".46"/>
      <path d="M286 217 L459 203 L462 251 L299 268Z" fill="#141414"/>
      <g fill="#ff2d24" stroke="#090909" stroke-width="8"><circle cx="350" cy="232" r="24"/><circle cx="407" cy="226" r="24"/></g>
      <rect x="170" y="165" width="34" height="13" rx="6" fill="#171717"/>
      <circle cx="102" cy="153" r="22" fill="#ffc400" stroke="#111" stroke-width="9"/>
      <path d="M282 101 L464 87" fill="none" stroke="#0a0a0a" stroke-width="20" stroke-linecap="round"/>
      <path d="M300 103 L296 137 M438 91 L431 125" stroke="#0a0a0a" stroke-width="13"/>
      <path d="M300 269 L462 251" stroke="#070707" stroke-width="18" stroke-linecap="round"/>
      <ellipse cx="425" cy="277" rx="22" ry="14" fill="#111" stroke="#777" stroke-width="7"/>
      <ellipse cx="472" cy="267" rx="22" ry="14" fill="#111" stroke="#777" stroke-width="7"/>
      <path d="M91 131 Q145 88 221 75" fill="none" stroke="#fff37d" stroke-width="10" stroke-linecap="round" opacity=".8"/>
    </g>

    <g transform="translate(168 78) rotate(8 345 185)" filter="url(#shadow)">
      <rect x="-26" y="-26" width="742" height="422" rx="94" fill="#050505"/>
      <g clip-path="url(#signClip)"><rect x="0" y="0" width="690" height="210" fill="url(#signSky)"/><rect x="0" y="210" width="690" height="160" fill="#00d51a"/></g>
      <rect x="0" y="0" width="690" height="370" rx="72" fill="none" stroke="#171717" stroke-width="20"/>
      <text x="345" y="260" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial Black, Arial, sans-serif" font-weight="900" font-size="205" letter-spacing="-10" fill="#050505">TURN</text>
    </g>

    <path d="M83 327 Q42 375 61 431" fill="none" stroke="#050505" stroke-width="18" stroke-linecap="round"/>
    <path d="M113 345 Q80 386 93 421" fill="none" stroke="#050505" stroke-width="16" stroke-linecap="round"/>
  </g>
  <rect x="8" y="8" width="1008" height="1008" rx="190" fill="none" stroke="#050505" stroke-width="16"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">TURN</title>
  <desc id="desc">A yellow car drifts around a black racetrack beneath a tilted TURN sign.</desc>
  <defs>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff323"/>
      <stop offset="0.48" stop-color="#ffd51a"/>
      <stop offset="1" stop-color="#ffad00"/>
    </linearGradient>
    <radialGradient id="glow" cx="35%" cy="12%" r="88%">
      <stop offset="0" stop-color="#fff98a" stop-opacity=".72"/>
      <stop offset=".45" stop-color="#fff12a" stop-opacity=".18"/>
      <stop offset="1" stop-color="#f38b00" stop-opacity=".14"/>
    </radialGradient>
    <linearGradient id="road" x1=".15" y1="0" x2=".82" y2="1">
      <stop offset="0" stop-color="#272727"/>
      <stop offset=".55" stop-color="#111"/>
      <stop offset="1" stop-color="#252525"/>
    </linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff12a"/>
      <stop offset=".42" stop-color="#ffc400"/>
      <stop offset="1" stop-color="#ef8b00"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#304d72"/>
      <stop offset=".5" stop-color="#14263f"/>
      <stop offset="1" stop-color="#05090e"/>
    </linearGradient>
    <linearGradient id="signSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39dcff"/>
      <stop offset="1" stop-color="#0dbbe6"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="190%">
      <feDropShadow dx="24" dy="28" stdDeviation="12" flood-color="#000" flood-opacity=".62"/>
    </filter>
    <filter id="carShadow" x="-50%" y="-50%" width="220%" height="240%">
      <feDropShadow dx="10" dy="18" stdDeviation="12" flood-color="#000" flood-opacity=".62"/>
    </filter>
    <clipPath id="signClip">
      <rect x="0" y="0" width="690" height="370" rx="72"/>
    </clipPath>
    <clipPath id="iconClip">
      <rect x="8" y="8" width="1008" height="1008" rx="190"/>
    </clipPath>
  </defs>

  <g clip-path="url(#iconClip)">
    <rect x="8" y="8" width="1008" height="1008" rx="190" fill="url(#yellow)"/>
    <rect x="8" y="8" width="1008" height="1008" rx="190" fill="url(#glow)"/>

    <path d="M-100 1035 C-40 755 110 490 362 398 C580 319 865 430 1125 746 L1125 1120 L-100 1120Z" fill="url(#road)"/>
    <path d="M-45 1020 C18 744 154 535 370 457" fill="none" stroke="#050505" stroke-width="188" stroke-linecap="round"/>
    <path d="M-45 1020 C18 744 154 535 370 457" fill="none" stroke="#f9f9f9" stroke-width="62" stroke-dasharray="105 105" stroke-linecap="butt"/>
    <path d="M-45 1020 C18 744 154 535 370 457" fill="none" stroke="#f02a12" stroke-width="62" stroke-dasharray="105 105" stroke-dashoffset="105" stroke-linecap="butt"/>

    <path d="M388 904 C475 949 566 966 690 950" fill="none" stroke="#020202" stroke-opacity=".78" stroke-width="16" stroke-linecap="round"/>
    <path d="M405 875 C490 916 586 928 704 909" fill="none" stroke="#020202" stroke-opacity=".7" stroke-width="12" stroke-linecap="round"/>
    <path d="M383 905 C468 946 560 960 682 944" fill="none" stroke="#4b4b4b" stroke-opacity=".38" stroke-width="4"/>
    <path d="M401 875 C488 914 579 923 697 905" fill="none" stroke="#4b4b4b" stroke-opacity=".34" stroke-width="3"/>

    <g fill="#f5f5f5" opacity=".83" filter="url(#carShadow)">

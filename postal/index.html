<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102423">
  <meta name="color-scheme" content="light">
  <title>POSTAL — Every promise has a path</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js",
        "three/addons/": "./vendor/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="loader" class="loader" role="status" aria-live="polite">
    <div class="loader-mark" aria-hidden="true">P</div>
    <strong>POSTAL</strong>
    <span>Starting the network…</span>
    <div id="load-progress" class="load-progress" aria-hidden="true"></div>
  </div>

  <main class="game-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">P</span>
        <div>
          <strong>POSTAL</strong>
          <span>Every promise has a path.</span>
        </div>
      </div>
      <div class="topbar-actions">
        <span id="clock" class="clock" aria-label="Game time">07:00</span>
        <button id="pause-btn" class="compact-btn pause-btn" type="button" aria-pressed="false">Ⅱ PAUSE</button>
      </div>
    </header>

    <nav class="city-switcher" aria-label="City">
      <button class="city-chip" type="button" data-city="sundsvall" aria-pressed="true">SUNDSVALL</button>
      <button class="city-chip" type="button" data-city="stockholm" aria-pressed="false">STOCKHOLM</button>
      <button class="city-chip" type="button" data-city="goteborg" aria-pressed="false">GÖTEBORG</button>
    </nav>

    <section class="status-strip" aria-label="Network status">
      <div class="metric"><span>ON TIME</span><strong id="metric-ontime">100%</strong></div>
      <div class="metric"><span>IN FLOW</span><strong id="metric-flow">0</strong></div>
      <div class="metric metric-issues"><span>ISSUES</span><strong id="metric-issues">0</strong></div>
      <div class="focus-status"><span>FOCUS</span><strong id="focus-value">LATE</strong></div>
    </section>

    <section class="world-card" aria-labelledby="level-title">
      <div class="world-heading">
        <div>
          <h1 id="level-title">Sundsvall depot</h1>
          <p id="level-subtitle">People sort. Parcels move. You decide what matters.</p>
        </div>
        <span class="tap-hint">Tap what moves</span>
      </div>

      <div class="viewport">
        <canvas id="scene" aria-label="Interactive 3D logistics network"></canvas>
        <button id="event-ribbon" class="event-ribbon" type="button" data-kind="warning">
          <span class="event-dot" aria-hidden="true"></span>
          <span id="event-text">Customer complaint: USA → Timrå</span>
          <span aria-hidden="true">›</span>
        </button>
      </div>
    </section>

    <div class="quick-actions" aria-label="Actions">
      <button id="focus-btn" class="quick-action" type="button">
        <span class="action-kicker">TEAM</span>
        <strong>FOCUS</strong>
      </button>
      <button id="issues-btn" class="quick-action" type="button">
        <span class="action-kicker">NEEDS YOU</span>
        <strong>ISSUES</strong>
        <span id="issue-badge" class="badge" hidden>0</span>
      </button>
      <button id="find-btn" class="quick-action" type="button">
        <span class="action-kicker">TRACE</span>
        <strong>FIND PACKAGE</strong>
      </button>
    </div>

    <nav class="level-switcher" aria-label="Network level">
      <button class="level-tab" type="button" data-level="depot" aria-pressed="true"><span>1</span>DEPOT</button>
      <button class="level-tab" type="button" data-level="region" aria-pressed="false"><span>2</span>REGION</button>
      <button class="level-tab" type="button" data-level="sweden" aria-pressed="false"><span>3</span>SWEDEN</button>
    </nav>
  </main>

  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
    <div class="sheet-handle" aria-hidden="true"></div>
    <header class="sheet-header">
      <h2 id="sheet-title">Details</h2>
      <button id="sheet-close" class="sheet-close" type="button" aria-label="Close">×</button>
    </header>
    <div id="sheet-body" class="sheet-body"></div>
  </dialog>

  <div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <noscript>POSTAL needs JavaScript to run the live logistics simulation.</noscript>
  <script type="module" src="./main.mjs"></script>
</body>
</html>
